<main>
  <header class="top">
    <div>
      <h1>Cockpit</h1>
      <p id="subtitle">Skills dieser Session</p>
      <span class="link-state" id="link"><i></i><span>Verbinde …</span></span>
    </div>
    <button class="ctx-chip" id="ctx-chip" data-context aria-label="Kontext dieser Session">
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="14" stroke-width="5"/><circle class="arc" id="chip-arc" cx="18" cy="18" r="14" stroke-width="5" style="stroke-dasharray:88 88;stroke-dashoffset:88"/></svg>
      <span><b id="chip-pct">–</b><small>Kontext</small></span>
    </button>
  </header>

  <section class="alerts" id="alerts" aria-live="assertive" hidden></section>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Was willst du tun?" autocomplete="off" aria-label="Skill suchen">
    <button class="clear" id="clear" aria-label="Suche leeren" hidden>✕</button>
  </label>

  <div id="home" style="display:flex;flex-direction:column;gap:22px">
    <section class="block" aria-label="Vorschläge">
      <h2 class="label"><span>Vorschläge</span></h2>
      <div class="suggest" id="suggest"></div>
      <div class="chips" id="chips"></div>
    </section>
    <section class="block" aria-label="Bereiche">
      <h2 class="label"><span>Bereiche</span><button class="pill" id="done" hidden>Fertig</button></h2>
      <div class="wallet" id="wallet"></div>
    </section>
  </div>

  <section class="block" id="results" hidden aria-live="polite"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grab" id="grab"><i></i></div>
  <div class="pass" id="pass"></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="cscrim" id="cscrim" hidden></div>
<section class="composer" id="composer" role="dialog" aria-modal="true" aria-labelledby="c-title" hidden>
  <div class="c-head">
    <button class="c-cancel" data-cancel>Abbrechen</button>
    <b id="c-title">Aufgabe</b>
    <button class="c-send" id="c-send" data-send disabled>Starten</button>
  </div>
  <div class="c-body">
    <span class="tile" id="c-tile" aria-hidden="true"></span>
    <textarea id="task" maxlength="3000" rows="4" aria-label="Aufgabe für den Skill" placeholder="Was soll der Skill tun?"></textarea>
  </div>
  <div class="c-foot"><span>Claude startet den Skill damit.</span><span id="c-count">0/3000</span></div>
</section>
<div class="island" id="island" role="status" aria-live="polite"><span class="ii"></span><div><b></b><span></span></div><span class="spin ispin" hidden></span></div>

<script type="application/json" id="index">__INDEX__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('index').textContent)
  const HOLD_MS = 700
  const HOLD_DELAY = 110
  const CATS = [
    { id: 'Design', c1: '#9d5ce0', c2: '#55259a', g: 'rgba(255, 128, 204, 0.5)', pat: 'waves', icon: '<path d="M4 20l4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/>' },
    { id: 'Code', c1: '#3384f2', c2: '#0b3d99', g: 'rgba(100, 225, 255, 0.45)', pat: 'dots', icon: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>' },
    { id: 'Daten', c1: '#22a8bb', c2: '#095866', g: 'rgba(130, 255, 196, 0.42)', pat: 'bars', icon: '<path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/>' },
    { id: 'Business', c1: '#ea8f24', c2: '#954600', g: 'rgba(255, 218, 100, 0.55)', pat: 'stripes', icon: '<rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3.5 13h17"/>' },
    { id: 'Persönlich', c1: '#6d66ea', c2: '#2b2789', g: 'rgba(196, 160, 255, 0.5)', pat: 'rings', icon: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>' },
    { id: 'Weitere', c1: '#7d7d85', c2: '#3a3a41', g: 'rgba(225, 228, 240, 0.32)', pat: 'grid', icon: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>' },
  ]
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]))
  const SESSION = { c1: '#3a3a3e', c2: '#151517', g: 'rgba(48, 209, 88, 0.3)', pat: 'radar' }
  const TICKET = { c1: '#fbfbfd', c2: '#e2e2e8', g: 'rgba(196, 212, 255, 0.7)', pat: 'guilloche' }
  const MERGE = { c1: '#2e2a3a', c2: '#100d18', g: 'rgba(163, 92, 247, 0.42)', pat: 'branches' }
  const MERGE_HOLD_MS = 1200
  const SETUP = { c1: '#1d3b30', c2: '#0a1712', g: 'rgba(48, 209, 88, 0.34)', pat: 'pins' }
  const SETUP_ICON = '<path d="M4 7h10M4 12h7M4 17h10"/><path d="M15.5 11.5l2 2 3.5-4"/>'
  const STATE_DOT = { ok: '#30d158', warn: '#ffd60a', fail: '#ff453a' }
  const SKILLS = { c1: '#6a4fe0', c2: '#1d1663', g: 'rgba(100, 210, 255, 0.42)', pat: 'mosaic' }
  const TEAM = { c1: '#1b2236', c2: '#0a0d16', g: 'rgba(100, 160, 255, 0.4)', pat: 'orbits' }
  const TEAM_ICON = '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M14.5 15.2a4.5 4.5 0 0 1 6 3.8"/>'
  const MEMBER_LOOK = {
    working: { st: '#0a84ff', word: 'Arbeitet' },
    waiting: { st: '#8e8e93', word: 'Wartet' },
    question: { st: '#ff9f0a', word: 'Frage an dich' },
    conflict: { st: '#ff453a', word: 'Konflikt' },
    done: { st: '#30d158', word: 'Fertig' },
    failed: { st: '#ff453a', word: 'Abgebrochen' },
  }
  const MERGE_ICON = '<circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 4 3.5 4.8 9.8 4.8"/>'
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  const REC_ICON = '<path d="M12 4v16M4 12h16"/>'
  const CHEV = '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>'
  const TRIES = [
    { label: 'Präsentation', q: 'präsentation', cat: 'Business' },
    { label: 'Video', q: 'video', cat: 'Persönlich' },
    { label: 'Recherche', q: 'recherche', cat: 'Business' },
    { label: 'Barrierefreiheit', q: 'barriere', cat: 'Design' },
    { label: 'Fehler finden', q: 'fehler', cat: 'Code' },
    { label: 'Excel', q: 'excel', cat: 'Daten' },
  ]
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const svg = (paths, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`
  const colors = o => `--c1:${o.c1};--c2:${o.c2};--g:${o.g || 'transparent'}`

  // Clean line patterns, one per area, drawn over the card's colour.
  let patternId = 0
  function pattern(kind) {
    const id = `pt${++patternId}`
    const ink = kind === 'guilloche' ? 'rgba(28, 28, 30, 0.13)' : 'rgba(255, 255, 255, 0.2)'
    let defs = '', body = '', fade = ''
    if (kind === 'waves') {
      for (let i = 0; i < 13; i++) {
        const y = 40 + i * 13
        body += `<path d="M-30 ${y + 80} C 80 ${y - 40}, 220 ${y + 130}, 430 ${y - 20}"/>`
      }
    } else if (kind === 'dots') {
      defs = `<pattern id="${id}" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.25" fill="rgba(255,255,255,.34)" stroke="none"/></pattern>`
      body = `<rect width="400" height="250" fill="url(#${id})" stroke="none"/>`
      fade = 'fade-r'
    } else if (kind === 'bars') {
      for (let i = 0; i < 30; i++) {
        const x = 160 + i * 8
        const h = 14 + 70 * (0.5 + 0.5 * Math.sin(i * 0.5 + 0.6)) * (0.45 + i / 45)
        body += `<line x1="${x}" y1="236" x2="${x}" y2="${(236 - h).toFixed(1)}" stroke-width="2.2" stroke-linecap="round"/>`
      }
      fade = 'fade-r'
    } else if (kind === 'stripes') {
      for (let i = 0; i < 46; i++) body += `<line x1="${i * 11}" y1="-10" x2="${i * 11 - 260}" y2="260"/>`
      fade = 'fade-r'
    } else if (kind === 'rings') {
      for (let i = 1; i <= 11; i++) body += `<circle cx="352" cy="28" r="${i * 22}"/>`
    } else if (kind === 'grid') {
      for (let x = 0; x <= 400; x += 20) body += `<line x1="${x}" y1="0" x2="${x}" y2="250"/>`
      for (let y = 0; y <= 250; y += 20) body += `<line x1="0" y1="${y}" x2="400" y2="${y}"/>`
      fade = 'fade-b'
    } else if (kind === 'radar') {
      for (let i = 1; i <= 9; i++) body += `<circle cx="372" cy="232" r="${i * 26}" stroke="rgba(48, 209, 88, ${(0.42 - i * 0.035).toFixed(2)})"/>`
    } else if (kind === 'branches') {
      // Side branches curving into one main line, like a merge graph.
      body += `<line x1="-10" y1="196" x2="410" y2="196" stroke="rgba(163, 92, 247, 0.55)" stroke-width="2.5"/>`
      for (let i = 0; i < 9; i++) {
        const x = 120 + i * 30, y = 36 + i * 9
        body += `<path d="M${x - 140} ${y} C ${x - 40} ${y}, ${x} 196, ${x + 70} 196"/>`
      }
      fade = 'fade-r'
    } else if (kind === 'mosaic') {
      // Tiles in the areas' own colours, one per skill area.
      const tints = ['#c58cff', '#7fb4ff', '#6fe0d0', '#ffc46b', '#a9a4ff', '#d6d6de']
      for (let y = 14; y < 250; y += 26) {
        for (let x = 168; x < 410; x += 26) {
          const k = (x * 3 + y * 7) % 11
          if (k < 6) body += `<rect x="${x}" y="${y}" width="16" height="16" rx="5" fill="${tints[k]}" fill-opacity="${(0.18 + (k % 3) * 0.08).toFixed(2)}" stroke="none"/>`
        }
      }
      fade = 'fade-r'
    } else if (kind === 'orbits') {
      for (let i = 1; i <= 7; i++) body += `<ellipse cx="330" cy="70" rx="${i * 30}" ry="${i * 17}" transform="rotate(-18 330 70)"/>`
      for (const [x, y, r] of [[262, 52, 4], [372, 118, 3.2], [300, 150, 3.6], [398, 30, 2.6]]) body += `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(100, 180, 255, 0.6)" stroke="none"/>`
    } else if (kind === 'pins') {
      // Rows of status pins, a few lit green.
      for (let y = 22; y < 250; y += 22) {
        for (let x = 150; x < 410; x += 22) {
          const lit = (x * 7 + y * 3) % 5 === 0
          body += `<circle cx="${x}" cy="${y}" r="${lit ? 3.2 : 2.2}" fill="${lit ? 'rgba(48, 209, 88, 0.55)' : 'rgba(255, 255, 255, 0.16)'}" stroke="none"/>`
        }
      }
      fade = 'fade-r'
    } else if (kind === 'guilloche') {
      for (let i = 0; i < 18; i++) body += `<ellipse cx="318" cy="70" rx="74" ry="24" transform="rotate(${i * 10} 318 70)"/>`
      for (let i = 0; i < 18; i++) body += `<ellipse cx="318" cy="70" rx="44" ry="15" transform="rotate(${i * 10 + 5} 318 70)"/>`
    }
    return `<svg class="pattern ${fade}" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs><g fill="none" stroke="${ink}" stroke-width="1">${body}</g></svg>`
  }
  const short = name => name.split(':').pop()

  // --- Context: the Cockpit mod writes the session's fill into this page's database ---
  const ctx = { used: null, max: null, threshold: null, cost: null, limit: null, repo: null, at: 0, error: null, session: null }
  const ctxShare = () => (ctx.used != null && ctx.max ? Math.min(1, ctx.used / ctx.max) : null)
  const ctxMark = () => (ctx.threshold && ctx.max ? ctx.threshold / ctx.max : 0.8)
  function ctxLook(p) {
    const th = ctxMark()
    if (p == null) return { a: '#8e8e93', b: '#8e8e93', word: 'Wird geladen …' }
    if (p < 0.5) return { a: '#30d158', b: '#a6e86a', word: 'Viel Platz' }
    if (p < th - 0.08) return { a: '#ffd60a', b: '#ff9f0a', word: 'Füllt sich' }
    if (p < th) return { a: '#ff9f0a', b: '#ff453a', word: 'Bald Zusammenfassung' }
    return { a: '#ff453a', b: '#ff2d55', word: 'Wird zusammengefasst' }
  }
  const pct = p => (p == null ? '–' : `${Math.round(p * 100)} %`)
  function tokens(n) {
    if (n == null) return '–'
    if (n >= 1e6) return `${(n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 })} Mio`
    if (n >= 1e3) return `${Math.round(n / 1e3)}k`
    return String(n)
  }
  function ctxError() {
    return {
      none: 'Diese Ansicht kann die Daten der Seite nicht lesen.',
      no_data: 'Noch keine Werte. Die Cockpit-Mod schickt den Füllstand nach jedem Schritt von Claude.',
    }[ctx.error] || 'Der Kontext ist gerade nicht lesbar.'
  }
  // A ring arc of radius r at share p, as a style for an .arc circle.
  function arcStyle(r, p) {
    const len = 2 * Math.PI * r
    return `--len:${len.toFixed(1)};stroke-dasharray:${len.toFixed(1)} ${len.toFixed(1)};stroke-dashoffset:${(len * (1 - (p ?? 0))).toFixed(1)}`
  }
  function miniRing(size, r, width, p, look) {
    const c = size / 2
    return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${c}" cy="${c}" r="${r}" stroke-width="${width}"/><circle class="arc" cx="${c}" cy="${c}" r="${r}" stroke-width="${width}" style="${arcStyle(r, p)};stroke:${look.a}"/></svg>`
  }

  // --- Merge: Claude writes the branch's PR into cockpit/pr after each push or PR event ---
  // playedAt: when the merged animation last started; lingering: seen this visit, leaves on close.
  const pr = { data: null, error: null, pending: 0, playedAt: 0, flashAt: 0, lingering: false }
  const PLAY_MS = 1700
  const NO_ANSWER_MS = 90000
  const MERGE_PENDING_MS = 10 * 60000
  function cleanPr(d) {
    if (!d || typeof d.number !== 'number' || typeof d.base !== 'string' || typeof d.head !== 'string') return null
    const str = v => (typeof v === 'string' ? v : '')
    const num = v => (typeof v === 'number' && isFinite(v) ? v : null)
    const m = d.merge && typeof d.merge === 'object' ? d.merge : null
    return {
      repo: str(d.repo), number: d.number, title: str(d.title), url: /^https:\/\/github\.com\//.test(d.url) ? d.url : '',
      head: d.head, base: d.base, draft: d.draft === true,
      state: ['open', 'merged', 'closed'].includes(d.state) ? d.state : 'open',
      ci: ['success', 'failure', 'pending', 'none'].includes(d.ci) ? d.ci : 'pending',
      checks: Array.isArray(d.checks) ? d.checks.filter(c => c && typeof c.name === 'string').slice(0, 12) : [],
      mergeable: typeof d.mergeable === 'boolean' ? d.mergeable : null,
      files: num(d.files), additions: num(d.additions), deletions: num(d.deletions),
      updatedAt: num(d.updatedAt) || 0,
      session: str(d.session).slice(0, 80), sessionUrl: /^https:\/\/claude\.ai\/code\/session_\w+$/.test(d.sessionUrl) ? d.sessionUrl : '',
      archivedAt: num(d.archivedAt) || 0,
      merge: m && ['running', 'done', 'failed'].includes(m.state)
        ? { state: m.state, at: num(m.at) || 0, sha: str(m.sha), branchDeleted: m.branchDeleted === true, message: str(m.message) }
        : null,
    }
  }
  const CHECK_DOT = { success: '#30d158', failure: '#ff453a', pending: '#ffd60a', skipped: '#8e8e93', none: '#8e8e93' }
  function mergeBlockers(d) {
    const out = []
    if (d.ci === 'failure') out.push('CI ist rot. Erst wenn alle Checks grün sind, lässt sich mergen.')
    if (d.ci === 'pending') out.push('CI läuft noch. Sobald alles grün ist, wird der Knopf frei.')
    if (d.mergeable === false) out.push(`Konflikte mit ${d.base}. Claude muss sie erst lösen.`)
    if (d.mergeable === null) out.push('GitHub prüft noch, ob es Konflikte gibt.')
    return out
  }
  const mergeBusy = d => d.state === 'open' && ((pr.pending > 0 && Date.now() - pr.pending < MERGE_PENDING_MS) || d.merge?.state === 'running')
  function mergeStatus(d) {
    if (d.state === 'merged') return { dot: '#a35cf7', short: 'Gemergt' }
    if (d.state === 'closed') return { dot: '#8e8e93', short: 'Geschlossen' }
    if (mergeBusy(d)) return { dot: '#64d2ff', short: 'Wird gemergt …' }
    if (d.merge?.state === 'failed') return { dot: '#ff453a', short: 'Merge abgebrochen' }
    if (d.ci === 'failure') return { dot: '#ff453a', short: 'CI rot' }
    if (d.mergeable === false) return { dot: '#ff453a', short: 'Konflikte' }
    if (d.ci === 'pending') return { dot: '#ffd60a', short: 'CI läuft' }
    if (d.mergeable === null) return { dot: '#ffd60a', short: 'Wird geprüft' }
    return { dot: '#30d158', short: d.ci === 'none' ? 'Bereit · ohne Checks' : 'Bereit zum Mergen' }
  }
  // A merged PR shows once; after it was opened it is archived and leaves the stack.
  const prKey = d => `${d.repo}#${d.number}`
  const archived = d => d.state === 'merged' && (d.archivedAt > 0 || store.get('cockpit.prArchived', '') === prKey(d))
  // The PR the merge card shows: an archived merge leaves the card empty for the next PR.
  const shownPr = () => (pr.data && archived(pr.data) && !pr.lingering ? null : pr.data)
  async function markSeen() {
    const d = pr.data
    if (!d || d.state !== 'merged' || pr.lingering || archived(d)) return
    pr.lingering = true
    store.set('cockpit.prArchived', prKey(d))
    const db = await use('db')
    try { await db?.doc('cockpit/pr').update({ archivedAt: Date.now() }) } catch {}
  }
  const ciWord = d => ({ success: 'Alle Checks grün', failure: 'Rot', pending: 'Läuft', none: 'Keine Checks eingerichtet' })[d.ci]
  const shortSha = sha => (sha ? sha.slice(0, 7) : '')

  // --- Setup: the Cockpit mod checks the repo against its memory file and writes cockpit/setup ---
  const setup = { data: null, error: null }
  const GROUPS = ['Memory', 'Connectors', 'Skills', 'Branch']
  function cleanSetup(d) {
    if (!d || !Array.isArray(d.checks)) return null
    const str = v => (typeof v === 'string' ? v : '')
    return {
      repo: str(d.repo) || null, branch: str(d.branch) || null, memory: str(d.memory) || null,
      checks: d.checks.filter(c => c && GROUPS.includes(c.group) && ['ok', 'warn', 'fail'].includes(c.state))
        .map(c => ({ group: c.group, name: str(c.name), state: c.state, detail: str(c.detail) })).slice(0, 40),
      at: typeof d.at === 'number' ? d.at : 0,
    }
  }
  const RANK = { ok: 0, warn: 1, fail: 2 }
  function groupState(d, group) {
    const mine = d.checks.filter(c => c.group === group)
    return mine.length ? mine.reduce((a, b) => (RANK[b.state] > RANK[a.state] ? b : a)).state : null
  }

  // --- Team: the lead chat writes cockpit/team, each member chat its own cockpit/team/members/<session> ---
  const team = { goal: null, members: [], error: null, seen: new Set(), lead: null }
  const SESSION_URL = /^https:\/\/claude\.ai\/code\/[A-Za-z0-9_-]+$/
  function cleanMember(id, d) {
    if (!d || typeof d !== 'object') return null
    const str = v => (typeof v === 'string' ? v : '')
    const st = MEMBER_LOOK[d.state] ? d.state : 'waiting'
    return {
      id, name: str(d.name) || 'Chat', task: str(d.task), note: str(d.note), question: str(d.question), state: st,
      url: SESSION_URL.test(d.url) ? d.url : '', pr: typeof d.pr === 'number' ? d.pr : null, branch: str(d.branch),
      updatedAt: typeof d.updatedAt === 'number' ? d.updatedAt : 0,
    }
  }
  const PALETTE = ['Design', 'Code', 'Daten', 'Business', 'Persönlich']
  // Each chat keeps its colour by its place in the team, so neighbours differ.
  function memberColors(m) {
    const ids = team.members.map(x => x.id).sort()
    return CAT[PALETTE[Math.max(0, ids.indexOf(m.id)) % PALETTE.length]]
  }
  function initials(name) {
    const words = name.split(/[\s\-_/]+/).filter(Boolean)
    if (!words.length) return '?'
    return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : words[0].slice(0, 2).replace(/^./, c => c.toUpperCase())
  }
  function avatar(m, size = 40) {
    const look = MEMBER_LOOK[m.state]
    const badge = m.state === 'done' ? `<span class="badge">${CHECK}</span>` : m.state === 'question' ? '<span class="badge">?</span>' : m.state === 'conflict' || m.state === 'failed' ? '<span class="badge">!</span>' : ''
    return `<span class="ava ${m.state}" style="${colors(memberColors(m))};--st:${look.st};--s:${size}px" aria-hidden="true">${esc(initials(m.name))}${badge}</span>`
  }
  const needsYou = m => m.state === 'question' || m.state === 'conflict'

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v) } catch { return fallback } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)) } catch {} },
  }
  const use = name => (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use(name).catch(() => null)
    : Promise.resolve(null)

  const state = {
    query: '',
    open: null,
    favorites: new Set(store.get('cockpit.favorites', [])),
    loaded: [],
    pending: new Map(),
    canSend: 'unknown',
    sheet: null,
  }
  // Installed through the Cockpit since the page was built: cockpit/skills lists them.
  // They leave Empfohlen and join Design right away.
  const INSTALL_PENDING_MS = 15 * 60000
  const installing = new Map(Object.entries(store.get('cockpit.installing', {})).filter(([, at]) => Date.now() - at < INSTALL_PENDING_MS))
  let recommended = []
  function applyInstalled(list) {
    for (const item of list) {
      const rec = DATA.recommended.find(r => r.id === item.id)
      if (DATA.skills.some(s => s.short === item.id)) continue
      DATA.skills.push({
        name: item.name || item.id, short: item.id, category: 'Design', source: 'Cockpit · in allen Sessions',
        summary: rec ? `${rec.author}: ${rec.summary}` : (item.title || item.id), description: item.pr ? `Kommt mit PR #${item.pr} in alle Sessions.` : '',
        hasFiles: false, fileCount: 0,
      })
    }
    const have = new Set(DATA.skills.map(s => s.short))
    for (const id of [...installing.keys()]) if (have.has(id)) installing.delete(id)
    store.set('cockpit.installing', Object.fromEntries(installing))
    recommended = DATA.recommended.filter(r => !have.has(r.id))
  }
  applyInstalled([])
  const loadedSet = () => new Set(state.loaded.map(u => u.skill))
  const skillByName = name => DATA.skills.find(s => s.name === name)

  function ago(at) {
    const minutes = Math.floor((Date.now() - at) / 60000)
    if (minutes < 1) return 'gerade eben'
    if (minutes < 60) return `vor ${minutes} Min`
    const hours = Math.floor(minutes / 60)
    return hours < 24 ? `vor ${hours} Std` : new Date(at).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
  }

  // --- Skill rows ------------------------------------------------------------------
  // A progress ring around a rounded tile; its length is the rect's perimeter.
  function ringSvg(size, rx) {
    const w = size - 3
    const per = (4 * w - 8 * rx + 2 * Math.PI * rx).toFixed(1)
    return `<svg class="hring" viewBox="0 0 ${size} ${size}" style="--rs:${size}px;--per:${per}" aria-hidden="true"><rect x="1.5" y="1.5" width="${w}" height="${w}" rx="${rx}"/></svg>`
  }
  const ROW_RING = ringSvg(58, 17)
  const BIG_RING = ringSvg(74, 21)
  const OK = '<span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
  function mono(name) {
    const parts = short(name).split(/[-_ ]+/).filter(Boolean)
    return (parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2)).toUpperCase()
  }

  function skillRow(skill, i, trailOverride) {
    const look = CAT[skill.category]
    const live = loadedSet().has(skill.name)
    const pending = state.pending.has(skill.name) && !live
    const trail = trailOverride ?? (live ? '<span class="tag loaded">✓ Geladen</span>'
      : pending ? '<span class="spin" role="img" aria-label="Lädt"></span>'
      : `${state.favorites.has(skill.name) ? '<span class="star" aria-label="Favorit">★</span>' : ''}${CHEV}`)
    return `<button class="srow" style="${colors(look)};--i:${i}" data-hold="${esc(skill.name)}" data-skill="${esc(skill.name)}"
        aria-label="${esc(skill.short)}: ${esc(skill.summary)}. Tippen für Details, gedrückt halten zum Laden.">
      <span class="sicon">${ROW_RING}<span class="ripple"></span><span class="tile"><span class="mono">${esc(mono(skill.name))}</span>${OK}</span>${live ? '<span class="live"></span>' : ''}</span>
      <span class="stext"><b>${esc(skill.short)}</b><span>${esc(skill.summary)}</span></span>
      <span class="trail">${trail}</span></button>`
  }

  function recRow(rec, i) {
    return `<button class="srow" style="${colors(CAT.Design)};--i:${i}" data-hold="rec:${esc(rec.id)}" data-rec="${esc(rec.id)}"
        aria-label="${esc(rec.title)} von ${esc(rec.author)}. Tippen für Details, gedrückt halten zum Installieren.">
      <span class="sicon">${ROW_RING}<span class="ripple"></span><span class="tile hollow"><span class="mono">${esc(mono(rec.id))}</span>${OK}</span></span>
      <span class="stext"><b>${esc(rec.title)}</b><span>${esc(rec.author)} · ${esc(rec.summary)}</span></span>
      <span class="trail">${installing.has(rec.id) ? '<span class="spin" role="img" aria-label="Wird installiert"></span>' : '<span class="tag new">Neu</span>'}</span></button>`
  }

  const group = (title, count, rows) => rows ? `<h3 class="gtitle"><span>${esc(title)}</span><span>${count}</span></h3><div class="glist">${rows}</div>` : ''
  const TIP = (text) => `<div class="dhead"><span class="tip"><span class="press"></span>${esc(text)}</span></div>`

  // --- Suggestions -----------------------------------------------------------------
  function suggestions() {
    const picks = []
    const add = name => { if (!picks.includes(name) && skillByName(name)) picks.push(name) }
    ;[...state.loaded].reverse().forEach(u => add(u.skill))
    state.favorites.forEach(add)
    ;['anthropic-skills:berater', 'anthropic-skills:coworker', 'anthropic-skills:deep-research', 'anthropic-skills:coach'].forEach(add)
    return picks.slice(0, 4).map(skillByName)
  }

  function renderSuggest() {
    const live = loadedSet()
    $('suggest').innerHTML = suggestions().map(s => `<button class="app" style="${colors(CAT[s.category])}" data-hold="${esc(s.name)}" data-skill="${esc(s.name)}" aria-label="${esc(s.short)}. Tippen für Details, gedrückt halten zum Laden.">
      <span class="sicon big">${BIG_RING}<span class="ripple"></span><span class="tile"><span class="mono">${svg(CAT[s.category].icon)}</span>${OK}</span>${live.has(s.name) ? '<span class="live"></span>' : ''}</span>
      <span>${esc(s.short)}</span></button>`).join('')
    $('chips').innerHTML = TRIES.map(t => `<button class="chip" data-try="${esc(t.q)}" style="${colors(CAT[t.cat])}"><i></i>${esc(t.label)}</button>`).join('')
  }

  // The slider runs on --ease-in-out (0.77, 0, 0.175, 1): the time at which it reaches a share of its way.
  function zipTime(share) {
    const p = Math.min(1, Math.max(0, share))
    const bez = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3
    let lo = 0, hi = 1
    for (let k = 0; k < 24; k += 1) { const m = (lo + hi) / 2; if (bez(0, 1, m) < p) lo = m; else hi = m }
    return bez(0.77, 0.175, (lo + hi) / 2)
  }

  // --- Wallet ----------------------------------------------------------------------
  const PEEK = 60
  // In the skills stack the Skills card stays on top as its head, showing a little more.
  const HEAD_PEEK = 78
  const TOP_CARDS = [
    { id: 'session', kind: 'session', title: 'Diese Session' },
    { id: 'merge', kind: 'merge', title: 'Merge' },
    { id: 'setup', kind: 'setup', title: 'Setup' },
    { id: 'team', kind: 'team', title: 'Team' },
    { id: 'skills', kind: 'skills', title: 'Skills' },
  ]
  const SKILL_CARDS = [
    { id: 'skills', kind: 'skills', title: 'Skills', head: true },
    ...CATS.map(c => ({ id: c.id, kind: 'cat', title: c.id })),
    { id: 'rec', kind: 'rec', title: 'Empfohlen' },
  ]
  let cards = TOP_CARDS

  function cardHtml(card) {
    const live = loadedSet()
    if (card.kind === 'session') {
      const recent = uniqueLoaded().slice(0, 3).map(u => short(u.skill))
      return `${pattern('radar')}<div class="wtop"><div><small>Cockpit</small><b>Diese Session</b></div>
          <div class="wcount"><small>Geladen</small><b>${live.size}</b></div></div>
        <div class="wbottom"><div><small>Zuletzt · Kontext ${pct(ctxShare())}</small><p>${esc(recent.join(' · ') || 'Noch kein Skill geladen')}</p></div>
          <span class="glyph ring40">${miniRing(40, 16, 4, ctxShare(), ctxLook(ctxShare()))}<em>${ctxShare() == null ? '–' : Math.round(ctxShare() * 100)}</em></span></div>`
    }
    if (card.kind === 'merge') {
      const d = shownPr()
      if (!d) {
        const last = pr.data && archived(pr.data) ? pr.data : null
        return `${pattern('branches')}<div class="wtop"><div><small>Merge</small><b>${last ? 'Kein offener PR' : 'Kein PR'}</b></div></div>
          <div class="wbottom"><div><small>${last ? `Zuletzt #${last.number} gemergt` : 'Wartet'}</small><p>Claude trägt den PR dieses Branches nach dem nächsten Push ein.</p></div>
            <span class="glyph">${svg(MERGE_ICON)}</span></div>`
      }
      const st = mergeStatus(d)
      const flash = Date.now() - pr.flashAt < 1500
      const glyph = d.state === 'merged' ? CHECK : mergeBusy(d) ? '<span class="spin"></span>' : svg(MERGE_ICON)
      return `${pattern('branches')}<div class="wtop"><div style="min-width:0"><small>Merge · #${d.number}</small>
            <div class="wtarget"><span>in</span><b>${esc(d.base)}</b></div></div>
          <div class="wcount"><small>Dateien</small><b>${d.files ?? '–'}</b></div></div>
        <div class="wbottom"><div style="min-width:0"><small class="mstat" style="--dot:${st.dot}"><i></i>${esc(st.short)}</small><p>${esc(d.title)}</p></div>
          <span class="glyph${flash ? ' pop' : ''}">${glyph}</span></div>${flash ? '<span class="sheen"></span>' : ''}`
    }
    if (card.kind === 'skills') {
      const total = DATA.skills.length
      const dots = CATS.map(c => `<i style="--d:${c.c1}"></i>`).join('')
      return `${pattern('mosaic')}<div class="wtop"><div><small>${card.head ? '‹ Alle Bereiche' : 'Cockpit'}</small><b>Skills</b></div>
          <div class="wcount"><small>${card.head ? 'Bereiche' : 'Skills'}</small><b>${card.head ? CATS.length : total}</b></div></div>
        <div class="wbottom"><div style="min-width:0"><small>${CATS.length} Bereiche${live.size ? ` · ${live.size} geladen` : ''} · ${recommended.length} empfohlen</small>
            <p>${esc(CATS.map(c => c.id).join(' · '))}</p></div>
          <span class="glyph"><span class="mini-dots">${dots}</span></span></div>`
    }
    if (card.kind === 'team') {
      const ms = team.members
      if (!ms.length) {
        return `${pattern('orbits')}<div class="wtop"><div><small>Team</small><b>Kein Team</b></div></div>
          <div class="wbottom"><div><small>Bereit</small><p>Gib Claude eine größere Aufgabe, es verteilt sie auf mehrere Chats.</p></div>
            <span class="glyph">${svg(TEAM_ICON)}</span></div>`
      }
      const count = st => ms.filter(m => m.state === st).length
      const WORDS = { working: ['arbeitet', 'arbeiten'], question: ['Frage', 'Fragen'], conflict: ['Konflikt', 'Konflikte'], waiting: ['wartet', 'warten'], done: ['fertig', 'fertig'] }
      const parts = Object.keys(WORDS).filter(st => count(st)).map(st => `${count(st)} ${WORDS[st][count(st) === 1 ? 0 : 1]}`)
      return `${pattern('orbits')}<div class="wtop"><div style="min-width:0"><small>Team · ${ms.length} Chats</small>
            <div class="avas" style="margin-top:6px">${ms.slice(0, 6).map(m => avatar(m, 32)).join('')}</div></div>
          <div class="wcount"><small>Fertig</small><b>${count('done')}/${ms.length}</b></div></div>
        <div class="wbottom"><div style="min-width:0"><small>${esc(parts.join(' · '))}</small><p>${esc(team.goal?.goal || '')}</p></div>
          <span class="glyph">${svg(TEAM_ICON)}</span></div>`
    }
    if (card.kind === 'setup') {
      const d = setup.data
      if (!d) {
        return `${pattern('pins')}<div class="wtop"><div><small>Setup</small><b>Noch nicht geprüft</b></div></div>
          <div class="wbottom"><div><small>Wartet</small><p>Die Cockpit-Mod prüft das Repo beim Start der Session.</p></div>
            <span class="glyph">${svg(SETUP_ICON)}</span></div>`
      }
      const counted = d.checks.filter(c => c.group !== 'Memory')
      const good = counted.filter(c => c.state === 'ok').length
      const worst = d.checks.reduce((w, c) => (RANK[c.state] > RANK[w] ? c.state : w), 'ok')
      const dots = ['Connectors', 'Skills', 'Branch'].map(g => groupState(d, g)).filter(Boolean)
        .map(st => `<i style="--dot:${STATE_DOT[st]}"></i>`).join('')
      return `${pattern('pins')}<div class="wtop"><div style="min-width:0"><small>Setup · ${esc(d.repo || 'kein Repo')}</small>
            <div class="wbig">${worst === 'ok' ? 'Alles bereit' : `${good} von ${counted.length}`}</div></div>
          <div class="wcount"><small>Stand</small><span class="dots">${dots}</span></div></div>
        <div class="wbottom"><div style="min-width:0"><small>${esc(d.branch && d.branch !== 'HEAD' ? d.branch : 'kein Branch')}</small>
            <p>${esc(worst === 'ok' ? 'Connectors, Skills und Branch passen.' : d.checks.filter(c => c.state !== 'ok').map(c => c.name).join(' · '))}</p></div>
          <span class="glyph">${worst === 'ok' ? CHECK : svg(SETUP_ICON)}</span></div>`
    }
    if (card.kind === 'rec') {
      return `${pattern('guilloche')}<span class="notch l"></span><span class="notch r"></span><span class="perf"></span>
        <div class="wtop"><div><small>Für deinen Stil</small><b>Empfohlen</b></div>
          <div class="wcount"><small>Design</small><b>${recommended.length}</b></div></div>
        <div class="wbottom"><div><small>Nicht installiert</small><p>${esc(recommended.map(r => r.title).join(' · '))}</p></div>
          <span class="glyph">${svg(REC_ICON)}</span></div>`
    }
    const members = DATA.skills.filter(s => s.category === card.id)
    const loadedHere = members.filter(s => live.has(s.name)).length
    const names = members.slice(0, 4).map(s => s.short).join(' · ')
    return `${pattern(CAT[card.id].pat)}<div class="wtop"><div><small>Cockpit</small><b>${esc(card.title)}</b></div>
        <div class="wcount"><small>Skills</small><b>${members.length}</b></div></div>
      <div class="wbottom"><div><small>${loadedHere ? `${loadedHere} geladen` : 'Bereit'}</small><p>${esc(names)}${members.length > 4 ? ' …' : ''}</p></div>
        <span class="glyph">${svg(CAT[card.id].icon)}</span></div>`
  }

  function uniqueLoaded() {
    const seen = new Set()
    return [...state.loaded].reverse().filter(u => !seen.has(u.skill) && seen.add(u.skill))
  }

  function detailHtml(card) {
    if (card.kind === 'session') {
      const items = uniqueLoaded()
      const look = ctxLook(ctxShare())
      const ctxRow = `<button class="ctx-row" data-context>${miniRing(36, 14, 5, ctxShare(), look)}<span><b>Kontext ${pct(ctxShare())}</b><small>${esc(ctx.error ? 'Nicht abrufbar' : `${look.word} · ${tokens(ctx.used)} von ${tokens(ctx.max)}`)}</small></span>${CHEV}</button>`
      if (!items.length) return `${ctxRow}${TIP('Halte eine Skill-Karte gedrückt, um sie zu laden')}<p class="empty">In dieser Session wurde noch kein Skill geladen.</p>`
      const rows = items.map((u, i) => {
        const s = skillByName(u.skill)
        return s ? skillRow(s, i, `<span class="time">${esc(ago(u.at))}</span>`) : ''
      }).join('')
      return `${ctxRow}${TIP('Tippen öffnet den Skill')}${group('Zuletzt geladen', items.length, rows)}`
    }
    if (card.kind === 'merge') return mergeDetail()
    if (card.kind === 'setup') return setupDetail()
    if (card.kind === 'team') return teamDetail()
    if (card.kind === 'rec') {
      return `${TIP('Halten: Claude installiert · Tippen: Details')}${group('Für deinen Stil', recommended.length, recommended.map(recRow).join(''))}`
    }
    const live = loadedSet()
    const members = DATA.skills.filter(s => s.category === card.id).sort((a, b) => a.short.localeCompare(b.short))
    const loadedHere = members.filter(s => live.has(s.name))
    const favs = members.filter(s => !live.has(s.name) && state.favorites.has(s.name))
    const rest = members.filter(s => !live.has(s.name) && !state.favorites.has(s.name))
    let i = 0
    const rows = list => list.map(s => skillRow(s, i++)).join('')
    return TIP('Halten lädt · Tippen öffnet') +
      group('Geladen', loadedHere.length, rows(loadedHere)) +
      group('Favoriten', favs.length, rows(favs)) +
      group(loadedHere.length || favs.length ? 'Weitere Skills' : 'Skills', rest.length, rows(rest))
  }

  function mergeDetail() {
    const d = shownPr()
    const actions = d => `<div class="links-row">
        <button class="text-btn" data-pr-refresh>Neu prüfen lassen</button>
        ${d?.url ? `<a class="text-btn" href="${esc(d.url)}" target="_blank" rel="noopener">Auf GitHub ↗</a>` : ''}
      </div>`
    if (!d) {
      return `<p class="empty">${esc(pr.error ? 'Die Daten der Seite sind gerade nicht lesbar.' : 'Noch kein PR eingetragen. Claude schreibt ihn nach jedem Push oder PR-Ereignis hierher.')}</p>${actions(null)}`
    }
    const facts = `
      <div class="kv"><span>CI</span><span class="mstat" style="--dot:${CHECK_DOT[d.ci]}"><i></i>${esc(ciWord(d))}</span></div>
      ${d.checks.length ? `<ul class="checks">${d.checks.map(c => `<li style="--dot:${CHECK_DOT[c.state] || '#8e8e93'}"><i></i><span>${esc(c.name)}</span></li>`).join('')}</ul>` : ''}
      <div class="kv"><span>Konflikte</span><span>${d.mergeable === true ? 'Keine' : d.mergeable === false ? `Ja, mit ${esc(d.base)}` : 'Wird geprüft'}</span></div>
      <div class="kv"><span>Dateien</span><span>${d.files ?? '–'}${d.additions != null ? ` · <span style="color:var(--loaded)">+${d.additions}</span> <span style="color:#ff453a">−${d.deletions ?? 0}</span>` : ''}</span></div>
      ${d.draft && d.state === 'open' ? '<div class="kv"><span>Entwurf</span><span>Claude gibt ihn vor dem Mergen frei</span></div>' : ''}
      ${d.session ? `<div class="kv"><span>Session</span><span>${d.sessionUrl ? `<a class="text-btn" href="${esc(d.sessionUrl)}" target="_blank" rel="noopener">${esc(d.session.slice(0, 8))} ↗</a>` : `<code>${esc(d.session.slice(0, 8))}</code>`}</span></div>` : ''}
      <div class="kv"><span>Stand</span><span>${d.updatedAt ? esc(ago(d.updatedAt)) : '–'}</span></div>`
    const head = `<h3>${esc(d.title)} <span class="num">#${d.number}</span></h3>`
    if (d.state === 'merged') {
      const play = Date.now() - pr.playedAt < PLAY_MS ? ' play' : ''
      // Each tooth closes when the slider passes it; the slider eases, so the delays follow its curve.
      const N = 13
      const teeth = Array.from({ length: N }, (_, i) => {
        const at = (x) => (0.15 + 0.8 * zipTime((x - 14) / 194)).toFixed(3)
        return `<rect class="tt" x="${24 + i * 14}" y="54" width="8" height="16" rx="2.5" style="--d:${at(24 + i * 14)}s;--i:${i}"/>`
          + `<rect class="tb" x="${31 + i * 14}" y="54" width="8" height="16" rx="2.5" style="--d:${at(31 + i * 14)}s"/>`
      }).join('')
      return `<div class="preview">
          <div class="merged${play}"><svg class="zip" viewBox="0 0 240 124" aria-hidden="true">
              <text class="lbl br" x="22" y="30">${esc(d.head.length > 28 ? d.head.slice(0, 27) + '…' : d.head)}</text>
              <text class="lbl mn" x="22" y="104">${esc(d.base)}</text>
              ${teeth}
              <g class="slider"><rect x="6" y="45" width="16" height="34" rx="6"/><path d="M14 56v12"/></g>
              <g class="done"><circle cx="222" cy="62" r="13"/><path pathLength="1" d="M216 62.5l4 4 8-8.5"/></g>
            </svg>
            <b>In ${esc(d.base)} gemergt</b><span>${esc(d.merge?.branchDeleted ? `Branch ${d.head} gelöscht` : d.head)}</span></div>
          ${head}
          ${d.merge?.sha ? `<div class="kv"><span>Commit</span><span><code>${esc(shortSha(d.merge.sha))}</code></span></div>` : ''}
          ${d.merge?.at ? `<div class="kv"><span>Gemergt</span><span>${esc(ago(d.merge.at))}</span></div>` : ''}
        </div>${actions(d)}`
    }
    const blockers = mergeBlockers(d)
    const busy = mergeBusy(d)
    let button
    if (d.state === 'closed') button = `<button class="mbtn" disabled>${svg(MERGE_ICON)}<span><b>Geschlossen</b><small>Dieser PR wurde ohne Merge geschlossen</small></span></button>`
    else if (busy) button = `<button class="mbtn busy" disabled><span class="spin"></span><span><b>Claude merged …</b><small>Prüft CI und Konflikte noch einmal</small></span></button>`
    else if (blockers.length) button = `<button class="mbtn" disabled>${svg(MERGE_ICON)}<span><b>Gesperrt</b><small>${esc(mergeStatus(d).short)}</small></span></button>`
    else button = `<button class="mbtn" data-hold="merge:${d.number}" aria-label="Gedrückt halten: PR ${d.number} per Squash in ${esc(d.base)} mergen">
        <span class="fill"></span>${svg(MERGE_ICON)}<span><b>Gedrückt halten zum Mergen</b><small>Squash in ${esc(d.base)}${d.session ? ' · über die Session des PR' : ', danach Branch löschen'}</small></span></button>`
    const failed = !busy && d.merge?.state === 'failed'
    const silent = busy && pr.pending > 0 && !d.merge && Date.now() - pr.pending > NO_ANSWER_MS
    return `${TIP(blockers.length || busy || d.state !== 'open' ? 'Vorschau des PR' : 'Halten merged · 1,2 s')}
      <div class="preview">
        ${head}
        <div class="route"><small>Ziel</small><div class="to">${ARROW}<span>${esc(d.base)}</span></div><span class="from">aus ${esc(d.head)}</span></div>
        <div style="display:flex;flex-direction:column;gap:10px">${facts}</div>
      </div>
      ${failed ? `<div class="blockers"><b>Merge abgebrochen</b><span>${esc(d.merge.message || 'Claude hat nicht gemergt.')}</span></div>` : ''}
      ${blockers.length && d.state === 'open' && !busy ? `<div class="blockers"><b>Noch gesperrt</b>${blockers.map(b => `<span>${esc(b)}</span>`).join('')}</div>` : ''}
      ${button}
      ${silent ? `<p class="hint">Die Session des PR hat noch nicht geantwortet. Ist sie offen und beobachtet sie die Seite?${d.sessionUrl ? ` <a class="text-btn" href="${esc(d.sessionUrl)}" target="_blank" rel="noopener">Session öffnen ↗</a>` : ''}</p>` : ''}
      ${!sendAvailable() && !blockers.length && d.state === 'open' && !busy ? `<p class="hint">${esc(sendReason())}</p>` : ''}
      ${actions(d)}`
  }

  function teamDetail() {
    const ms = team.members
    const start = `<button class="primary" data-team-new>${ms.length ? 'Neue Aufgabe verteilen' : 'Aufgabe verteilen'}</button>`
    if (!ms.length) return `<p class="empty">${esc(team.error ? 'Die Daten der Seite sind gerade nicht lesbar.' : 'Noch kein Team. Beschreib eine größere Aufgabe: Claude zerlegt sie und verteilt die Teile auf eigene Chats in diesem Repo.')}</p>${start}`
    const order = { question: 0, conflict: 1, working: 2, waiting: 3, failed: 4, done: 5 }
    const sorted = [...ms].sort((a, b) => order[a.state] - order[b.state] || a.name.localeCompare(b.name))
    const rows = sorted.map((m, i) => `<button class="mrow" data-member="${esc(m.id)}" style="--i:${i};--st:${MEMBER_LOOK[m.state].st}">
        ${avatar(m, 40)}<span class="stext"><b>${esc(m.name)}</b><span>${esc(m.note || m.task)}</span></span>
        <span class="trail"><span class="mstate">${esc(MEMBER_LOOK[m.state].word)}</span>${CHEV}</span></button>`).join('')
    return `${TIP('Tippen öffnet den Chat')}
      ${team.goal?.goal ? `<div class="preview"><small class="label" style="margin:0"><span>Aufgabe</span></small><p class="goal">${esc(team.goal.goal)}</p></div>` : ''}
      <div class="glist">${rows}</div>${start}`
  }

  function renderAlerts() {
    const open = team.members.filter(needsYou)
    const box = $('alerts')
    box.hidden = !open.length
    box.innerHTML = open.map(m => `<div class="alert" style="--st:${MEMBER_LOOK[m.state].st}">${avatar(m, 36)}
      <div class="txt"><small>${esc(m.state === 'question' ? `Frage von ${m.name}` : `Konflikt bei ${m.name}`)}</small>
        <p>${esc(m.question || m.note || 'Braucht deine Entscheidung.')}</p>
        <div class="acts"><button class="text-btn" data-answer="${esc(m.id)}">Antworten</button><button class="text-btn" data-member="${esc(m.id)}">Details</button></div></div></div>`).join('')
  }

  function setupDetail() {
    const d = setup.data
    const recheck = `<div class="links-row"><button class="text-btn" data-setup-refresh>Neu prüfen lassen</button></div>`
    if (!d) return `<p class="empty">${esc(setup.error ? 'Die Daten der Seite sind gerade nicht lesbar.' : 'Noch kein Ergebnis. Die Cockpit-Mod prüft beim Start der Session, ob Connectors, Skills und Branch passen.')}</p>${recheck}`
    // Tiles like Control Center: a full tile is ready, a dashed one optional and off, a tinted one missing.
    const NAMES = { github: 'GitHub', figma: 'Figma', canva: 'Canva', gmail: 'Gmail', slack: 'Slack', notion: 'Notion', linear: 'Linear' }
    const nice = n => NAMES[n.toLowerCase()] || n
    const WORD = {
      Connectors: { ok: 'Verbunden', warn: 'Optional', fail: 'Fehlt' },
      Skills: { ok: 'Bereit', warn: 'Optional', fail: 'Fehlt' },
    }
    const MARK = { ok: CHECK, warn: '–', fail: '!' }
    let n = 0
    const tile = (c, group) => `<div class="stile ${c.state}" style="--i:${n++}"><span class="mk">${MARK[c.state]}</span>
      <span style="min-width:0;display:flex;flex-direction:column"><b>${esc(group === 'Connectors' ? nice(c.name) : c.name)}</b><small>${WORD[group][c.state]}</small></span></div>`
    const section = (group, title) => {
      const mine = d.checks.filter(c => c.group === group)
      return mine.length ? `<h2 class="label"><span>${title}</span></h2><div class="tiles">${mine.map(c => tile(c, group)).join('')}</div>` : ''
    }
    const counted = d.checks.filter(c => c.group !== 'Memory')
    const good = counted.filter(c => c.state === 'ok').length
    const hero = `<div class="preview ready"><b>${good === counted.length ? 'Alles bereit' : `${good} <span>von ${counted.length} bereit</span>`}</b>
      <div class="segs">${counted.map((c, i) => `<i class="${c.state === 'ok' ? 'on' : c.state === 'fail' ? 'miss' : ''}" style="--i:${i}"></i>`).join('')}</div></div>`
    const br = d.checks.find(c => c.group === 'Branch')
    const branch = br ? `<h2 class="label"><span>Branch</span></h2>
      <div class="preview"><div class="route"><small>${br.state === 'ok' ? 'Ziel' : br.state === 'fail' ? 'Achtung' : 'Hinweis'}</small>
        <div class="to">${ARROW}<span>${esc(br.state === 'ok' ? (br.detail.match(/nach (\S+)$/)?.[1] || 'main') : br.detail.split(':')[0])}</span></div>
        <span class="from">${esc(br.state === 'ok' ? `aus ${br.name}` : br.detail.split(':').slice(1).join(':').trim() || br.name)}</span></div></div>` : ''
    const memo = d.checks.find(c => c.group === 'Memory')
    const memoNote = memo && memo.state !== 'ok' ? `<p class="empty">${esc(memo.detail)}</p>` : ''
    return `${TIP(`${d.repo || 'Kein Repo'} · geprüft ${d.at ? ago(d.at) : '–'}`)}
      ${hero}${memoNote}${section('Connectors', 'Connectors')}${section('Skills', 'Skills')}${branch}${recheck}`
  }

  const lookOf = card => card.kind === 'session' ? SESSION : card.kind === 'merge' ? MERGE : card.kind === 'setup' ? SETUP
    : card.kind === 'team' ? TEAM : card.kind === 'skills' ? SKILLS : card.kind === 'rec' ? TICKET : CAT[card.id]
  const cardH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h')) || 214
  const stackY = i => (cards === SKILL_CARDS ? (i === 0 ? 0 : HEAD_PEEK + (i - 1) * PEEK) : i * PEEK)
  const cardEl = card => $('wallet').querySelector(`[data-card="${card.id}"]`)

  // Every card, the detail and the wallet height keep their live values here. Each value is
  // its own spring, so any new target picks up from where it is on screen, at its speed.
  // Opacity and scale run in thousandths: the spring settles within 0.4 units.
  const UNIT = { y: 1, h: 1, o: 1000, s: 1000, p: 1000 }
  const STAGGER = 40
  const motions = new WeakMap()
  function paintCard(el, m) {
    el.style.transform = `translate3d(0, ${m.y}px, 0)${m.s * m.p !== 1 ? ` scale(${m.s * m.p})` : ''}`
    const o = Math.min(1, Math.max(0, m.o))
    el.style.opacity = o > 0.999 ? '' : String(o)
    // A card on its way out can still be caught until it has mostly faded.
    el.style.pointerEvents = m.to.o < 1 && o < 0.5 ? 'none' : ''
  }
  function paintDetail(el, m) {
    el.style.transform = m.y ? `translate3d(0, ${m.y}px, 0)` : 'none'
    el.style.opacity = String(Math.min(1, Math.max(0, m.o)))
  }
  const paintHeight = (el, m) => { el.style.height = `${m.h}px` }
  function motionOf(el, init = { y: 0, s: 1, o: 1, p: 1 }, paint = paintCard) {
    let m = motions.get(el)
    if (!m) { m = { ...init, to: { ...init }, anim: {}, timer: 0, parked: false, paint }; motions.set(el, m) }
    return m
  }
  function drive(el, m, key, to, { response = 0.36, velocity = 0, onDone } = {}) {
    const u = UNIT[key]
    const live = m.anim[key]?.stop()
    m.anim[key] = null
    const v = live ? live.v : velocity * u
    if (Math.abs(m[key] - to) * u < 0.4 && Math.abs(v) < 12) { m[key] = to; m.paint(el, m); onDone?.(); return }
    m.anim[key] = spring({
      from: m[key] * u, to: to * u, velocity: v, damping: 1, response,
      onUpdate: x => { m[key] = x / u; m.paint(el, m) },
      onDone: () => { m.anim[key] = null; onDone?.() },
    })
  }
  function halt(m, keys) { for (const k of keys) { m.anim[k]?.stop(); m.anim[k] = null } }

  // Moves a card. `instant` jumps there (to set a starting point); otherwise it springs from where it is.
  // `onSettle` runs once its opacity has arrived. Reduced motion only cross-fades: it moves while unseen.
  function place(el, y, { scale = 1, opacity = 1, delay = 0, instant = false, velocity = 0, onSettle } = {}) {
    const m = motionOf(el)
    m.parked = false
    if (instant) {
      clearTimeout(m.timer)
      halt(m, ['y', 's', 'o'])
      Object.assign(m, { y, s: scale, o: opacity })
      m.to = { y, s: scale, o: opacity }
      m.paint(el, m)
      return
    }
    // Already on its way there (a re-render): leave the motion and its delay alone.
    if (m.to.y === y && m.to.s === scale && m.to.o === opacity) return
    clearTimeout(m.timer)
    m.to = { y, s: scale, o: opacity }
    const go = () => {
      if (REDUCED.matches) {
        const jump = () => { halt(m, ['y', 's']); m.y = y; m.s = scale; m.paint(el, m); drive(el, m, 'o', opacity, { response: 0.24, onDone: onSettle }) }
        if (m.o > 0.02 && (Math.abs(m.y - y) > 0.5 || m.s !== scale)) drive(el, m, 'o', 0, { response: 0.2, onDone: jump })
        else jump()
        return
      }
      drive(el, m, 'y', y, { velocity })
      drive(el, m, 's', scale)
      drive(el, m, 'o', opacity, { response: opacity < 1 ? 0.3 : 0.36, onDone: onSettle })
    }
    if (delay) m.timer = setTimeout(go, delay)
    else go()
  }

  // The detail rises in a beat after the card, and drops away at once.
  function detailTo(show, animate = true) {
    const el = $('detail'), m = motionOf(el, { y: 26, o: 0 }, paintDetail)
    el.classList.toggle('show', show)
    clearTimeout(m.timer)
    const y = show || REDUCED.matches ? 0 : 26, o = show ? 1 : 0
    if (!animate) { halt(m, ['y', 'o']); m.y = y; m.o = o; m.paint(el, m); return }
    const go = () => {
      if (!REDUCED.matches) drive(el, m, 'y', y, { response: show ? 0.4 : 0.3 })
      else { halt(m, ['y']); m.y = 0 }
      drive(el, m, 'o', o, { response: show ? 0.36 : 0.2 })
    }
    if (show && m.o < 0.05) m.timer = setTimeout(go, 120)
    else go()
  }

  function heightTo(h, animate = true) {
    const el = $('wallet'), m = motionOf(el, { h: el.offsetHeight }, paintHeight)
    if (!animate || REDUCED.matches) { halt(m, ['h']); m.h = h; m.paint(el, m); return }
    drive(el, m, 'h', h, { response: 0.4 })
  }

  // Builds the stack; `from` deals the cards in: each rises into place, the kept card glides on from
  // where it is, at the speed it had.
  function buildWallet(from = null) {
    const wallet = $('wallet')
    wallet.innerHTML = cards.map((card, i) => `<button class="wcard${card.kind === 'rec' ? ' ticket' : ''}" data-card="${card.id}" style="${colors(lookOf(card))};z-index:${i + 1}" aria-expanded="false"></button>`).join('') + '<div class="detail" id="detail"></div>'
    refreshCards()
    if (!from) { layout(false); return }
    cards.forEach((card, i) => {
      const el = cardEl(card)
      if (card.id === from.keep) place(el, from.keepY, { instant: true })
      else place(el, stackY(i) + 70, { opacity: 0, scale: 0.97, instant: true })
    })
    cards.forEach((card, i) => {
      const keep = card.id === from.keep
      place(cardEl(card), stackY(i), { delay: keep ? 0 : (i + 1) * STAGGER, velocity: keep ? from.keepV : 0 })
    })
    layout(true, true)
  }

  function refreshCards() {
    for (const card of cards) {
      const el = cardEl(card)
      if (!el) continue
      el.innerHTML = cardHtml(card)
      el.setAttribute('aria-label', `${card.head ? 'Skills, zurück zu allen Bereichen' : card.title}${state.open === card.id ? ', geöffnet' : ''}`)
    }
  }

  // Once a card that stepped aside has faded, it waits behind the open card so it adds no scroll length.
  function park(el) {
    const m = motionOf(el)
    if (!state.open || m.to.o !== 0) return
    place(el, 0, { opacity: 0, scale: 0.96, instant: true })
    m.parked = true
  }

  let lastOpen = null
  function layout(animate = true, keepPlaces = false) {
    // A stack change is under way; the new stack lays itself out.
    if (switchToken) return
    const wallet = $('wallet'), detail = $('detail')
    const h = cardH()
    const openIndex = cards.findIndex(c => c.id === state.open)
    // The nearer a card is to the one that moves first, the sooner it follows.
    const after = (i, from) => animate && from >= 0 ? Math.min(Math.abs(i - from), 5) * STAGGER : 0
    if (openIndex < 0) {
      detailTo(false, animate)
      const from = cards.findIndex(c => c.id === lastOpen)
      // Cards that stepped aside come back from where they went, a few ms apart.
      cards.forEach((card, i) => {
        const el = cardEl(card)
        if (animate && motionOf(el).parked) place(el, stackY(i) + (el.dataset.away === 'up' ? -28 : 96), { opacity: 0, scale: 0.97, instant: true })
        if (!keepPlaces) place(el, stackY(i), { instant: !animate, delay: after(i, from) })
        delete el.dataset.away
        el.style.zIndex = i + 1
        el.removeAttribute('aria-hidden')
        el.setAttribute('aria-expanded', 'false')
      })
      lastOpen = null
      heightTo(stackY(cards.length - 1) + h, animate)
    } else {
      lastOpen = state.open
      const top = h + 16
      detail.style.top = `${top}px`
      detailTo(true, animate)
      const detailH = detail.offsetHeight
      // The open card rises; the cards above step up, the ones below step down, both fading.
      cards.forEach((card, i) => {
        const el = cardEl(card)
        if (i === openIndex) {
          place(el, 0, { instant: !animate })
          el.style.zIndex = 40
          el.removeAttribute('aria-hidden')
          el.setAttribute('aria-expanded', 'true')
          delete el.dataset.away
        } else {
          const up = i < openIndex
          el.style.zIndex = i + 1
          el.setAttribute('aria-hidden', 'true')
          el.setAttribute('aria-expanded', 'false')
          if (motionOf(el).parked) return
          el.dataset.away = up ? 'up' : 'down'
          place(el, stackY(i) + (up ? -28 : 96), { opacity: 0, scale: 0.97, instant: !animate, delay: after(i, openIndex), onSettle: () => park(el) })
          if (!animate) park(el)
        }
      })
      heightTo(top + detailH + 8, animate)
    }
    const done = $('done')
    done.hidden = openIndex < 0 && cards !== SKILL_CARDS
    done.textContent = openIndex < 0 ? 'Zurück' : 'Fertig'
  }

  function scrollToWallet() {
    const y = $('wallet').getBoundingClientRect().top + window.scrollY - 70
    if (window.scrollY > y || y - window.scrollY > window.innerHeight * 0.45) window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' })
  }

  function openCard(id) {
    // Caught a card of the stack that was leaving: the switch turns back.
    if (switchToken) cancelSwitch()
    const closing = state.open === id
    if (!closing && id === 'merge' && pr.data?.state === 'merged' && !pr.lingering && !archived(pr.data)) {
      pr.playedAt = Date.now()
      markSeen()
    }
    state.open = closing ? null : id
    if (closing && pr.lingering) setTimeout(archiveMerge, 420)
    if (state.open) $('detail').innerHTML = detailHtml(cards.find(c => c.id === state.open))
    refreshCards()
    layout()
    if (state.open) scrollToWallet()
  }

  // The seen merge leaves: the card turns over to its empty side, ready for the next PR.
  function archiveMerge() {
    // Only from the closed main stack; otherwise the next close tries again.
    if (!pr.lingering || state.open || cards === SKILL_CARDS) return
    pr.lingering = false
    const el = cardEl({ id: 'merge' })
    if (!el) return
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap')
    setTimeout(() => refreshCards(), 260)
    setTimeout(() => el.classList.remove('swap'), 700)
  }

  // Switches between the main stack and the skills stack; the Skills card is the bridge.
  // Never locked: a tap mid-switch turns it back from wherever the cards are.
  let levelTarget = 'top', switchToken = null, switchTimer = 0
  const levelOf = () => cards === SKILL_CARDS ? 'skills' : 'top'
  function cancelSwitch() {
    switchToken = null
    clearTimeout(switchTimer)
    levelTarget = levelOf()
  }
  function enterLevel(level) {
    cancelSwitch()
    state.open = null
    // Turned around before the new stack was dealt: the old one comes back.
    if (level === levelOf()) { refreshCards(); layout(); return }
    levelTarget = level
    const wallet = $('wallet')
    const toSkills = level === 'skills'
    const keepEl = wallet.querySelector('[data-card="skills"]')
    const nextCards = toSkills ? SKILL_CARDS : TOP_CARDS
    const keepY = toSkills ? 0 : (nextCards.length - 1) * PEEK
    const token = switchToken = {}
    const swap = () => {
      if (switchToken !== token) return
      switchToken = null
      clearTimeout(switchTimer)
      const m = motionOf(keepEl)
      const live = m.anim.y?.stop()
      cards = nextCards
      buildWallet({ keep: 'skills', keepY: m.y, keepV: live ? live.v : 0 })
      if (toSkills) scrollToWallet()
    }
    detailTo(false)
    place(keepEl, keepY)
    const leaving = cards.filter(card => cardEl(card) !== keepEl)
    let left = leaving.length
    cards.forEach((card, i) => {
      const el = cardEl(card)
      if (el === keepEl) return
      if (motionOf(el).parked) place(el, stackY(i), { opacity: 0, scale: 0.97, instant: true })
      const order = toSkills ? i : cards.length - 1 - i
      place(el, stackY(i) + (toSkills ? 90 : 60), { opacity: 0, scale: 0.97, delay: Math.min(order, 5) * 30, onSettle: () => { if (--left <= 0) swap() } })
    })
    // In case a fade was cut short and never settles.
    switchTimer = setTimeout(swap, 900)
    if (!left) swap()
  }

  // Pressing gives way at once, on the way down, not when the finger lifts.
  ;(() => {
    let pressed = null, px = 0, py = 0
    const press = (el, down) => {
      el.classList.toggle('pressed', down)
      if (REDUCED.matches) return
      drive(el, motionOf(el), 'p', down ? 0.975 : 1, { response: down ? 0.2 : 0.36 })
    }
    const release = () => { if (pressed) press(pressed, false); pressed = null }
    $('wallet').addEventListener('pointerdown', e => {
      const el = e.target.closest('.wcard')
      if (!el || e.button > 0) return
      release()
      pressed = el; px = e.clientX; py = e.clientY
      press(el, true)
    })
    document.addEventListener('pointermove', e => { if (pressed && Math.hypot(e.clientX - px, e.clientY - py) > 10) release() }, { passive: true })
    document.addEventListener('pointerup', release)
    document.addEventListener('pointercancel', release)
  })()

  // --- Search results --------------------------------------------------------------
  function score(skill, q) {
    const n = skill.short.toLowerCase()
    if (n === q) return 100
    if (n.startsWith(q)) return 80
    if (n.includes(q)) return 60
    if (skill.summary.toLowerCase().includes(q)) return 40
    if (skill.category.toLowerCase().includes(q)) return 30
    if (skill.description.toLowerCase().includes(q)) return 20
    return 0
  }

  function renderResults() {
    const q = state.query.trim().toLowerCase()
    const searching = q.length > 0
    $('home').hidden = searching
    $('results').hidden = !searching
    $('clear').hidden = !searching
    if (!searching) return
    const hits = DATA.skills.map(s => ({ s, p: score(s, q) })).filter(h => h.p > 0).sort((a, b) => b.p - a.p || a.s.short.localeCompare(b.s.short)).map(h => h.s)
    const recs = recommended.filter(r => [r.title, r.author, r.summary].some(t => t.toLowerCase().includes(q)))
    if (!hits.length && !recs.length) {
      $('results').innerHTML = `<p class="empty">Kein Skill passt zu „${esc(state.query)}“. Versuch es mit einem anderen Wort.</p>`
      return
    }
    const parts = []
    if (hits.length) {
      const best = hits[0], cat = CAT[best.category], live = loadedSet().has(best.name)
      parts.push(`<h2 class="label"><span>Bester Treffer</span></h2>
        <button class="best" style="${colors(cat)}" data-hold="${esc(best.name)}" data-skill="${esc(best.name)}" aria-label="${esc(best.short)}. Tippen für Details, gedrückt halten zum Laden.">
          ${pattern(cat.pat)}<span class="fill"></span>
          <small>${esc(best.category)} · ${live ? 'geladen' : 'bereit'}</small>
          <h3>${esc(best.short)}</h3>
          <p>${esc(best.summary)}</p>
          <span class="hold-hint">Gedrückt halten zum Laden</span>
        </button>`)
    }
    const rest = hits.slice(1, 12)
    if (rest.length || recs.length) {
      parts.push(group('Weitere Treffer', hits.length - 1 + recs.length, rest.map((s, i) => skillRow(s, i)).join('') + recs.map((r, i) => recRow(r, rest.length + i)).join('')))
    }
    $('results').innerHTML = parts.join('')
  }

  function render() {
    const live = loadedSet()
    $('subtitle').textContent = live.size
      ? `${live.size} ${live.size === 1 ? 'Skill' : 'Skills'} geladen · ${DATA.skills.length} bereit`
      : `${DATA.skills.length} Skills bereit`
    renderSuggest()
    renderAlerts()
    refreshCards()
    // Leave the detail alone while a finger holds one of its buttons.
    // Let a running merge animation finish instead of restarting it.
    const playing = state.open === 'merge' && Date.now() - pr.playedAt < PLAY_MS && !!$('detail').querySelector('.merged.play')
    if (state.open && !hold && !playing) { $('detail').innerHTML = detailHtml(cards.find(c => c.id === state.open)); layout(true) }
    renderResults()
    refreshSheet()
  }

  // --- Markdown, kept small and safe: everything is escaped first ----------------
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  }
  function markdown(src) {
    const out = []
    const lines = String(src).replace(/\r/g, '').split('\n')
    let list = null, para = [], fence = null, table = []
    const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = [] } }
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null } }
    const flushTable = () => { if (table.length) { out.push(`<pre><code>${esc(table.join('\n'))}</code></pre>`); table = [] } }
    const flush = () => { flushPara(); flushList(); flushTable() }
    for (const line of lines) {
      if (fence) {
        if (/^\s*```/.test(line)) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null } else fence.push(line)
        continue
      }
      if (/^\s*```/.test(line)) { flush(); fence = []; continue }
      if (/^\s*\|/.test(line)) { flushPara(); flushList(); table.push(line); continue }
      flushTable()
      const h = line.match(/^(#{1,6})\s+(.*)$/)
      if (h) { flush(); const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue }
      const li = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)
      if (li) {
        flushPara()
        const tag = /\d/.test(li[1]) ? 'ol' : 'ul'
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] } }
        list.items.push(li[2]); continue
      }
      const q = line.match(/^>\s?(.*)$/)
      if (q) { flush(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue }
      if (!line.trim()) { flush(); continue }
      if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += ' ' + line.trim(); continue }
      flushList(); para.push(line.trim())
    }
    if (fence) out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`)
    flush()
    return out.join('')
  }

    if (live) return { dot: '#30d158', t: `Geladen · ${uses.length}× · ${ago(uses[uses.length - 1].at)}` }
    if (state.pending.has(skill.name)) return { dot: '#64d2ff', t: 'Wird geladen …' }

  function contextBody() {
    const p = ctxShare(), look = ctxLook(p), th = ctxMark()
    const R = 100, C = 120
    const a = (th * 360 - 90) * Math.PI / 180
    const tick = `<line class="tick" x1="${(C + (R - 13) * Math.cos(a)).toFixed(1)}" y1="${(C + (R - 13) * Math.sin(a)).toFixed(1)}" x2="${(C + (R + 13) * Math.cos(a)).toFixed(1)}" y2="${(C + (R + 13) * Math.sin(a)).toFixed(1)}"/>`

    const resetAt = ctx.limit?.resetsAt ? new Date(ctx.limit.resetsAt) : null

    const limitText = !ctx.limit ? '–' : `${Math.round(ctx.limit.percentUsed)} % genutzt${reset ? ` · neu um ${reset}` : ''}`

            <circle class="trk" cx="${C}" cy="${C}" r="${R}" stroke-width="24"/>
            <circle class="arc draw" id="ctx-arc" cx="${C}" cy="${C}" r="${R}" stroke-width="24" stroke="url(#ctx-grad)" style="${arcStyle(R, p)}"/>
            ${tick}

        </div>

  // --- Composer ----------------------------------------------------------------------

      send: (text, el) => loadSkill(name, text, el) })

  function openWriter(spec) {

  function closeComposer(sent = false) {

    if (!sent) $('go')?.focus?.({ preventScroll: true })
