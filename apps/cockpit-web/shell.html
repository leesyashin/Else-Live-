  // --- Markdown, kept small and safe: everything is escaped first ----------------
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  }
  function markdown(src) {
    const out = []
    const lines = String(src).replace(/\r/g, '').split('\n')
    let list = null, para = [], fence = null, table = []
    const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = [] } }
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null } }
    const flushTable = () => { if (table.length) { out.push(`<pre><code>${esc(table.join('\n'))}</code></pre>`); table = [] } }
    const flush = () => { flushPara(); flushList(); flushTable() }
    for (const line of lines) {
      if (fence) {
        if (/^\s*```/.test(line)) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null } else fence.push(line)
        continue
      }
      if (/^\s*```/.test(line)) { flush(); fence = []; continue }
      if (/^\s*\|/.test(line)) { flushPara(); flushList(); table.push(line); continue }
      flushTable()
      const h = line.match(/^(#{1,6})\s+(.*)$/)
      if (h) { flush(); const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue }
      const li = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)
      if (li) {
        flushPara()
        const tag = /\d/.test(li[1]) ? 'ol' : 'ul'
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] } }
        list.items.push(li[2]); continue
      }
      const q = line.match(/^>\s?(.*)$/)
      if (q) { flush(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue }
      if (!line.trim()) { flush(); continue }
      if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += ' ' + line.trim(); continue }
      flushList(); para.push(line.trim())
    }
    if (fence) out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`)
    flush()
    return out.join('')
  }

  // --- Sheet (a skill as a pass) ---------------------------------------------------
  const details = { promise: null }
  function loadDetails() {
    details.promise ??= fetch('skills.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
    return details.promise
  }
  const sendAvailable = () => state.canSend === 'available'
  function sendReason() {
    return {
      writers_only: 'Nur Bearbeiter dieser Seite können Claude Aufträge schicken.',
      no_session: 'Gerade hört keine Claude-Session zu. Öffne die Session, dann klappt es.',
      off: 'Aufträge an Claude sind in dieser Ansicht nicht möglich.',
      unknown: 'Verbindung zu Claude wird geprüft …',
      none: 'Diese Ansicht kann keine Aufträge an Claude schicken.',
    }[state.canSend] || 'Aufträge an Claude sind gerade nicht möglich.'
  }

  function skillStatus(skill) {
    const live = loadedSet().has(skill.name)
    const uses = state.loaded.filter(u => u.skill === skill.name)
    if (live) return { dot: '#30d158', t: `Geladen · ${uses.length}× · ${ago(uses[uses.length - 1].at)}` }
    if (state.pending.has(skill.name)) return { dot: '#64d2ff', t: 'Wird geladen …' }
    return { dot: 'rgba(255,255,255,.85)', t: 'Bereit' }
  }

  function refreshSheet() {
    const open = state.sheet
    if (!open) return
    if (open.context) return
    const go = $('go'), hint = $('go-hint')
    if (go) go.disabled = !sendAvailable()
    if (hint) { hint.hidden = sendAvailable(); hint.textContent = sendReason() }
    if (!open.skill) return
    const skill = skillByName(open.skill)
    const st = skillStatus(skill)
    const pill = $('pass-status')
    if (pill) { pill.style.setProperty('--dot', st.dot); pill.querySelector('span').textContent = st.t }
    const fav = $('pass').querySelector('[data-fav]')
    if (fav) { const on = state.favorites.has(skill.name); fav.setAttribute('aria-pressed', on); fav.textContent = on ? '★' : '☆' }
  }

  function contextBody() {
    const p = ctxShare(), look = ctxLook(p), th = ctxMark()
    const R = 100, C = 120
    const a = (th * 360 - 90) * Math.PI / 180
    const tick = `<line class="tick" x1="${(C + (R - 13) * Math.cos(a)).toFixed(1)}" y1="${(C + (R - 13) * Math.sin(a)).toFixed(1)}" x2="${(C + (R + 13) * Math.cos(a)).toFixed(1)}" y2="${(C + (R + 13) * Math.sin(a)).toFixed(1)}"/>`
    const left = ctx.threshold != null && ctx.used != null ? Math.max(0, ctx.threshold - ctx.used) : null
    const resetAt = ctx.limit?.resetsAt ? new Date(ctx.limit.resetsAt) : null
    const reset = resetAt && !isNaN(resetAt) ? resetAt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : null
    const limitText = !ctx.limit ? '–' : `${Math.round(ctx.limit.percentUsed)} % genutzt${reset ? ` · neu um ${reset}` : ''}`
    const limitName = ctx.limit?.kind === 'five_hour' ? 'Nutzungslimit (5 Std.)' : ctx.limit?.kind === 'seven_day' ? 'Nutzungslimit (7 Tage)' : 'Nutzungslimit'
    return `
      <div class="card ring-card">
        <div class="ring-wrap">
          <svg viewBox="0 0 240 240" role="img" aria-label="Kontext ${pct(p)} belegt">
            <defs><linearGradient id="ctx-grad" x1="0" y1="0" x2="1" y2="1"><stop id="ctx-g1" offset="0" stop-color="${look.a}"/><stop id="ctx-g2" offset="1" stop-color="${look.b}"/></linearGradient></defs>
            <circle class="trk" cx="${C}" cy="${C}" r="${R}" stroke-width="24"/>
            <circle class="arc draw" id="ctx-arc" cx="${C}" cy="${C}" r="${R}" stroke-width="24" stroke="url(#ctx-grad)" style="${arcStyle(R, p)}"/>
            ${tick}
          </svg>
          <div class="ring-center"><b id="ctx-num">${pct(p)}</b><span id="ctx-sub">${tokens(ctx.used)} von ${tokens(ctx.max)}</span></div>
        </div>
        <div class="legend"><span><i style="background:${look.a}"></i>belegt</span><span><i style="background:var(--fg);opacity:.55"></i>Zusammenfassen bei ${pct(th)}</span></div>
      </div>
      ${ctx.error ? `<div class="card"><p class="muted" id="ctx-err">${esc(ctxError())}</p></div>` : ''}
      <div class="card">
        <div class="kv"><span>Bis zum Zusammenfassen</span><span id="ctx-left">${left == null ? '–' : `noch ${tokens(left)}`}</span></div>
        <div class="meter" style="--ca:${look.a};--cb:${look.b}"><i id="ctx-meter" style="width:${p == null ? 0 : Math.min(100, (p / th) * 100).toFixed(1)}%"></i></div>
        <p class="small">Erreicht der Kontext die Marke, fasst Claude den bisherigen Verlauf zusammen, damit Platz für Neues bleibt. Einzelheiten aus frühen Teilen können dabei verloren gehen.</p>
      </div>
      <div class="card">
        <div class="kv"><span>Kosten dieser Session</span><span id="ctx-cost">${ctx.cost == null ? '–' : `${ctx.cost.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} $`}</span></div>
        <div class="kv"><span>${esc(limitName)}</span><span id="ctx-limit">${esc(limitText)}</span></div>
        <div class="kv"><span>Session</span><span>${esc(ctx.repo || '–')}</span></div>
        <div class="kv"><span>Aktualisiert</span><span id="ctx-at">${ctx.at ? esc(agoSec(ctx.at)) : '–'}</span></div>
      </div>`
  }

  function agoSec(at) {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000))
    return s < 10 ? 'gerade eben' : s < 60 ? `vor ${s} s` : ago(at)
  }

  function renderContextSheet(fresh) {
    const pass = $('pass'), body = $('sheet-body')
    const p = ctxShare(), look = ctxLook(p)
    if (fresh) {
      pass.className = 'pass'
      pass.style.cssText = colors(SESSION)
      pass.innerHTML = `${pattern('radar')}
        <div class="pass-head"><div class="txt"><small>Cockpit · diese Session</small><h2 id="sheet-title">Kontext</h2></div>
          <button class="round" data-close aria-label="Schließen">✕</button></div>
        <span class="pass-status" id="pass-status" style="--dot:${look.a}"><i></i><span>${esc(ctx.error ? 'Nicht abrufbar' : look.word)}</span></span>`
      body.innerHTML = contextBody()
      return
    }
    // Live update in place, so the ring glides instead of redrawing.
    const arc = $('ctx-arc')
    if (!arc || (ctx.error && !$('ctx-err'))) { body.innerHTML = contextBody(); return }
    arc.classList.remove('draw')
    arc.setAttribute('style', arcStyle(100, p))
    $('ctx-g1').setAttribute('stop-color', look.a); $('ctx-g2').setAttribute('stop-color', look.b)
    $('ctx-num').textContent = pct(p)
    $('ctx-sub').textContent = `${tokens(ctx.used)} von ${tokens(ctx.max)}`
    const left = ctx.threshold != null && ctx.used != null ? Math.max(0, ctx.threshold - ctx.used) : null
    $('ctx-left').textContent = left == null ? '–' : `noch ${tokens(left)}`
    $('ctx-meter').style.width = `${p == null ? 0 : Math.min(100, (p / ctxMark()) * 100).toFixed(1)}%`
    $('ctx-at').textContent = ctx.at ? agoSec(ctx.at) : '–'
    const pill = $('pass-status')
    if (pill) { pill.style.setProperty('--dot', look.a); pill.querySelector('span').textContent = ctx.error ? 'Nicht abrufbar' : look.word }
  }

  function renderContext() {
    const p = ctxShare(), look = ctxLook(p)
    $('chip-pct').textContent = pct(p)
    const arc = $('chip-arc')
    arc.setAttribute('style', `${arcStyle(14, p)};stroke:${look.a}`)
    $('ctx-chip').setAttribute('aria-label', `Kontext dieser Session: ${pct(p)} belegt, ${look.word}`)
    const session = document.querySelector('[data-card="session"]')
    if (session) session.innerHTML = cardHtml(cards[0])
    if (state.open === 'session') { $('detail').innerHTML = detailHtml(cards[0]); layout() }
    if (state.sheet?.context) renderContextSheet(false)
  }

  async function renderSheet() {
    const open = state.sheet
    const pass = $('pass'), body = $('sheet-body')
    if (open.context) { renderContextSheet(true); return }
    if (open.rec) {
      const rec = DATA.recommended.find(r => r.id === open.rec)
      pass.className = 'pass light'
      pass.style.cssText = colors(TICKET)
      pass.innerHTML = `${pattern('guilloche')}
        <div class="pass-head"><div class="txt"><small>Empfohlen · ${esc(rec.author)}</small><h2 id="sheet-title">${esc(rec.title)}</h2></div>
          <button class="round" data-close aria-label="Schließen">✕</button></div>
        <span class="pass-status" style="--dot:#ff9f0a"><i></i><span>Nicht installiert</span></span>`
      body.innerHTML = `
        <div class="card"><p class="lead">${esc(rec.summary)}</p></div>
        <div class="card"><b>Was er tut</b><ul class="rules">${rec.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
        <div class="card"><b>Referenzen</b><p class="muted">${esc(rec.referenceNote)}</p>
          <div class="links">${rec.references.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div></div>
        ${rec.note ? `<div class="card"><p class="muted">⚠︎ ${esc(rec.note)}</p></div>` : ''}
        <div class="card"><div class="kv"><span>Installation</span><span><code>${esc(rec.install)}</code></span></div></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="primary" id="go" data-install="${esc(rec.id)}" ${sendAvailable() ? '' : 'disabled'}>Von Claude installieren lassen</button>
          <p class="small" id="go-hint" ${sendAvailable() ? 'hidden' : ''}>${esc(sendReason())}</p>
        </div>`
      return
    }
    const skill = skillByName(open.skill)
    const cat = CAT[skill.category]
    const st = skillStatus(skill)
    const fav = state.favorites.has(skill.name)
    pass.className = 'pass'
    pass.style.cssText = colors(cat)
    pass.innerHTML = `${pattern(cat.pat)}
      <div class="pass-head"><div class="txt"><small>Cockpit · ${esc(skill.category)}</small><h2 id="sheet-title">${esc(skill.short)}</h2></div>
        <button class="round" data-fav="${esc(skill.name)}" aria-pressed="${fav}" aria-label="Favorit">${fav ? '★' : '☆'}</button>
        <button class="round" data-close aria-label="Schließen">✕</button></div>
      <span class="pass-status" id="pass-status" style="--dot:${st.dot}"><i></i><span>${esc(st.t)}</span></span>`
    body.innerHTML = `
      <div class="card">
        <p class="lead">${esc(skill.summary)}</p>
        ${skill.description ? `<p class="muted">${esc(skill.description)}</p>` : ''}
      </div>
      <div class="card">
        <div class="start-row">
          <button class="primary" id="go" data-start="${esc(skill.name)}" ${sendAvailable() ? '' : 'disabled'}>Starten</button>
          <button class="icon-action" data-compose="${esc(skill.name)}" aria-label="Mit Aufgabe starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 8l2 2"/></svg></button>
        </div>
        <p class="small" id="go-hint" ${sendAvailable() ? 'hidden' : ''}>${esc(sendReason())}</p>
        <div class="links-row">
          <button class="text-btn" data-compose="${esc(skill.name)}">Mit Aufgabe starten</button>
          <button class="text-btn" data-copy="${esc(skill.name)}">Befehl kopieren</button>
        </div>
      </div>
      <div class="card">
        <div class="kv"><span>Befehl</span><span><code>/${esc(skill.name)}</code></span></div>
        <div class="kv"><span>Herkunft</span><span>${esc(skill.source)}</span></div>
        <div class="kv"><span>Dateien</span><span>${skill.hasFiles ? `Anleitung${skill.fileCount ? ` + ${skill.fileCount} Referenzen` : ''}` : 'eingebaut, keine Dateien'}</span></div>
      </div>
      <div id="docs">${skill.hasFiles ? '<div class="card"><p class="muted">Lade Anleitung …</p></div>' : ''}</div>`
    if (skill.hasFiles) {
      const all = await loadDetails()
      if (state.sheet !== open) return
      const d = all[skill.name]
      const docs = $('docs')
      if (!d) { docs.innerHTML = '<div class="card"><p class="muted">Die Anleitung konnte nicht geladen werden.</p></div>'; return }
      docs.innerHTML = `<section class="block"><h2 class="label"><span>Anleitung &amp; Referenzen</span></h2><div class="cells">
        <details><summary><span>SKILL.md · was Claude liest</span>${CHEV}</summary><div class="doc">${markdown(d.body)}</div></details>
        ${d.files.map(f => `<details><summary><span>${esc(f.label)}</span>${f.text === undefined ? `<small>${f.kind === 'other' ? 'Datei' : 'zu groß'}</small>` : ''}${CHEV}</summary>
          <div class="doc">${f.text === undefined ? `<p class="muted">${esc(f.label)} · ${Math.round(f.size / 1024)} KB, hier nicht darstellbar.</p>` : f.kind === 'text' && /\.md$/i.test(f.label) ? markdown(f.text) : `<pre><code>${esc(f.text)}</code></pre>`}</div></details>`).join('')}
      </div></section>`
    }
  }

  // --- Composer ----------------------------------------------------------------------
  let composing = null
  function openComposer(name) {
    if (!sendAvailable()) { island('Nicht möglich', sendReason(), 'warn'); return }
    const skill = skillByName(name)
    composing = name
    $('c-title').textContent = skill ? skill.short : short(name)
    const tile = $('c-tile')
    tile.style.cssText = colors(CAT[skill?.category] || CAT.Weitere)
    tile.innerHTML = `<span class="mono">${esc(mono(name))}</span>`
    const task = $('task')
    task.value = ''
    $('c-count').textContent = '0/3000'
    $('c-send').disabled = true
    $('composer').hidden = false; $('cscrim').hidden = false
    // Focus inside the tap itself, so iOS raises the keyboard.
    task.focus({ preventScroll: true })
    requestAnimationFrame(() => { $('composer').classList.add('open'); $('cscrim').classList.add('open') })
  }
  function closeComposer(sent = false) {
    if (!composing) return
    composing = null
    $('task').blur()
    $('composer').classList.remove('open'); $('cscrim').classList.remove('open')
    setTimeout(() => { if (!composing) { $('composer').hidden = true; $('cscrim').hidden = true } }, 320)
    if (!sent) $('go')?.focus?.({ preventScroll: true })
  }

  let lastFocus = null
  function openSheet(target) {
    lastFocus = document.activeElement
    state.sheet = target
    const sheet = $('sheet'), scrim = $('scrim')
    sheet.hidden = false; scrim.hidden = false
    document.body.classList.add('locked')
    renderSheet()
    $('sheet-body').scrollTop = 0
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open') }))
    setTimeout(() => $('pass').querySelector('[data-close]')?.focus({ preventScroll: true }), 380)
  }
  function closeSheet() {
    const sheet = $('sheet'), scrim = $('scrim')
    sheet.style.transform = ''
    sheet.classList.remove('open', 'dragging'); scrim.classList.remove('open')
    document.body.classList.remove('locked')
    state.sheet = null
    setTimeout(() => { if (!state.sheet) { sheet.hidden = true; scrim.hidden = true } }, 550)
    lastFocus?.focus?.({ preventScroll: true })
  }

  // Drag the pass down to dismiss the sheet.
  ;(() => {
    let startY = 0, lastY = 0, lastT = 0, velocity = 0, dragging = false
    const sheet = $('sheet')
    const down = e => {
      if (e.target.closest('button')) return
      dragging = true; startY = lastY = e.clientY; lastT = performance.now(); velocity = 0
      sheet.classList.add('dragging'); e.currentTarget.setPointerCapture?.(e.pointerId)
    }
    const move = e => {
      if (!dragging) return
      const now = performance.now()
      velocity = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now
      const dy = e.clientY - startY
      sheet.style.transform = `translateY(${dy < 0 ? dy / 4 : dy}px)`
    }
    const up = () => {
      if (!dragging) return
      dragging = false; sheet.classList.remove('dragging')
      if (lastY - startY > 110 || velocity > 0.6) closeSheet(); else sheet.style.transform = ''
    }
    for (const el of [$('grab'), $('pass')]) {
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move)
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
    }
  })()

  // --- Dynamic Island --------------------------------------------------------------
  let islandTimer = 0
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  function island(title, detail, mood = 'ok', look = null) {
    const el = $('island'), ii = el.querySelector('.ii')
    if (mood === 'busy' && look) { ii.style.cssText = `${colors(look)};background:linear-gradient(155deg,var(--c1),var(--c2))`; ii.textContent = look.mono }
    else if (mood === 'warn') { ii.style.cssText = 'background:var(--warn)'; ii.textContent = '!' }
    else { ii.style.cssText = 'background:var(--loaded)'; ii.innerHTML = CHECK }
    el.querySelector('.ispin').hidden = mood !== 'busy'
    el.querySelector('b').textContent = title
    el.querySelector(':scope > div > span').textContent = detail || ''
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show')
    clearTimeout(islandTimer)
    islandTimer = setTimeout(() => el.classList.remove('show'), mood === 'busy' ? 9000 : 3200)
  }

  // --- Talking to Claude -----------------------------------------------------------
  let comments = null
  async function refreshLink() {
    const before = state.canSend
    if (!comments) state.canSend = 'none'
    else { try { state.canSend = await comments.canSendToClaude() } catch { state.canSend = 'off' } }
    if (before !== state.canSend && state.open === 'merge' && !hold) render()
    const link = $('link')
    link.classList.toggle('on', state.canSend === 'available')
    link.querySelector('span').textContent = state.canSend === 'available' ? 'Mit Claude verbunden' : state.canSend === 'unknown' ? 'Verbinde …' : 'Ohne Claude'
    refreshSheet()
  }

  async function sendToClaude(text, anchorEl) {
    if (!comments || !sendAvailable()) { island('Nicht gesendet', sendReason(), 'warn'); return false }
    try {
      const anchor = await comments.anchorFor(anchorEl)
      await comments.sendToClaude({ anchor, text })
      return true
    } catch (error) {
      const code = error && error.code
      const why = {
        consent_required: 'Erlaube der Seite einmal, in deinem Namen zu kommentieren.',
        forbidden: 'Kommentieren von der Seite aus ist hier aus.',
        claude_unavailable: 'Gerade hört keine Claude-Session zu.',
        rate_limited: 'Kurz warten, dann noch einmal.',
      }[code] || 'Etwas ist schiefgegangen. Versuch es gleich noch einmal.'
      island('Nicht gesendet', why, 'warn')
      if (code === 'forbidden' || code === 'claude_unavailable') refreshLink()
      return false
    }
  }

  async function loadSkill(name, task, el) {
    const sent = await sendToClaude(`Cockpit · Skill laden\n/${name}${task ? ' ' + task : ''}`, el)
    if (!sent) return false
    state.pending.set(name, Date.now())
    const skill = skillByName(name)
    island('Wird geladen', `${short(name)} · Claude startet ihn`, 'busy', skill ? { ...CAT[skill.category], mono: mono(name) } : null)
    // Let the row finish its check animation before it turns into "Lädt".
    setTimeout(render, 900)
    return true
  }

  async function installRec(id, el) {
    const rec = DATA.recommended.find(r => r.id === id)
    const sent = await sendToClaude(`Cockpit · Skill installieren\n${rec.title} von ${rec.author}: ${rec.install}`, el)
    if (sent) island('Wird installiert', `${rec.title} · Claude kümmert sich`, 'busy', { ...CAT.Design, mono: mono(rec.id) })
    return sent
  }

  async function requestMerge(el) {
    const d = pr.data
    if (!d || d.state !== 'open' || mergeBusy(d)) return false
    const blockers = mergeBlockers(d)
    if (blockers.length) { island('Gesperrt', blockers[0], 'warn'); return false }
    const sent = await sendToClaude(`Cockpit · Merge\n${d.repo} #${d.number}: ${d.head} → ${d.base}`, el)
    if (!sent) return false
    pr.pending = Date.now()
    island('Merge angefordert', `#${d.number} → ${d.base} · Claude prüft und merged`, 'busy', { ...MERGE, mono: 'PR' })
    setTimeout(render, 900)
    return true
  }

  async function refreshPr(el) {
    const repo = pr.data?.repo || ctx.repo || ''
    const sent = await sendToClaude(`Cockpit · PR prüfen\n${repo}`.trim(), el)
    if (sent) island('Angefragt', 'Claude trägt den aktuellen Stand ein')
  }

  async function refreshSetup(el) {
    const sent = await sendToClaude(`Cockpit · Setup prüfen\n${setup.data?.repo || ctx.repo || ''}`.trim(), el)
    if (sent) island('Angefragt', 'Die Mod prüft das Setup neu')
  }

  async function copyCommand(name, task) {
    const text = `/${name}${task ? ' ' + task : ''}`
    try { await navigator.clipboard.writeText(text); island('Befehl kopiert', 'Im Chat einfügen und senden') }
    catch { island('Kopieren ging nicht', text, 'warn') }
  }

  // --- Hold to load ----------------------------------------------------------------
  let hold = null, swallowClick = false
  document.documentElement.style.setProperty('--hold', `${HOLD_MS}ms`)
  document.documentElement.style.setProperty('--hold-delay', `${HOLD_DELAY}ms`)
  document.documentElement.style.setProperty('--hold-draw', `${HOLD_MS - HOLD_DELAY}ms`)
  document.documentElement.style.setProperty('--hold-merge', `${MERGE_HOLD_MS}ms`)
  function cancelHold() {
    if (!hold) return
    clearTimeout(hold.timer)
    hold.el.classList.remove('holding')
    hold = null
  }
  document.addEventListener('pointerdown', e => {
    swallowClick = false
    const el = e.target.closest('[data-hold]')
    if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return
    cancelHold()
    hold = { el, x: e.clientX, y: e.clientY, timer: 0 }
    el.classList.add('holding')
    hold.timer = setTimeout(async () => {
      const target = hold && hold.el
      if (!target) return
      hold = null
      swallowClick = true
      target.classList.remove('holding')
      target.classList.add('fired')
      setTimeout(() => target.classList.remove('fired'), 1500)
      navigator.vibrate?.([8, 40, 14])
      const key = target.dataset.hold
      if (key.startsWith('merge:')) await requestMerge(target)
      else if (key.startsWith('rec:')) await installRec(key.slice(4), target)
      else if (loadedSet().has(key)) island('Schon geladen', `${short(key)} läuft in dieser Session`)
      else await loadSkill(key, '', target)
    }, el.dataset.hold.startsWith('merge:') ? MERGE_HOLD_MS : HOLD_MS)
  })
  document.addEventListener('pointermove', e => {
    if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10) cancelHold()
  }, { passive: true })
  document.addEventListener('pointerup', cancelHold)
  document.addEventListener('pointercancel', cancelHold)
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault() })

  // --- Events ----------------------------------------------------------------------
  document.addEventListener('click', async e => {
    if (swallowClick) { swallowClick = false; e.preventDefault(); return }
    const t = e.target.closest('button, .scrim')
    if (!t) return
    if (t.id === 'scrim' || t.hasAttribute('data-close')) return closeSheet()
    if (t.id === 'done') return openCard(state.open)
    if (t.id === 'clear') { $('q').value = ''; state.query = ''; renderResults(); $('q').focus(); return }
    if (t.hasAttribute('data-context')) return openSheet({ context: true })
    if (t.dataset.card) return openCard(t.dataset.card)
    if (t.dataset.try) { $('q').value = t.dataset.try; state.query = t.dataset.try; renderResults(); return }
    if (t.dataset.skill) return openSheet({ skill: t.dataset.skill })
    if (t.dataset.rec) return openSheet({ rec: t.dataset.rec })
    if (t.dataset.fav) {
      const name = t.dataset.fav
      state.favorites.has(name) ? state.favorites.delete(name) : state.favorites.add(name)
      store.set('cockpit.favorites', [...state.favorites])
      render(); return
    }
    if (t.dataset.compose) return openComposer(t.dataset.compose)
    if (t.hasAttribute('data-cancel') || t.id === 'cscrim') return closeComposer()
    if (t.hasAttribute('data-send')) {
      const task = $('task').value.trim()
      if (!task || !composing) return
      t.disabled = true
      const sent = await loadSkill(composing, task, $('go') || t)
      t.disabled = false
      if (sent) closeComposer(true)
      return
    }
    if (t.dataset.copy) return copyCommand(t.dataset.copy, '')
    if (t.hasAttribute('data-pr-refresh')) return refreshPr(t)
    if (t.hasAttribute('data-setup-refresh')) return refreshSetup(t)
    if (t.dataset.hold?.startsWith('merge:')) return island('Gedrückt halten', 'Erst nach 1,2 s Halten wird gemergt', 'warn')
    if (t.dataset.start) {
      t.disabled = true
      await loadSkill(t.dataset.start, '', t)
      t.disabled = !sendAvailable()
      return
    }
    if (t.dataset.install) {
      t.disabled = true
      await installRec(t.dataset.install, t)
      t.disabled = !sendAvailable()
    }
  })
  $('q').addEventListener('input', e => { state.query = e.target.value; renderResults() })
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return
    if (composing) closeComposer(); else if (state.sheet) closeSheet()
  })
  $('task').addEventListener('input', e => {
    const n = e.target.value.length
    $('c-count').textContent = `${n}/3000`
    $('c-send').disabled = !e.target.value.trim() || !sendAvailable()
  })
  // The scrim is a div: clicks on it close the composer too.
  $('cscrim').addEventListener('click', () => closeComposer())
  window.addEventListener('resize', () => layout(false))
  setInterval(() => { if (state.loaded.length) render() }, 60000)

  buildWallet()
  render()

  setInterval(() => { if (state.sheet?.context && ctx.at) $('ctx-at').textContent = agoSec(ctx.at) }, 5000)

  // --- Live status from the session (written by Claude) ----------------------------
  ;(async () => {
    const db = await use('db')
    if (!db) { ctx.error = 'none'; renderContext(); return }
    db.doc('cockpit/context').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null
      if (!d || typeof d.used !== 'number' || typeof d.max !== 'number' || d.max <= 0) { ctx.error = 'no_data'; renderContext(); return }
      ctx.used = d.used
      ctx.max = d.max
      ctx.threshold = typeof d.threshold === 'number' ? d.threshold : null
      ctx.cost = typeof d.costUsd === 'number' ? d.costUsd : null
      const limits = Array.isArray(d.limits) ? d.limits.filter(l => l && typeof l.percentUsed === 'number') : []
      ctx.limit = limits.find(l => l.kind === 'five_hour') || limits[0] || null
      ctx.repo = typeof d.repo === 'string' ? d.repo : null
      ctx.at = typeof d.at === 'number' ? d.at : 0
      ctx.error = null
      renderContext()
    }, () => { ctx.error = 'no_data'; renderContext() })
    db.doc('cockpit/pr').onSnapshot(snap => {
      const before = pr.data
      const d = snap.exists ? cleanPr(snap.data()) : null
      pr.data = d
      pr.error = null
      if (d && pr.pending) {
        const answered = d.state !== 'open' || (d.merge && d.merge.at >= pr.pending - 60000 && d.merge.state !== 'running')
        if (answered || Date.now() - pr.pending > MERGE_PENDING_MS) pr.pending = 0
      }
      if (before && d && before.number === d.number) {
        if (before.state === 'open' && d.state === 'merged') {
          pr.playedAt = Date.now()
          navigator.vibrate?.([10, 60, 18])
          island('Gemergt', `#${d.number} ist in ${d.base}${d.merge?.branchDeleted ? ', Branch gelöscht' : ''}`)
        } else if (d.merge?.state === 'failed' && before.merge?.at !== d.merge.at) {
          island('Merge abgebrochen', d.merge.message || `#${d.number} wurde nicht gemergt`, 'warn')
        }
      }
      render()
    }, () => { pr.error = 'no_data'; render() })
    db.doc('cockpit/setup').onSnapshot(snap => {
      setup.data = snap.exists ? cleanSetup(snap.data()) : null
      setup.error = null
      render()
    }, () => { setup.error = 'no_data'; render() })
    db.doc('cockpit/status').onSnapshot(snap => {
      const data = snap.exists ? snap.data() : null
      const loaded = Array.isArray(data?.loaded) ? data.loaded.filter(u => u && typeof u.skill === 'string' && typeof u.at === 'number') : []
      const before = loadedSet()
      state.loaded = loaded.slice(-200)
      for (const [name, at] of state.pending) {
        if (state.loaded.some(u => u.skill === name && u.at >= at - 60000)) state.pending.delete(name)
      }
      const fresh = state.loaded.filter(u => !before.has(u.skill))
      if (before.size && fresh.length) island('Geladen', fresh.map(u => short(u.skill)).join(', '))
      render()
    }, () => {})
  })()
  ;(async () => {
    comments = await use('comments')
    await refreshLink()
    setInterval(refreshLink, 30000)
  })()
})()
</script>
