  let lastFocus = null
  function openSheet(target) {
    lastFocus = document.activeElement
    state.sheet = target
    const sheet = $('sheet'), scrim = $('scrim')
    // Reopened while still leaving: take it back from where it is.
    if (sheetMotion.anim) { sheetMotion.anim.stop(); sheetMotion.anim = null; sheet.style.transform = ''; sheet.classList.remove('dragging'); sheetMotion.y = 0 }
    sheet.hidden = false; scrim.hidden = false
    document.body.classList.add('locked')
    renderSheet()
    $('sheet-body').scrollTop = 0
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open') }))
    setTimeout(() => $('pass').querySelector('[data-close]')?.focus({ preventScroll: true }), 380)
  }
  function closeSheet(velocity = 0) {
    const sheet = $('sheet'), scrim = $('scrim')
    scrim.classList.remove('open')
    document.body.classList.remove('locked')
    sheetMotion.leaving = state.sheet
    state.sheet = null
    const hide = () => {
      if (state.sheet) return
      sheet.hidden = true; scrim.hidden = true
      sheet.style.transform = ''; sheet.classList.remove('open', 'dragging'); sheetMotion.y = 0
    }
    // A close by button may land while the sheet is still rising: start from the live value.
    if (!sheetMotion.anim && !sheet.classList.contains('dragging')) sheetMotion.y = new DOMMatrix(getComputedStyle(sheet).transform).m42
    if (REDUCED.matches) { sheet.classList.remove('open'); setTimeout(hide, 220) }
    // Out along the path it came in, at the speed it was let go.
    else sheetTo(sheet.offsetHeight + 24, Math.max(velocity, 0), hide)
    lastFocus?.focus?.({ preventScroll: true })
  }

  // --- Springs (apple-design) ---------------------------------------------------------
  // Damping ratio + response, as Apple tunes them; the motion starts from the live value
  // and carries the finger's velocity, so it can be grabbed again at any moment.
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)')
  function spring({ from, to, velocity = 0, damping = 1, response = 0.35, onUpdate, onDone }) {
    const k = (2 * Math.PI / response) ** 2
    const c = 4 * Math.PI * damping / response
    let x = from, v = velocity, last = performance.now(), raf = 0, live = true
    const step = now => {
      if (!live) return
      const dt = Math.min(0.032, (now - last) / 1000); last = now
      for (let i = 0; i < 4; i += 1) { const a = -k * (x - to) - c * v; v += a * dt / 4; x += v * dt / 4 }
      if (Math.abs(x - to) < 0.4 && Math.abs(v) < 12) { onUpdate(to); live = false; onDone?.(); return }
      onUpdate(x); raf = requestAnimationFrame(step)
    }
    raf = requestAnimationFrame(step)
    return { stop() { live = false; cancelAnimationFrame(raf); return { x, v } } }
  }
  // Where a flick comes to rest (Apple's projection, scroll-like deceleration).
  const project = (velocity, rate = 0.995) => (velocity / 1000) * rate / (1 - rate)
  // Past an edge the sheet follows less and less instead of stopping dead.
  const rubberband = (over, size, k = 0.55) => (over * size * k) / (size + k * Math.abs(over))

  // Drag the pass down to dismiss the sheet: 1:1 while held, then a spring that keeps
  // the finger's speed. Grabbing it again mid-flight picks it up where it is.
  const sheetMotion = { anim: null, y: 0 }
  function sheetTo(target, velocity, done) {
    const sheet = $('sheet')
    sheetMotion.anim?.stop()
    sheet.classList.add('dragging')
    const close = target > 0
    sheetMotion.anim = spring({
      from: sheetMotion.y, to: target, velocity,
      // A flick earns a little bounce; a calm release settles without one.
      damping: !close && Math.abs(velocity) > 400 ? 0.8 : 1, response: close ? 0.3 : 0.35,
      onUpdate: y => { sheetMotion.y = y; sheet.style.transform = `translateY(${y}px)` },
      onDone: () => { sheetMotion.anim = null; if (!close) { sheet.style.transform = ''; sheet.classList.remove('dragging') } done?.() },
    })
  }
  ;(() => {
    const sheet = $('sheet')
    let startY = 0, base = 0, dragging = false, trail = []
    const down = e => {
      if (e.target.closest('button, a')) return
      // Caught while leaving: it comes back under the finger.
      if (!state.sheet && sheetMotion.anim && sheetMotion.leaving) {
        state.sheet = sheetMotion.leaving
        $('scrim').classList.add('open'); document.body.classList.add('locked')
      }
      if (!state.sheet) return
      // Interrupt: start from where the sheet is on screen right now.
      const halted = sheetMotion.anim?.stop(); sheetMotion.anim = null
      base = halted ? halted.x : new DOMMatrix(getComputedStyle(sheet).transform).m42
      sheetMotion.y = base
      dragging = true; startY = e.clientY; trail = [{ y: e.clientY, t: e.timeStamp }]
      sheet.classList.add('dragging'); sheet.style.transform = `translateY(${base}px)`
      e.currentTarget.setPointerCapture?.(e.pointerId)
    }
    const move = e => {
      if (!dragging) return
      trail.push({ y: e.clientY, t: e.timeStamp }); if (trail.length > 6) trail.shift()
      const raw = base + e.clientY - startY
      const y = raw < 0 ? rubberband(raw, sheet.offsetHeight) : raw
      sheetMotion.y = y; sheet.style.transform = `translateY(${y}px)`
    }
    const up = () => {
      if (!dragging) return
      dragging = false
      // Velocity from the last ~100 ms, not one noisy sample.
      const recent = trail.filter(p => trail.at(-1).t - p.t < 100)
      const first = recent[0], last = recent.at(-1)
      const velocity = last && first && last.t > first.t ? (last.y - first.y) / (last.t - first.t) * 1000 : 0
      const height = sheet.offsetHeight
      const rest = sheetMotion.y + project(velocity)
      if (rest > Math.min(height * 0.38, 260)) closeSheet(velocity)
      else sheetTo(0, velocity)
    }
    for (const el of [$('grab'), $('pass')]) {
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move)
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
    }
  })()

  // --- Dynamic Island --------------------------------------------------------------
  let islandTimer = 0
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  function island(title, detail, mood = 'ok', look = null) {
    const el = $('island'), ii = el.querySelector('.ii')
    if (mood === 'busy' && look) { ii.style.cssText = `${colors(look)};background:linear-gradient(155deg,var(--c1),var(--c2))`; ii.textContent = look.mono }
    else if (mood === 'warn') { ii.style.cssText = 'background:var(--warn)'; ii.textContent = '!' }
    else { ii.style.cssText = 'background:var(--loaded)'; ii.innerHTML = CHECK }
    el.querySelector('.ispin').hidden = mood !== 'busy'
    el.querySelector('b').textContent = title
    el.querySelector(':scope > div > span').textContent = detail || ''
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show')
    clearTimeout(islandTimer)
    islandTimer = setTimeout(() => el.classList.remove('show'), mood === 'busy' ? 9000 : 3200)
  }

  // --- Talking to Claude -----------------------------------------------------------
  let comments = null
  async function refreshLink() {
    const before = state.canSend
    if (!comments) state.canSend = 'none'
    else { try { state.canSend = await comments.canSendToClaude() } catch { state.canSend = 'off' } }
    if (before !== state.canSend && state.open === 'merge' && !hold) render()
    const link = $('link')
    link.classList.toggle('on', state.canSend === 'available')
    link.querySelector('span').textContent = state.canSend === 'available' ? 'Mit Claude verbunden' : state.canSend === 'unknown' ? 'Verbinde …' : 'Ohne Claude'
    refreshSheet()
  }

  // The current session: the one that wrote the context fill last.
  const currentSession = () => ctx.session || null
  const withSession = (text, id) => id ? `${text}\nSession: ${id}` : text

  async function sendToClaude(text, anchorEl) {
    // The link is checked every 30 s; a session may have started listening since.
    if (comments && !sendAvailable()) await refreshLink()
    if (!comments || !sendAvailable()) { island('Nicht gesendet', sendReason(), 'warn'); return false }
    for (let attempt = 0; ; attempt += 1) {
      try {
        const anchor = await comments.anchorFor(anchorEl)
        await comments.sendToClaude({ anchor, text })
        return true
      } catch (error) {
        if (attempt === 0 && error && error.code === 'claude_unavailable') {
          await new Promise(done => setTimeout(done, 1500))
          await refreshLink()
          if (sendAvailable()) continue
        }
        return sendFailed(error)
      }
    }
  }

  function sendFailed(error) {
    const code = error && error.code
    const why = {
      consent_required: 'Erlaube der Seite einmal, in deinem Namen zu kommentieren.',
      forbidden: 'Kommentieren von der Seite aus ist hier aus.',
      claude_unavailable: 'Gerade hört keine Claude-Session zu.',
      rate_limited: 'Kurz warten, dann noch einmal.',
    }[code] || 'Etwas ist schiefgegangen. Versuch es gleich noch einmal.'
    island('Nicht gesendet', why, 'warn')
    if (code === 'forbidden' || code === 'claude_unavailable') refreshLink()
    return false
  }

  async function loadSkill(name, task, el) {
    // Loaded into the session you are looking at, not into every listening one.
    const sent = await sendToClaude(withSession(`Cockpit · Skill laden\n/${name}${task ? ' ' + task : ''}`, currentSession()), el)
    if (!sent) return false
    const at = Date.now()
    state.pending.set(name, at)
    // Only the named session loads it; if it does not answer, say so instead of spinning on.
    setTimeout(() => {
      if (state.pending.get(name) !== at) return
      state.pending.delete(name)
      island('Keine Antwort', `${short(name)} · die Session hört gerade nicht zu. Öffne sie, dann noch einmal.`, 'warn')
      render()
    }, NO_ANSWER_MS)
    const skill = skillByName(name)
    island('Wird geladen', `${short(name)} · Claude startet ihn`, 'busy', skill ? { ...CAT[skill.category], mono: mono(name) } : null)
    // Let the row finish its check animation before it turns into "Lädt".
    setTimeout(render, 900)
    return true
  }

  async function installRec(id, el) {
    const rec = DATA.recommended.find(r => r.id === id)
    if (installing.has(id)) { island('Wird schon installiert', `${rec.title} · Claude ist dran`, 'busy', { ...CAT.Design, mono: mono(rec.id) }); return false }
    // No Session line: the first session to claim it installs, the others stay quiet.
    const sent = await sendToClaude(`Cockpit · Skill installieren\n${rec.id} von ${rec.author}: ${rec.install}`, el)
    if (!sent) return false
    installing.set(id, Date.now())
    store.set('cockpit.installing', Object.fromEntries(installing))
    island('Wird installiert', `${rec.title} · für alle Sessions`, 'busy', { ...CAT.Design, mono: mono(rec.id) })
    render()
    if (state.sheet?.rec === id) renderSheet()
    return true
  }

  async function requestMerge(el) {
    const d = pr.data
    if (!d || d.state !== 'open' || mergeBusy(d)) return false
    const blockers = mergeBlockers(d)
    if (blockers.length) { island('Gesperrt', blockers[0], 'warn'); return false }
    // Every watching session hears the comment; the Session line names the one that merges.
    const sent = await sendToClaude(`Cockpit · Merge\n${d.repo} #${d.number}: ${d.head} → ${d.base}${d.session ? `\nSession: ${d.session}` : ''}`, el)
    if (!sent) return false
    pr.pending = Date.now()
    setTimeout(render, NO_ANSWER_MS + 500)
    island('Merge angefordert', `#${d.number} → ${d.base} · Claude prüft und merged`, 'busy', { ...MERGE, mono: 'PR' })
    setTimeout(render, 900)
    return true
  }

  async function refreshPr(el) {
    const repo = pr.data?.repo || ctx.repo || ''
    const sent = await sendToClaude(withSession(`Cockpit · PR prüfen\n${repo}`.trim(), pr.data?.session || currentSession()), el)
    if (sent) island('Angefragt', 'Claude trägt den aktuellen Stand ein')
  }

  async function refreshSetup(el) {
    const sent = await sendToClaude(withSession(`Cockpit · Setup prüfen\n${setup.data?.repo || ctx.repo || ''}`.trim(), currentSession()), el)
    if (sent) island('Angefragt', 'Die Mod prüft das Setup neu')
  }

  async function copyCommand(name, task) {
    const text = `/${name}${task ? ' ' + task : ''}`
    try { await navigator.clipboard.writeText(text); island('Befehl kopiert', 'Im Chat einfügen und senden') }
    catch { island('Kopieren ging nicht', text, 'warn') }
  }

  // --- Hold to load ----------------------------------------------------------------
  let hold = null, swallowClick = false
  document.documentElement.style.setProperty('--hold', `${HOLD_MS}ms`)
  document.documentElement.style.setProperty('--hold-delay', `${HOLD_DELAY}ms`)
  document.documentElement.style.setProperty('--hold-draw', `${HOLD_MS - HOLD_DELAY}ms`)
  document.documentElement.style.setProperty('--hold-merge', `${MERGE_HOLD_MS}ms`)
  function cancelHold() {
    if (!hold) return
    clearTimeout(hold.timer)
    hold.el.classList.remove('holding')
    hold = null
  }
  document.addEventListener('pointerdown', e => {
    swallowClick = false
    const el = e.target.closest('[data-hold]')
    if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return
    cancelHold()
    hold = { el, x: e.clientX, y: e.clientY, timer: 0 }
    el.classList.add('holding')
    hold.timer = setTimeout(async () => {
      const target = hold && hold.el
      if (!target) return
      hold = null
      swallowClick = true
      target.classList.remove('holding')
      target.classList.add('fired')
      setTimeout(() => target.classList.remove('fired'), 1500)
      navigator.vibrate?.([8, 40, 14])
      const key = target.dataset.hold
      if (key.startsWith('merge:')) await requestMerge(target)
      else if (key.startsWith('rec:')) await installRec(key.slice(4), target)
      else if (loadedSet().has(key)) island('Schon geladen', `${short(key)} läuft in dieser Session`)
      else await loadSkill(key, '', target)
    }, el.dataset.hold.startsWith('merge:') ? MERGE_HOLD_MS : HOLD_MS)
  })
  document.addEventListener('pointermove', e => {
    if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10) cancelHold()
  }, { passive: true })
  document.addEventListener('pointerup', cancelHold)
  document.addEventListener('pointercancel', cancelHold)
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault() })

  // --- Events ----------------------------------------------------------------------
  document.addEventListener('click', async e => {
    if (swallowClick) { swallowClick = false; e.preventDefault(); return }
    const t = e.target.closest('button, .scrim')
    if (!t) return
    if (t.id === 'scrim' || t.hasAttribute('data-close')) return closeSheet()
    if (t.id === 'done') return state.open ? openCard(state.open) : enterLevel('top')
    if (t.id === 'clear') { $('q').value = ''; state.query = ''; renderResults(); $('q').focus(); return }
    if (t.hasAttribute('data-context')) return openSheet({ context: true })
    if (t.dataset.card === 'skills') {
      // By where the stack is heading, so a second tap mid-switch turns it back.
      if (levelTarget !== 'skills') return enterLevel('skills')
      return state.open ? openCard(state.open) : enterLevel('top')
    }
    if (t.dataset.card) return openCard(t.dataset.card)
    if (t.dataset.try) { $('q').value = t.dataset.try; state.query = t.dataset.try; renderResults(); return }
    if (t.dataset.skill) return openSheet({ skill: t.dataset.skill })
    if (t.dataset.rec) return openSheet({ rec: t.dataset.rec })
    if (t.dataset.fav) {
      const name = t.dataset.fav
      state.favorites.has(name) ? state.favorites.delete(name) : state.favorites.add(name)
      store.set('cockpit.favorites', [...state.favorites])
      render(); return
    }
    if (t.dataset.compose) return openComposer(t.dataset.compose)
    if (t.hasAttribute('data-cancel') || t.id === 'cscrim') return closeComposer()
    if (t.hasAttribute('data-send')) {
      const task = $('task').value.trim()
      if (!task || !composing) return
      t.disabled = true
      const sent = await composing.send(task, $('go') || t)
      t.disabled = false
      if (sent) closeComposer(true)
      return
    }
    if (t.dataset.copy) return copyCommand(t.dataset.copy, '')
    if (t.hasAttribute('data-pr-refresh')) return refreshPr(t)
    if (t.hasAttribute('data-setup-refresh')) return refreshSetup(t)
    if (t.hasAttribute('data-team-new')) {
      return openWriter({ title: 'Team', look: TEAM, mono: 'T', button: 'Verteilen', placeholder: 'Welche Aufgabe soll das Team erledigen?',
        foot: 'Claude zerlegt sie und startet eigene Chats.',
        send: async (text, el) => {
          const sent = await sendToClaude(withSession(`Cockpit · Team\n${text}`, currentSession()), el)
          if (sent) island('Team wird gebildet', 'Claude zerlegt die Aufgabe', 'busy', { ...TEAM, mono: 'T' })
          return sent
        } })
    }
    if (t.dataset.answer) {
      const m = team.members.find(x => x.id === t.dataset.answer)
      if (!m) return
      return openWriter({ title: m.name, look: memberColors(m), mono: initials(m.name), button: 'Antworten', placeholder: m.question || 'Deine Antwort',
        foot: 'Claude gibt die Antwort an den Chat weiter.',
        send: async (text, el) => {
          const sent = await sendToClaude(withSession(`Cockpit · Antwort\n${m.id}\n${text}`, team.lead), el)
          if (sent) island('Antwort gesendet', `${m.name} macht weiter`)
          return sent
        } })
    }
    if (t.dataset.member) return openSheet({ member: t.dataset.member })
    if (t.dataset.hold?.startsWith('merge:')) return island('Gedrückt halten', 'Erst nach 1,2 s Halten wird gemergt', 'warn')
    if (t.dataset.start) {
      t.disabled = true
      await loadSkill(t.dataset.start, '', t)
      t.disabled = !sendAvailable()
      return
    }
    if (t.dataset.install) {
      t.disabled = true
      await installRec(t.dataset.install, t)
      t.disabled = !sendAvailable()
    }
  })
  $('q').addEventListener('input', e => { state.query = e.target.value; renderResults() })
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return
    if (composing) closeComposer(); else if (state.sheet) closeSheet()
  })
  $('task').addEventListener('input', e => {
    const n = e.target.value.length
    $('c-count').textContent = `${n}/3000`
    $('c-send').disabled = !e.target.value.trim() || !sendAvailable()
  })
  // The scrim is a div: clicks on it close the composer too.
  $('cscrim').addEventListener('click', () => closeComposer())
  window.addEventListener('resize', () => layout(false))
  setInterval(() => { if (state.loaded.length) render() }, 60000)

  buildWallet()
  render()

  setInterval(() => { if (state.sheet?.context && ctx.at) $('ctx-at').textContent = agoSec(ctx.at) }, 5000)

  // --- Live status from the session (written by Claude) ----------------------------
  ;(async () => {
    const db = await use('db')
    if (!db) { ctx.error = 'none'; renderContext(); return }
    db.doc('cockpit/context').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null
      if (!d || typeof d.used !== 'number' || typeof d.max !== 'number' || d.max <= 0) { ctx.error = 'no_data'; renderContext(); return }
      ctx.used = d.used
      ctx.max = d.max
      ctx.threshold = typeof d.threshold === 'number' ? d.threshold : null
      ctx.cost = typeof d.costUsd === 'number' ? d.costUsd : null
      const limits = Array.isArray(d.limits) ? d.limits.filter(l => l && typeof l.percentUsed === 'number') : []
      ctx.limit = limits.find(l => l.kind === 'five_hour') || limits[0] || null
      ctx.repo = typeof d.repo === 'string' ? d.repo : null
      ctx.session = typeof d.sessionId === 'string' ? d.sessionId : null
      ctx.at = typeof d.at === 'number' ? d.at : 0
      ctx.error = null
      renderContext()
    }, () => { ctx.error = 'no_data'; renderContext() })
    db.doc('cockpit/pr').onSnapshot(snap => {
      const before = pr.data
      const d = snap.exists ? cleanPr(snap.data()) : null
      pr.data = d
      pr.error = null
      if (d && pr.pending) {
        const answered = d.state !== 'open' || (d.merge && d.merge.at >= pr.pending - 60000 && d.merge.state !== 'running')
        if (answered || Date.now() - pr.pending > MERGE_PENDING_MS) pr.pending = 0
      }
      if (before && d && before.number === d.number) {
        if (before.state === 'open' && d.state === 'merged') {
          pr.playedAt = Date.now()
          // Watched live in the open card: seen. Otherwise the card front lights up and waits to be opened.
          if (state.open === 'merge') markSeen()
          else {
            pr.flashAt = Date.now()
            const el = cardEl({ id: 'merge' })
            el?.classList.remove('flash'); void el?.offsetWidth; el?.classList.add('flash')
            setTimeout(() => el?.classList.remove('flash'), 1600)
          }
          navigator.vibrate?.([10, 60, 18])
          island('Gemergt', `#${d.number} ist in ${d.base}${d.merge?.branchDeleted ? ', Branch gelöscht' : ''}`)
        } else if (d.merge?.state === 'failed' && before.merge?.at !== d.merge.at) {
          island('Merge abgebrochen', d.merge.message || `#${d.number} wurde nicht gemergt`, 'warn')
        }
      }
      if (before && d && before.number !== d.number) pr.lingering = false
      render()
    }, () => { pr.error = 'no_data'; render() })
    db.doc('cockpit/team').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null
      team.goal = d && typeof d.goal === 'string' ? { goal: d.goal, startedAt: typeof d.startedAt === 'number' ? d.startedAt : 0 } : null
      team.lead = d && d.lead && typeof d.lead.sessionId === 'string' ? d.lead.sessionId : null
      render()
    }, () => { team.error = 'no_data'; render() })
    // A view without collections still gets everything else below.
    if (typeof db.collection === 'function') db.collection('cockpit/team/members').onSnapshot(snap => {
      const before = new Map(team.members.map(m => [m.id, m]))
      team.members = snap.docs.map(doc => cleanMember(doc.id, doc.data())).filter(Boolean)
      team.error = null
      // Pop up only when a chat newly asks you something or hits a conflict.
      for (const m of team.members) {
        const key = `${m.id}:${m.state}:${m.updatedAt}`
        if (needsYou(m) && !team.seen.has(key) && before.get(m.id)?.state !== m.state) {
          if (before.size) { island(m.state === 'question' ? `Frage von ${m.name}` : `Konflikt bei ${m.name}`, m.question || m.note, 'warn'); navigator.vibrate?.([12, 50, 12]) }
        }
        team.seen.add(key)
        const old = before.get(m.id)
        if (old && old.state !== 'done' && m.state === 'done') island(`${m.name} ist fertig`, m.note || m.task)
      }
      render()
    }, () => { team.error = 'no_data'; render() })
    db.doc('cockpit/skills').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null
      const list = Array.isArray(d?.installed) ? d.installed.filter(i => i && typeof i.id === 'string') : []
      const fresh = list.filter(i => installing.has(i.id))
      applyInstalled(list)
      if (fresh.length) island('Installiert', `${fresh.map(i => i.id).join(', ')} · jetzt unter Design`)
      render()
      if (state.sheet) renderSheet()
    }, () => {})
    db.doc('cockpit/setup').onSnapshot(snap => {
      setup.data = snap.exists ? cleanSetup(snap.data()) : null
      setup.error = null
      render()
    }, () => { setup.error = 'no_data'; render() })
    db.doc('cockpit/status').onSnapshot(snap => {
      const data = snap.exists ? snap.data() : null
      const loaded = Array.isArray(data?.loaded) ? data.loaded.filter(u => u && typeof u.skill === 'string' && typeof u.at === 'number') : []
      const before = loadedSet()
      state.loaded = loaded.slice(-200)
      for (const [name, at] of state.pending) {
        if (state.loaded.some(u => u.skill === name && u.at >= at - 60000)) state.pending.delete(name)
      }
      const fresh = state.loaded.filter(u => !before.has(u.skill))
      if (before.size && fresh.length) island('Geladen', fresh.map(u => short(u.skill)).join(', '))
      render()
    }, () => {})
  })()
  ;(async () => {
    comments = await use('comments')
    await refreshLink()
    setInterval(refreshLink, 30000)
  })()
})()
</script>
