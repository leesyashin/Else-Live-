<title>Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: search and suggestions on top, the skill areas below as a Wallet stack; an opened card shows its skills as hold-to-load cards. */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #e9e9ee;
  --fg: #1c1c1e;
  --fg2: #6c6c70;
  --fg3: #aeaeb2;
  --sep: rgba(60, 60, 67, 0.14);
  --fill: rgba(118, 118, 128, 0.12);
  --accent: #007aff;
  --loaded: #34c759;
  --warn: #ff9500;
  --scrim: rgba(0, 0, 0, 0.32);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 14px 32px -14px rgba(0, 0, 0, 0.38);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --bounce: cubic-bezier(0.34, 1.36, 0.64, 1);
  --card-h: 214px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
    --sep: rgba(84, 84, 88, 0.5); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --loaded: #30d158; --warn: #ff9f0a;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 34px -14px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
  --sep: rgba(84, 84, 88, 0.5); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --loaded: #30d158; --warn: #ff9f0a;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 34px -14px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--fg); font: 17px/1.35 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 56px;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 10px; }
[data-hold] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; }
.top h1 { font: 700 34px/1.1 var(--display); letter-spacing: 0.01em; margin: 0; }
.top p { margin: 4px 0 0; color: var(--fg2); font-size: 15px; }
.link-state { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.link-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
.link-state.on i { background: var(--loaded); }

/* Context ring */
.ctx-chip { flex: none; display: flex; align-items: center; gap: 9px; padding: 6px 13px 6px 7px; border-radius: 999px; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); transition: transform 0.3s var(--bounce); }
.ctx-chip:active { transform: scale(0.94); }
.ctx-chip svg { width: 34px; height: 34px; }
.ctx-chip b { display: block; font: 700 16px/1.05 var(--rounded); font-variant-numeric: tabular-nums; }
.ctx-chip small { display: block; font-size: 11px; color: var(--fg2); }
.trk { fill: none; stroke: var(--fill); }
.arc { fill: none; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; transition: stroke-dashoffset 0.9s var(--spring), stroke 0.6s; }
.arc.draw { animation: ringIn 1.3s var(--spring) both; }
@keyframes ringIn { from { stroke-dashoffset: var(--len); } }
.ring40 { position: relative; }
.ring40 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring40 svg .trk { stroke: rgba(255, 255, 255, 0.18); }
.ring40 em { position: relative; font: 700 11px/1 var(--rounded); font-style: normal; }
.ring-card { align-items: center; padding: 22px 16px 18px; }
.ring-wrap { position: relative; width: 240px; max-width: 100%; aspect-ratio: 1; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ring-center b { font: 700 52px/1 var(--rounded); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 14px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.tick { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
.legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--fg2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--ca), var(--cb)); transition: width 0.9s var(--spring); }
.ctx-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); transition: transform 0.3s var(--spring); }
.ctx-row:active { transform: scale(0.98); }
.ctx-row svg { flex: none; width: 34px; height: 34px; }
.ctx-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ctx-row b { font-weight: 600; }
.ctx-row small { font-size: 13px; color: var(--fg2); }


/* Search (Spotlight) */
.search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.search svg { flex: none; width: 19px; height: 19px; color: var(--fg2); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: var(--fg); }
.search input::placeholder { color: var(--fg2); }
.search input::-webkit-search-cancel-button { display: none; }
.clear[hidden] { display: none; }
.clear { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--fg3); color: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

.label { margin: 0 4px; font: 600 13px/1.2 var(--font); letter-spacing: 0.03em; color: var(--fg2); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.suggest { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; transition: transform 0.3s var(--bounce); }
.app:active { transform: scale(0.92); }
.app span:last-child { max-width: 100%; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.icon { position: relative; width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 2px 6px -2px rgba(0, 0, 0, 0.3); }
.icon svg { width: 28px; height: 28px; }
.icon .live { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--loaded); border: 2.5px solid var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 19px; background: var(--surface); font-size: 15px; transition: transform 0.25s var(--spring); }
.chip:active { transform: scale(0.95); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); }

/* Wallet */
.wallet { position: relative; isolation: isolate; transition: height 0.6s var(--spring); }
.wcard {
  position: absolute; left: 0; right: 0; top: 0; height: var(--card-h); border-radius: 18px; overflow: hidden; color: #fff;
  background: radial-gradient(130% 100% at 100% 0%, var(--g, transparent) 0%, transparent 58%), radial-gradient(90% 80% at 0% 100%, rgba(0, 0, 0, 0.16), transparent 62%), linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: var(--shadow), inset 0 0.5px 0 rgba(255, 255, 255, 0.35), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
  transition: transform 0.62s var(--spring), box-shadow 0.4s, opacity 0.3s; will-change: transform;
  display: flex; flex-direction: column; justify-content: space-between; padding: 15px 20px 18px; width: 100%;
}
.wcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.04) 34%, rgba(255, 255, 255, 0) 52%); pointer-events: none; }
.wcard::after { content: ""; position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wcard > * { position: relative; z-index: 1; }
.pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: transform 1s var(--spring); }
.wcard > .pattern, .pass > .pattern, .best > .pattern { position: absolute; z-index: 0; }
.wcard[aria-expanded="true"] > .pattern { transform: translate3d(-10px, 6px, 0) scale(1.05); }
.pattern.fade-r { -webkit-mask-image: linear-gradient(100deg, transparent 18%, #000 78%); mask-image: linear-gradient(100deg, transparent 18%, #000 78%); }
.pattern.fade-b { -webkit-mask-image: linear-gradient(180deg, transparent 10%, #000 85%); mask-image: linear-gradient(180deg, transparent 10%, #000 85%); }
.wcard:active { transition-duration: 0.18s; }
.wcard.ticket { color: #1c1c1e; }
.wcard.ticket::before { background: linear-gradient(118deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 45%); }
.wcard.ticket .notch { position: absolute; top: 132px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); z-index: 2; }
.wcard.ticket .notch.l { left: -11px; } .wcard.ticket .notch.r { right: -11px; }
.wcard.ticket .perf { position: absolute; left: 18px; right: 18px; top: 142px; border-top: 1.5px dashed rgba(28, 28, 30, 0.22); z-index: 1; }
.wtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 30px; }
.wtop small, .wbottom small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; opacity: 0.72; text-transform: uppercase; }
.wtop b { display: block; font: 600 21px/1.15 var(--display); letter-spacing: 0.005em; }
.wcount { text-align: right; }
.wcount b { font: 600 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.wbottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; }
.wbottom p { margin: 2px 0 0; font-size: 14px; opacity: 0.92; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.glyph { flex: none; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); display: grid; place-items: center; box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.25); }
.ticket .glyph { background: rgba(28, 28, 30, 0.07); box-shadow: inset 0 0 0 0.5px rgba(28, 28, 30, 0.12); }
.glyph svg { width: 20px; height: 20px; }
.pulse { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--loaded); }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--loaded); animation: breathe 1.8s var(--spring) infinite; }
@keyframes breathe { from { transform: scale(1); opacity: 0.85; } to { transform: scale(2.6); opacity: 0; } }

.detail { position: absolute; left: 0; right: 0; z-index: 30; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity 0.35s, transform 0.55s var(--spring); display: flex; flex-direction: column; gap: 10px; }
.detail.show { opacity: 1; transform: none; pointer-events: auto; transition-delay: 0.12s; }
.hint { margin: 0 4px; font-size: 13px; color: var(--fg2); }

/* Skill rows: grouped like Wallet's transactions; hold to load */
.glist { background: var(--surface); border-radius: 16px; overflow: hidden; }
.srow {
  position: relative; width: 100%; min-height: 68px; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 12px;
  transition: background-color 0.25s, transform 0.45s var(--spring);
  animation: rowIn 0.55s var(--spring) both; animation-delay: calc(var(--i, 0) * 32ms + 100ms);
}
@keyframes rowIn { from { opacity: 0; transform: translateY(14px); } }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 0.5px solid var(--sep); }
.srow:active { background: var(--surface-2); }
.srow.holding { background: color-mix(in srgb, var(--c1) 14%, var(--surface)); transform: scale(0.985); transition: background-color var(--hold-draw) linear var(--hold-delay), transform 0.3s var(--spring); }
.srow.fired { background: color-mix(in srgb, var(--loaded) 13%, var(--surface)); transition: background-color 1.4s 0.6s; }
.sicon { position: relative; flex: none; width: 46px; height: 46px; }
.sicon.big { width: 60px; height: 60px; }
.tile {
  position: absolute; inset: 0; border-radius: 13px; display: grid; place-items: center; color: #fff; font: 700 15px/1 var(--rounded); letter-spacing: 0.03em;
  background: radial-gradient(120% 100% at 100% 0%, var(--g, transparent), transparent 62%), linear-gradient(155deg, var(--c1), var(--c2));
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 2px 6px -3px rgba(0, 0, 0, 0.35);
  transition: transform 0.55s var(--bounce);
}
.sicon.big .tile { border-radius: 15px; }
.tile svg { width: 26px; height: 26px; }
.tile.hollow { background: transparent; color: var(--c1); box-shadow: inset 0 0 0 1.5px var(--c1); }
.tile .mono { display: grid; place-items: center; transition: opacity 0.2s, transform 0.35s var(--spring); }
.tile .ok { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
.tile .ok svg { width: 24px; height: 24px; }
.tile .ok path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.sicon .live { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--loaded); border: 2.5px solid var(--surface); z-index: 2; }
.sicon.big .live { width: 16px; height: 16px; border-color: var(--bg); }
.ripple { position: absolute; inset: 0; border-radius: 16px; background: var(--loaded); opacity: 0; pointer-events: none; }
.hring { position: absolute; left: 50%; top: 50%; width: var(--rs); height: var(--rs); margin: calc(var(--rs) / -2) 0 0 calc(var(--rs) / -2); overflow: visible; pointer-events: none; z-index: 1; }
.hring rect { fill: none; stroke: var(--c1); stroke-width: 3; stroke-linecap: round; stroke-dasharray: var(--per) var(--per); stroke-dashoffset: var(--per); opacity: 0; transition: stroke-dashoffset 0.25s var(--spring), opacity 0.2s; }
.holding .hring rect { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold-draw) cubic-bezier(0.45, 0, 0.55, 1) var(--hold-delay), opacity 0.12s var(--hold-delay); }
.holding .tile { transform: scale(0.86); transition: transform var(--hold-draw) var(--spring) var(--hold-delay); }
.holding .trail { opacity: 0.3; transition: opacity 0.2s var(--hold-delay); }
.fired .hring rect { opacity: 1; stroke-dashoffset: 0; stroke: var(--loaded); transition: stroke 0.15s; }
.fired .hring { animation: ringOut 0.7s 0.3s var(--spring) forwards; }
.fired .tile { background: linear-gradient(155deg, #4cd964, #1f9d45); animation: tilePop 0.62s var(--bounce); }
.fired .tile .mono { opacity: 0; transform: scale(0.4); }
.fired .tile .ok { opacity: 1; }
.fired .tile .ok path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.35s 0.08s var(--spring); }
.fired .ripple { animation: ripple 0.9s var(--spring); }
@keyframes ringOut { to { opacity: 0; transform: scale(1.35); } }
@keyframes tilePop { 0% { transform: scale(0.86); } 50% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes ripple { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 0; transform: scale(2.8); } }
.stext { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stext b { font-weight: 600; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stext span { font-size: 14px; color: var(--fg2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trail { position: relative; flex: none; display: flex; align-items: center; gap: 8px; color: var(--fg3); }
.trail .chev { width: 8px; height: 13px; }
.trail .star { color: var(--warn); font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.tag.loaded { color: var(--loaded); background: color-mix(in srgb, var(--loaded) 15%, transparent); }
.tag.new { color: var(--c1); background: color-mix(in srgb, var(--c1) 14%, transparent); }
.time { font-size: 14px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.spin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 90deg, transparent 0 20%, var(--accent));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.6px), #000 calc(100% - 2.2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.6px), #000 calc(100% - 2.2px));
  animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(1turn); } }
.app.holding .tile { transform: scale(0.84); }
.dhead { display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.tip { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg2); background: var(--surface); padding: 7px 13px 7px 11px; border-radius: 999px; }
.tip .press { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--fg2); }
.tip .press::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--fg2); animation: pressHint 2.4s var(--spring) infinite; }
@keyframes pressHint { 0%, 15% { transform: scale(0.5); opacity: 0; } 35% { opacity: 1; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
.gtitle { margin: 8px 4px 0; font: 600 13px/1.2 var(--font); letter-spacing: 0.03em; color: var(--fg2); text-transform: uppercase; display: flex; justify-content: space-between; }

/* Results */
.best { position: relative; overflow: hidden; border-radius: 18px; color: #fff; background: radial-gradient(130% 100% at 100% 0%, var(--g, transparent) 0%, transparent 58%), radial-gradient(90% 80% at 0% 100%, rgba(0, 0, 0, 0.16), transparent 62%), linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; transition: transform 0.35s var(--spring); }
.best::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 50%); pointer-events: none; }
.best > * { position: relative; }
.best .fill { position: absolute; inset: 0; background: #fff; opacity: 0.14; transform: scaleX(0); transform-origin: left; pointer-events: none; }
.best.holding { transform: scale(0.98); }
.best.holding .fill { transform: scaleX(1); transition: transform var(--hold, 650ms) linear; }
.best.fired { animation: fired 0.6s var(--bounce); }
.best h3 { margin: 0; font: 700 26px/1.1 var(--display); overflow-wrap: anywhere; }
.best p { margin: 0; font-size: 15.5px; line-height: 1.4; opacity: 0.94; }
.best small { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; opacity: 0.75; text-transform: uppercase; }
.best .hold-hint { font-size: 13px; opacity: 0.8; }
.list { display: flex; flex-direction: column; gap: 8px; }
.empty { padding: 18px; border-radius: 16px; background: var(--surface); color: var(--fg2); font-size: 15px; text-align: center; }

/* Merge: the branch's PR as a preview, hold to squash-merge */
.wtarget { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.wtarget b { font: 700 30px/1.05 var(--display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wtarget span { font-size: 15px; opacity: 0.7; }
.wbottom small.mstat, .mstat { display: inline-flex; align-items: center; gap: 6px; }
.mstat i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.preview { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; animation: rowIn 0.55s var(--spring) both; animation-delay: 0.1s; }
.preview h3 { margin: 0; font: 600 18px/1.3 var(--display); overflow-wrap: anywhere; }
.preview .num { color: var(--fg2); font-weight: 500; }
.route { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.route small { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const svg = (paths, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`
  const colors = o => `--c1:${o.c1};--c2:${o.c2};--g:${o.g || 'transparent'}`

  // Clean line patterns, one per area, drawn over the card's colour.
  let patternId = 0
  function pattern(kind) {
    const id = `pt${++patternId}`
    const ink = kind === 'guilloche' ? 'rgba(28, 28, 30, 0.13)' : 'rgba(255, 255, 255, 0.2)'
    let defs = '', body = '', fade = ''
    if (kind === 'waves') {
      for (let i = 0; i < 13; i++) {
        const y = 40 + i * 13
        body += `<path d="M-30 ${y + 80} C 80 ${y - 40}, 220 ${y + 130}, 430 ${y - 20}"/>`
      }
    } else if (kind === 'dots') {
      defs = `<pattern id="${id}" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.25" fill="rgba(255,255,255,.34)" stroke="none"/></pattern>`
      body = `<rect width="400" height="250" fill="url(#${id})" stroke="none"/>`
      fade = 'fade-r'
    } else if (kind === 'bars') {
      for (let i = 0; i < 30; i++) {
        const x = 160 + i * 8
        const h = 14 + 70 * (0.5 + 0.5 * Math.sin(i * 0.5 + 0.6)) * (0.45 + i / 45)
        body += `<line x1="${x}" y1="236" x2="${x}" y2="${(236 - h).toFixed(1)}" stroke-width="2.2" stroke-linecap="round"/>`
      }
      fade = 'fade-r'
    } else if (kind === 'stripes') {
      for (let i = 0; i < 46; i++) body += `<line x1="${i * 11}" y1="-10" x2="${i * 11 - 260}" y2="260"/>`
      fade = 'fade-r'
    } else if (kind === 'rings') {
      for (let i = 1; i <= 11; i++) body += `<circle cx="352" cy="28" r="${i * 22}"/>`
    } else if (kind === 'grid') {
      for (let x = 0; x <= 400; x += 20) body += `<line x1="${x}" y1="0" x2="${x}" y2="250"/>`
      for (let y = 0; y <= 250; y += 20) body += `<line x1="0" y1="${y}" x2="400" y2="${y}"/>`
      fade = 'fade-b'
    } else if (kind === 'radar') {
      for (let i = 1; i <= 9; i++) body += `<circle cx="372" cy="232" r="${i * 26}" stroke="rgba(48, 209, 88, ${(0.42 - i * 0.035).toFixed(2)})"/>`
    } else if (kind === 'branches') {
      // Side branches curving into one main line, like a merge graph.
      body += `<line x1="-10" y1="196" x2="410" y2="196" stroke="rgba(163, 92, 247, 0.55)" stroke-width="2.5"/>`
      for (let i = 0; i < 9; i++) {
        const x = 120 + i * 30, y = 36 + i * 9
        body += `<path d="M${x - 140} ${y} C ${x - 40} ${y}, ${x} 196, ${x + 70} 196"/>`
      }
      fade = 'fade-r'
    } else if (kind === 'pins') {
      // Rows of status pins, a few lit green.
      for (let y = 22; y < 250; y += 22) {
        for (let x = 150; x < 410; x += 22) {
          const lit = (x * 7 + y * 3) % 5 === 0
          body += `<circle cx="${x}" cy="${y}" r="${lit ? 3.2 : 2.2}" fill="${lit ? 'rgba(48, 209, 88, 0.55)' : 'rgba(255, 255, 255, 0.16)'}" stroke="none"/>`
        }
      }
      fade = 'fade-r'
    } else if (kind === 'guilloche') {
      for (let i = 0; i < 18; i++) body += `<ellipse cx="318" cy="70" rx="74" ry="24" transform="rotate(${i * 10} 318 70)"/>`
      for (let i = 0; i < 18; i++) body += `<ellipse cx="318" cy="70" rx="44" ry="15" transform="rotate(${i * 10 + 5} 318 70)"/>`
    }
    return `<svg class="pattern ${fade}" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs><g fill="none" stroke="${ink}" stroke-width="1">${body}</g></svg>`
  }
  const short = name => name.split(':').pop()

  // --- Context: the Cockpit mod writes the session's fill into this page's database ---
  const ctx = { used: null, max: null, threshold: null, cost: null, limit: null, repo: null, at: 0, error: null }
  const ctxShare = () => (ctx.used != null && ctx.max ? Math.min(1, ctx.used / ctx.max) : null)
  const ctxMark = () => (ctx.threshold && ctx.max ? ctx.threshold / ctx.max : 0.8)
  function ctxLook(p) {
    const th = ctxMark()
    if (p == null) return { a: '#8e8e93', b: '#8e8e93', word: 'Wird geladen …' }
    if (p < 0.5) return { a: '#30d158', b: '#a6e86a', word: 'Viel Platz' }
    if (p < th - 0.08) return { a: '#ffd60a', b: '#ff9f0a', word: 'Füllt sich' }
    if (p < th) return { a: '#ff9f0a', b: '#ff453a', word: 'Bald Zusammenfassung' }
    return { a: '#ff453a', b: '#ff2d55', word: 'Wird zusammengefasst' }
  }
  const pct = p => (p == null ? '–' : `${Math.round(p * 100)} %`)
  function tokens(n) {
    if (n == null) return '–'
    if (n >= 1e6) return `${(n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 })} Mio`
    if (n >= 1e3) return `${Math.round(n / 1e3)}k`
    return String(n)
  }
  function ctxError() {
    return {
      none: 'Diese Ansicht kann die Daten der Seite nicht lesen.',
      no_data: 'Noch keine Werte. Die Cockpit-Mod schickt den Füllstand nach jedem Schritt von Claude.',
    }[ctx.error] || 'Der Kontext ist gerade nicht lesbar.'
  }
  // A ring arc of radius r at share p, as a style for an .arc circle.
  function arcStyle(r, p) {
    const len = 2 * Math.PI * r
    return `--len:${len.toFixed(1)};stroke-dasharray:${len.toFixed(1)} ${len.toFixed(1)};stroke-dashoffset:${(len * (1 - (p ?? 0))).toFixed(1)}`
  }
  function miniRing(size, r, width, p, look) {
    const c = size / 2
    return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${c}" cy="${c}" r="${r}" stroke-width="${width}"/><circle class="arc" cx="${c}" cy="${c}" r="${r}" stroke-width="${width}" style="${arcStyle(r, p)};stroke:${look.a}"/></svg>`
  }

  // --- Merge: Claude writes the branch's PR into cockpit/pr after each push or PR event ---
  const pr = { data: null, error: null, pending: 0, playedAt: 0 }
  const MERGE_PENDING_MS = 10 * 60000
  function cleanPr(d) {
    if (!d || typeof d.number !== 'number' || typeof d.base !== 'string' || typeof d.head !== 'string') return null
    const str = v => (typeof v === 'string' ? v : '')
    const num = v => (typeof v === 'number' && isFinite(v) ? v : null)
    const m = d.merge && typeof d.merge === 'object' ? d.merge : null
    return {
      repo: str(d.repo), number: d.number, title: str(d.title), url: /^https:\/\/github\.com\//.test(d.url) ? d.url : '',
      head: d.head, base: d.base, draft: d.draft === true,
      state: ['open', 'merged', 'closed'].includes(d.state) ? d.state : 'open',
      ci: ['success', 'failure', 'pending', 'none'].includes(d.ci) ? d.ci : 'pending',
      checks: Array.isArray(d.checks) ? d.checks.filter(c => c && typeof c.name === 'string').slice(0, 12) : [],
      mergeable: typeof d.mergeable === 'boolean' ? d.mergeable : null,
      files: num(d.files), additions: num(d.additions), deletions: num(d.deletions),
      updatedAt: num(d.updatedAt) || 0,
      merge: m && ['running', 'done', 'failed'].includes(m.state)
        ? { state: m.state, at: num(m.at) || 0, sha: str(m.sha), branchDeleted: m.branchDeleted === true, message: str(m.message) }
        : null,
    }
  }
  const CHECK_DOT = { success: '#30d158', failure: '#ff453a', pending: '#ffd60a', skipped: '#8e8e93', none: '#8e8e93' }
  function mergeBlockers(d) {
    const out = []
    if (d.ci === 'failure') out.push('CI ist rot. Erst wenn alle Checks grün sind, lässt sich mergen.')
    if (d.ci === 'pending') out.push('CI läuft noch. Sobald alles grün ist, wird der Knopf frei.')
    if (d.mergeable === false) out.push(`Konflikte mit ${d.base}. Claude muss sie erst lösen.`)
    if (d.mergeable === null) out.push('GitHub prüft noch, ob es Konflikte gibt.')
    return out
  }
  const mergeBusy = d => d.state === 'open' && ((pr.pending > 0 && Date.now() - pr.pending < MERGE_PENDING_MS) || d.merge?.state === 'running')
  function mergeStatus(d) {
    if (d.state === 'merged') return { dot: '#a35cf7', short: 'Gemergt' }
    if (d.state === 'closed') return { dot: '#8e8e93', short: 'Geschlossen' }
    if (mergeBusy(d)) return { dot: '#64d2ff', short: 'Wird gemergt …' }
    if (d.merge?.state === 'failed') return { dot: '#ff453a', short: 'Merge abgebrochen' }
    if (d.ci === 'failure') return { dot: '#ff453a', short: 'CI rot' }
    if (d.mergeable === false) return { dot: '#ff453a', short: 'Konflikte' }
    if (d.ci === 'pending') return { dot: '#ffd60a', short: 'CI läuft' }
    if (d.mergeable === null) return { dot: '#ffd60a', short: 'Wird geprüft' }
    return { dot: '#30d158', short: d.ci === 'none' ? 'Bereit · ohne Checks' : 'Bereit zum Mergen' }
  }
  const ciWord = d => ({ success: 'Alle Checks grün', failure: 'Rot', pending: 'Läuft', none: 'Keine Checks eingerichtet' })[d.ci]
  const shortSha = sha => (sha ? sha.slice(0, 7) : '')

  // --- Setup: the Cockpit mod checks the repo against its memory file and writes cockpit/setup ---
  const setup = { data: null, error: null }
  const GROUPS = ['Memory', 'Connectors', 'Skills', 'Branch']
  function cleanSetup(d) {
    if (!d || !Array.isArray(d.checks)) return null
    const str = v => (typeof v === 'string' ? v : '')
    return {
      repo: str(d.repo) || null, branch: str(d.branch) || null, memory: str(d.memory) || null,
      checks: d.checks.filter(c => c && GROUPS.includes(c.group) && ['ok', 'warn', 'fail'].includes(c.state))
        .map(c => ({ group: c.group, name: str(c.name), state: c.state, detail: str(c.detail) })).slice(0, 40),
      checklist: Array.isArray(d.checklist) ? d.checklist.filter(i => i && typeof i.text === 'string').map(i => ({ text: i.text, done: i.done === true })).slice(0, 30) : [],
      merges: Array.isArray(d.merges) ? d.merges.filter(m => typeof m === 'string').slice(0, 5) : [],
      at: typeof d.at === 'number' ? d.at : 0,
    }
  }
  const RANK = { ok: 0, warn: 1, fail: 2 }
  function groupState(d, group) {
    const mine = d.checks.filter(c => c.group === group)
    return mine.length ? mine.reduce((a, b) => (RANK[b.state] > RANK[a.state] ? b : a)).state : null
  }

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v) } catch { return fallback } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)) } catch {} },
  }
  const use = name => (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use(name).catch(() => null)
    : Promise.resolve(null)

  const state = {
    query: '',
    open: null,
    favorites: new Set(store.get('cockpit.favorites', [])),
    loaded: [],
    pending: new Map(),
    canSend: 'unknown',
    sheet: null,
  }
  const installed = new Set(DATA.skills.map(s => s.short))
  const recommended = DATA.recommended.filter(r => !installed.has(r.id))
  const loadedSet = () => new Set(state.loaded.map(u => u.skill))
  const skillByName = name => DATA.skills.find(s => s.name === name)

  function ago(at) {
    const minutes = Math.floor((Date.now() - at) / 60000)
    if (minutes < 1) return 'gerade eben'
    if (minutes < 60) return `vor ${minutes} Min`
    const hours = Math.floor(minutes / 60)
    return hours < 24 ? `vor ${hours} Std` : new Date(at).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
  }

  // --- Skill rows ------------------------------------------------------------------
  // A progress ring around a rounded tile; its length is the rect's perimeter.
  function ringSvg(size, rx) {
    const w = size - 3
    const per = (4 * w - 8 * rx + 2 * Math.PI * rx).toFixed(1)
    return `<svg class="hring" viewBox="0 0 ${size} ${size}" style="--rs:${size}px;--per:${per}" aria-hidden="true"><rect x="1.5" y="1.5" width="${w}" height="${w}" rx="${rx}"/></svg>`
  }
  const ROW_RING = ringSvg(58, 17)
  const BIG_RING = ringSvg(74, 21)
  const OK = '<span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
  function mono(name) {
    const parts = short(name).split(/[-_ ]+/).filter(Boolean)
    return (parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2)).toUpperCase()
  }

  function skillRow(skill, i, trailOverride) {
    const look = CAT[skill.category]
    const live = loadedSet().has(skill.name)
    const pending = state.pending.has(skill.name) && !live
    const trail = trailOverride ?? (live ? '<span class="tag loaded">✓ Geladen</span>'
      : pending ? '<span class="spin" role="img" aria-label="Lädt"></span>'
      : `${state.favorites.has(skill.name) ? '<span class="star" aria-label="Favorit">★</span>' : ''}${CHEV}`)
    return `<button class="srow" style="${colors(look)};--i:${i}" data-hold="${esc(skill.name)}" data-skill="${esc(skill.name)}"
        aria-label="${esc(skill.short)}: ${esc(skill.summary)}. Tippen für Details, gedrückt halten zum Laden.">
      <span class="sicon">${ROW_RING}<span class="ripple"></span><span class="tile"><span class="mono">${esc(mono(skill.name))}</span>${OK}</span>${live ? '<span class="live"></span>' : ''}</span>
      <span class="stext"><b>${esc(skill.short)}</b><span>${esc(skill.summary)}</span></span>
      <span class="trail">${trail}</span></button>`
  }

  function recRow(rec, i) {
    return `<button class="srow" style="${colors(CAT.Design)};--i:${i}" data-hold="rec:${esc(rec.id)}" data-rec="${esc(rec.id)}"
        aria-label="${esc(rec.title)} von ${esc(rec.author)}. Tippen für Details, gedrückt halten zum Installieren.">
      <span class="sicon">${ROW_RING}<span class="ripple"></span><span class="tile hollow"><span class="mono">${esc(mono(rec.id))}</span>${OK}</span></span>
      <span class="stext"><b>${esc(rec.title)}</b><span>${esc(rec.author)} · ${esc(rec.summary)}</span></span>
      <span class="trail"><span class="tag new">Neu</span></span></button>`
  }

  const group = (title, count, rows) => rows ? `<h3 class="gtitle"><span>${esc(title)}</span><span>${count}</span></h3><div class="glist">${rows}</div>` : ''
  const TIP = (text) => `<div class="dhead"><span class="tip"><span class="press"></span>${esc(text)}</span></div>`

  // --- Suggestions -----------------------------------------------------------------
  function suggestions() {
    const picks = []
    const add = name => { if (!picks.includes(name) && skillByName(name)) picks.push(name) }
    ;[...state.loaded].reverse().forEach(u => add(u.skill))
    state.favorites.forEach(add)
    ;['anthropic-skills:berater', 'anthropic-skills:coworker', 'anthropic-skills:deep-research', 'anthropic-skills:coach'].forEach(add)
    return picks.slice(0, 4).map(skillByName)
  }

  function renderSuggest() {
    const live = loadedSet()
    $('suggest').innerHTML = suggestions().map(s => `<button class="app" style="${colors(CAT[s.category])}" data-hold="${esc(s.name)}" data-skill="${esc(s.name)}" aria-label="${esc(s.short)}. Tippen für Details, gedrückt halten zum Laden.">
      <span class="sicon big">${BIG_RING}<span class="ripple"></span><span class="tile"><span class="mono">${svg(CAT[s.category].icon)}</span>${OK}</span>${live.has(s.name) ? '<span class="live"></span>' : ''}</span>
      <span>${esc(s.short)}</span></button>`).join('')
    $('chips').innerHTML = TRIES.map(t => `<button class="chip" data-try="${esc(t.q)}" style="${colors(CAT[t.cat])}"><i></i>${esc(t.label)}</button>`).join('')
  }

  // --- Wallet ----------------------------------------------------------------------
  const PEEK = 60
  const cards = [
    { id: 'session', kind: 'session', title: 'Diese Session' },
    { id: 'merge', kind: 'merge', title: 'Merge' },
    { id: 'setup', kind: 'setup', title: 'Setup' },
    ...CATS.map(c => ({ id: c.id, kind: 'cat', title: c.id })),
    { id: 'rec', kind: 'rec', title: 'Empfohlen' },
  ]

  function cardHtml(card) {
    const live = loadedSet()
    if (card.kind === 'session') {
      const recent = uniqueLoaded().slice(0, 3).map(u => short(u.skill))
      return `${pattern('radar')}<div class="wtop"><div><small>Cockpit</small><b>Diese Session</b></div>
          <div class="wcount"><small>Geladen</small><b>${live.size}</b></div></div>
        <div class="wbottom"><div><small>Zuletzt · Kontext ${pct(ctxShare())}</small><p>${esc(recent.join(' · ') || 'Noch kein Skill geladen')}</p></div>
          <span class="glyph ring40">${miniRing(40, 16, 4, ctxShare(), ctxLook(ctxShare()))}<em>${ctxShare() == null ? '–' : Math.round(ctxShare() * 100)}</em></span></div>`
    }
    if (card.kind === 'merge') {
      const d = pr.data
      if (!d) {
        return `${pattern('branches')}<div class="wtop"><div><small>Merge</small><b>Kein PR</b></div></div>
          <div class="wbottom"><div><small>Wartet</small><p>Claude trägt den PR dieses Branches nach dem nächsten Push ein.</p></div>
            <span class="glyph">${svg(MERGE_ICON)}</span></div>`
      }
      const st = mergeStatus(d)
      const glyph = d.state === 'merged' ? CHECK : mergeBusy(d) ? '<span class="spin"></span>' : svg(MERGE_ICON)
      return `${pattern('branches')}<div class="wtop"><div style="min-width:0"><small>Merge · #${d.number}</small>
            <div class="wtarget"><span>in</span><b>${esc(d.base)}</b></div></div>
          <div class="wcount"><small>Dateien</small><b>${d.files ?? '–'}</b></div></div>
        <div class="wbottom"><div style="min-width:0"><small class="mstat" style="--dot:${st.dot}"><i></i>${esc(st.short)}</small><p>${esc(d.title)}</p></div>
          <span class="glyph">${glyph}</span></div>`
    }
    if (card.kind === 'setup') {
      const d = setup.data
      if (!d) {
        return `${pattern('pins')}<div class="wtop"><div><small>Setup</small><b>Noch nicht geprüft</b></div></div>
          <div class="wbottom"><div><small>Wartet</small><p>Die Cockpit-Mod prüft das Repo beim Start der Session.</p></div>
            <span class="glyph">${svg(SETUP_ICON)}</span></div>`
      }
      const good = d.checks.filter(c => c.state === 'ok').length
      const worst = d.checks.reduce((w, c) => (RANK[c.state] > RANK[w] ? c.state : w), 'ok')
      const dots = ['Connectors', 'Skills', 'Branch'].map(g => groupState(d, g)).filter(Boolean)
        .map(st => `<i style="--dot:${STATE_DOT[st]}"></i>`).join('')
      return `${pattern('pins')}<div class="wtop"><div style="min-width:0"><small>Setup · ${esc(d.repo || 'kein Repo')}</small>
            <div class="wbig">${worst === 'ok' ? 'Alles bereit' : `${good} von ${d.checks.length}`}</div></div>
          <div class="wcount"><small>Stand</small><span class="dots">${dots}</span></div></div>
        <div class="wbottom"><div style="min-width:0"><small>${esc(d.branch && d.branch !== 'HEAD' ? d.branch : 'kein Branch')}</small>
            <p>${esc(worst === 'ok' ? 'Connectors, Skills und Branch passen.' : d.checks.filter(c => c.state !== 'ok').map(c => c.name).join(' · '))}</p></div>
          <span class="glyph">${worst === 'ok' ? CHECK : svg(SETUP_ICON)}</span></div>`
    }
    if (card.kind === 'rec') {
      return `${pattern('guilloche')}<span class="notch l"></span><span class="notch r"></span><span class="perf"></span>
        <div class="wtop"><div><small>Für deinen Stil</small><b>Empfohlen</b></div>
          <div class="wcount"><small>Design</small><b>${recommended.length}</b></div></div>
        <div class="wbottom"><div><small>Nicht installiert</small><p>${esc(recommended.map(r => r.title).join(' · '))}</p></div>
          <span class="glyph">${svg(REC_ICON)}</span></div>`
    }
    const members = DATA.skills.filter(s => s.category === card.id)
    const loadedHere = members.filter(s => live.has(s.name)).length
    const names = members.slice(0, 4).map(s => s.short).join(' · ')
    return `${pattern(CAT[card.id].pat)}<div class="wtop"><div><small>Cockpit</small><b>${esc(card.title)}</b></div>
        <div class="wcount"><small>Skills</small><b>${members.length}</b></div></div>
      <div class="wbottom"><div><small>${loadedHere ? `${loadedHere} geladen` : 'Bereit'}</small><p>${esc(names)}${members.length > 4 ? ' …' : ''}</p></div>
        <span class="glyph">${svg(CAT[card.id].icon)}</span></div>`
  }

  function uniqueLoaded() {
    const seen = new Set()
    return [...state.loaded].reverse().filter(u => !seen.has(u.skill) && seen.add(u.skill))
  }

  function detailHtml(card) {
    if (card.kind === 'session') {
      const items = uniqueLoaded()
      const look = ctxLook(ctxShare())
      const ctxRow = `<button class="ctx-row" data-context>${miniRing(36, 14, 5, ctxShare(), look)}<span><b>Kontext ${pct(ctxShare())}</b><small>${esc(ctx.error ? 'Nicht abrufbar' : `${look.word} · ${tokens(ctx.used)} von ${tokens(ctx.max)}`)}</small></span>${CHEV}</button>`
      if (!items.length) return `${ctxRow}${TIP('Halte eine Skill-Karte gedrückt, um sie zu laden')}<p class="empty">In dieser Session wurde noch kein Skill geladen.</p>`
      const rows = items.map((u, i) => {
        const s = skillByName(u.skill)
        return s ? skillRow(s, i, `<span class="time">${esc(ago(u.at))}</span>`) : ''
      }).join('')
      return `${ctxRow}${TIP('Tippen öffnet den Skill')}${group('Zuletzt geladen', items.length, rows)}`
    }
    if (card.kind === 'merge') return mergeDetail()
    if (card.kind === 'setup') return setupDetail()
    if (card.kind === 'rec') {
      return `${TIP('Halten: Claude installiert · Tippen: Details')}${group('Für deinen Stil', recommended.length, recommended.map(recRow).join(''))}`
    }
    const live = loadedSet()
    const members = DATA.skills.filter(s => s.category === card.id).sort((a, b) => a.short.localeCompare(b.short))
    const loadedHere = members.filter(s => live.has(s.name))
    const favs = members.filter(s => !live.has(s.name) && state.favorites.has(s.name))
    const rest = members.filter(s => !live.has(s.name) && !state.favorites.has(s.name))
    let i = 0
    const rows = list => list.map(s => skillRow(s, i++)).join('')
    return TIP('Halten lädt · Tippen öffnet') +
      group('Geladen', loadedHere.length, rows(loadedHere)) +
      group('Favoriten', favs.length, rows(favs)) +
      group(loadedHere.length || favs.length ? 'Weitere Skills' : 'Skills', rest.length, rows(rest))
  }

  function mergeDetail() {
    const d = pr.data
    const actions = d => `<div class="links-row">
        <button class="text-btn" data-pr-refresh>Neu prüfen lassen</button>
        ${d?.url ? `<a class="text-btn" href="${esc(d.url)}" target="_blank" rel="noopener">Auf GitHub ↗</a>` : ''}
      </div>`
    if (!d) {
      return `<p class="empty">${esc(pr.error ? 'Die Daten der Seite sind gerade nicht lesbar.' : 'Noch kein PR eingetragen. Claude schreibt ihn nach jedem Push oder PR-Ereignis hierher.')}</p>${actions(null)}`
    }
    const facts = `
      <div class="kv"><span>CI</span><span class="mstat" style="--dot:${CHECK_DOT[d.ci]}"><i></i>${esc(ciWord(d))}</span></div>
      ${d.checks.length ? `<ul class="checks">${d.checks.map(c => `<li style="--dot:${CHECK_DOT[c.state] || '#8e8e93'}"><i></i><span>${esc(c.name)}</span></li>`).join('')}</ul>` : ''}
      <div class="kv"><span>Konflikte</span><span>${d.mergeable === true ? 'Keine' : d.mergeable === false ? `Ja, mit ${esc(d.base)}` : 'Wird geprüft'}</span></div>
      <div class="kv"><span>Dateien</span><span>${d.files ?? '–'}${d.additions != null ? ` · <span style="color:var(--loaded)">+${d.additions}</span> <span style="color:#ff453a">−${d.deletions ?? 0}</span>` : ''}</span></div>
      ${d.draft && d.state === 'open' ? '<div class="kv"><span>Entwurf</span><span>Claude gibt ihn vor dem Mergen frei</span></div>' : ''}
      <div class="kv"><span>Stand</span><span>${d.updatedAt ? esc(ago(d.updatedAt)) : '–'}</span></div>`
    const head = `<h3>${esc(d.title)} <span class="num">#${d.number}</span></h3>`
    if (d.state === 'merged') {
      const play = Date.now() - pr.playedAt < 3000 ? ' play' : ''
      const sparks = Array.from({ length: 8 }, (_, i) => `<circle class="spark" cx="42" cy="42" r="3" style="--a:${i * 45}deg"/>`).join('')
      return `<div class="preview">
          <div class="done-mark${play}"><svg viewBox="0 0 84 84" aria-hidden="true">${sparks}<circle class="c" cx="42" cy="42" r="38"/><path class="k" d="M27 43l10 10 21-22"/></svg>
            <b>In ${esc(d.base)} gemergt</b><span>${esc(d.merge?.branchDeleted ? `Branch ${d.head} gelöscht` : d.head)}</span></div>
          ${head}
          ${d.merge?.sha ? `<div class="kv"><span>Commit</span><span><code>${esc(shortSha(d.merge.sha))}</code></span></div>` : ''}
          ${d.merge?.at ? `<div class="kv"><span>Gemergt</span><span>${esc(ago(d.merge.at))}</span></div>` : ''}
        </div>${actions(d)}`
    }
    const blockers = mergeBlockers(d)
    const busy = mergeBusy(d)
    let button
    if (d.state === 'closed') button = `<button class="mbtn" disabled>${svg(MERGE_ICON)}<span><b>Geschlossen</b><small>Dieser PR wurde ohne Merge geschlossen</small></span></button>`
    else if (busy) button = `<button class="mbtn busy" disabled><span class="spin"></span><span><b>Claude merged …</b><small>Prüft CI und Konflikte noch einmal</small></span></button>`
    else if (blockers.length) button = `<button class="mbtn" disabled>${svg(MERGE_ICON)}<span><b>Gesperrt</b><small>${esc(mergeStatus(d).short)}</small></span></button>`
    else button = `<button class="mbtn" data-hold="merge:${d.number}" aria-label="Gedrückt halten: PR ${d.number} per Squash in ${esc(d.base)} mergen">
        <span class="fill"></span>${svg(MERGE_ICON)}<span><b>Gedrückt halten zum Mergen</b><small>Squash in ${esc(d.base)}, danach Branch löschen</small></span></button>`
    const failed = !busy && d.merge?.state === 'failed'
    return `${TIP(blockers.length || busy || d.state !== 'open' ? 'Vorschau des PR' : 'Halten merged · 1,2 s')}
      <div class="preview">
        ${head}
        <div class="route"><small>Ziel</small><div class="to">${ARROW}<span>${esc(d.base)}</span></div><span class="from">aus ${esc(d.head)}</span></div>
        <div style="display:flex;flex-direction:column;gap:10px">${facts}</div>
      </div>
      ${failed ? `<div class="blockers"><b>Merge abgebrochen</b><span>${esc(d.merge.message || 'Claude hat nicht gemergt.')}</span></div>` : ''}
      ${blockers.length && d.state === 'open' && !busy ? `<div class="blockers"><b>Noch gesperrt</b>${blockers.map(b => `<span>${esc(b)}</span>`).join('')}</div>` : ''}
      ${button}
      ${!sendAvailable() && !blockers.length && d.state === 'open' && !busy ? `<p class="hint">${esc(sendReason())}</p>` : ''}
      ${actions(d)}`
  }

  function buildWallet() {
    const wallet = $('wallet')
    wallet.innerHTML = cards.map((card, i) => {
      const look = card.kind === 'session' ? SESSION : card.kind === 'merge' ? MERGE : card.kind === 'setup' ? SETUP : card.kind === 'rec' ? TICKET : CAT[card.id]
      return `<button class="wcard${card.kind === 'rec' ? ' ticket' : ''}" data-card="${card.id}" style="${colors(look)};z-index:${i + 1}" aria-expanded="false"></button>`
    }).join('') + '<div class="detail" id="detail"></div>'
    refreshCards()
    layout(false)
  }

  function refreshCards() {
    for (const card of cards) {
      const el = document.querySelector(`[data-card="${card.id}"]`)
      el.innerHTML = cardHtml(card)
      el.setAttribute('aria-label', `${card.title}${state.open === card.id ? ', geöffnet' : ''}`)
    }
  }

  function layout(animate = true) {
    const wallet = $('wallet'), detail = $('detail')
    const cardH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h')) || 214
    const openIndex = cards.findIndex(c => c.id === state.open)
    if (!animate) wallet.querySelectorAll('.wcard').forEach(el => { el.style.transition = 'none' })
    if (openIndex < 0) {
      cards.forEach((card, i) => {
        const el = wallet.querySelector(`[data-card="${card.id}"]`)
        el.style.transform = `translate3d(0, ${i * PEEK}px, 0)`
        el.style.zIndex = i + 1
        el.style.opacity = ''
        el.style.pointerEvents = ''
        el.removeAttribute('aria-hidden')
        el.setAttribute('aria-expanded', 'false')
      })
      detail.classList.remove('show')
      wallet.style.height = `${(cards.length - 1) * PEEK + cardH}px`
      $('done').hidden = true
    } else {
      const top = cardH + 16
      detail.style.top = `${top}px`
      detail.classList.add('show')
      const detailH = detail.offsetHeight
      // The other cards tuck in behind the open one; "Fertig" brings them back.
      let rank = 0
      cards.forEach((card, i) => {
        const el = wallet.querySelector(`[data-card="${card.id}"]`)
        if (i === openIndex) {
          el.style.transform = 'translate3d(0, 0, 0)'
          el.style.zIndex = 40
          el.style.opacity = ''
          el.style.pointerEvents = ''
          el.removeAttribute('aria-hidden')
          el.setAttribute('aria-expanded', 'true')
        } else {
          el.style.transform = 'translate3d(0, 0, 0) scale(0.96)'
          el.style.zIndex = rank + 1
          el.style.opacity = '0'
          el.style.pointerEvents = 'none'
          el.setAttribute('aria-hidden', 'true')
          el.setAttribute('aria-expanded', 'false')
          rank += 1
        }
      })
      wallet.style.height = `${top + detailH + 8}px`
      $('done').hidden = false
    }
    if (!animate) requestAnimationFrame(() => wallet.querySelectorAll('.wcard').forEach(el => { el.style.transition = '' }))
  }

  function openCard(id) {
    const closing = state.open === id
    state.open = closing ? null : id
    $('detail').innerHTML = state.open ? detailHtml(cards.find(c => c.id === state.open)) : ''

    layout()

      const y = $('wallet').getBoundingClientRect().top + window.scrollY - 70
      if (window.scrollY > y || y - window.scrollY > window.innerHeight * 0.45) window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' })
    }
  }

  // --- Search results --------------------------------------------------------------
  function score(skill, q) {
    const n = skill.short.toLowerCase()
    if (n === q) return 100
    if (n.startsWith(q)) return 80
    if (n.includes(q)) return 60
    if (skill.summary.toLowerCase().includes(q)) return 40
    if (skill.category.toLowerCase().includes(q)) return 30
    if (skill.description.toLowerCase().includes(q)) return 20
    return 0
  }

  function renderResults() {
    const q = state.query.trim().toLowerCase()
    const searching = q.length > 0
    $('home').hidden = searching
    $('results').hidden = !searching
    $('clear').hidden = !searching
    if (!searching) return
    const hits = DATA.skills.map(s => ({ s, p: score(s, q) })).filter(h => h.p > 0).sort((a, b) => b.p - a.p || a.s.short.localeCompare(b.s.short)).map(h => h.s)
    const recs = recommended.filter(r => [r.title, r.author, r.summary].some(t => t.toLowerCase().includes(q)))
    if (!hits.length && !recs.length) {
      $('results').innerHTML = `<p class="empty">Kein Skill passt zu „${esc(state.query)}“. Versuch es mit einem anderen Wort.</p>`
      return
    }
    const parts = []
    if (hits.length) {
      const best = hits[0], cat = CAT[best.category], live = loadedSet().has(best.name)
      parts.push(`<h2 class="label"><span>Bester Treffer</span></h2>
        <button class="best" style="${colors(cat)}" data-hold="${esc(best.name)}" data-skill="${esc(best.name)}" aria-label="${esc(best.short)}. Tippen für Details, gedrückt halten zum Laden.">
          ${pattern(cat.pat)}<span class="fill"></span>
          <small>${esc(best.category)} · ${live ? 'geladen' : 'bereit'}</small>
          <h3>${esc(best.short)}</h3>
          <p>${esc(best.summary)}</p>
          <span class="hold-hint">Gedrückt halten zum Laden</span>
        </button>`)
    }
    const rest = hits.slice(1, 12)
    if (rest.length || recs.length) {
      parts.push(group('Weitere Treffer', hits.length - 1 + recs.length, rest.map((s, i) => skillRow(s, i)).join('') + recs.map((r, i) => recRow(r, rest.length + i)).join('')))
    }
    $('results').innerHTML = parts.join('')
  }

  function render() {
    const live = loadedSet()
    $('subtitle').textContent = live.size
      ? `${live.size} ${live.size === 1 ? 'Skill' : 'Skills'} geladen · ${DATA.skills.length} bereit`
