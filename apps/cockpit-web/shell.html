<title>Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: search and suggestions on top, the skill areas below as a Wallet stack; an opened card shows its skills as hold-to-load cards. */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #e9e9ee;
  --fg: #1c1c1e;
  --fg2: #6c6c70;
  --fg3: #aeaeb2;
  --sep: rgba(60, 60, 67, 0.14);
  --fill: rgba(118, 118, 128, 0.12);
  --accent: #007aff;
  --loaded: #34c759;
  --warn: #ff9500;
  --scrim: rgba(0, 0, 0, 0.32);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 14px 32px -14px rgba(0, 0, 0, 0.38);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --bounce: cubic-bezier(0.34, 1.36, 0.64, 1);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --card-h: 214px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
    --sep: rgba(84, 84, 88, 0.5); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --loaded: #30d158; --warn: #ff9f0a;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 34px -14px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
  --sep: rgba(84, 84, 88, 0.5); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --loaded: #30d158; --warn: #ff9f0a;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 34px -14px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--fg); font: 17px/1.35 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 56px;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 10px; }
[data-hold], .wcard, .pass, .sheet-grab { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; }
.top h1 { font: 700 34px/1.08 var(--display); letter-spacing: -0.012em; margin: 0; }
.top p { margin: 4px 0 0; color: var(--fg2); font-size: 15px; }
.link-state { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.link-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
.link-state.on i { background: var(--loaded); }

/* Context ring */
.ctx-chip { flex: none; display: flex; align-items: center; gap: 9px; padding: 6px 13px 6px 7px; border-radius: 999px; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); transition: transform 0.3s var(--bounce); }
.ctx-chip:active { transform: scale(0.94); }
.ctx-chip svg { width: 34px; height: 34px; }
.ctx-chip b { display: block; font: 700 16px/1.05 var(--rounded); font-variant-numeric: tabular-nums; }
.ctx-chip small { display: block; font-size: 11px; color: var(--fg2); }
.trk { fill: none; stroke: var(--fill); }
.arc { fill: none; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; transition: stroke-dashoffset 0.9s var(--spring), stroke 0.6s; }
.arc.draw { animation: ringIn 1.3s var(--spring) both; }
@keyframes ringIn { from { stroke-dashoffset: var(--len); } }
.ring40 { position: relative; }
.ring40 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring40 svg .trk { stroke: rgba(255, 255, 255, 0.18); }
.ring40 em { position: relative; font: 700 11px/1 var(--rounded); font-style: normal; }
.ring-card { align-items: center; padding: 22px 16px 18px; }
.ring-wrap { position: relative; width: 240px; max-width: 100%; aspect-ratio: 1; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ring-center b { font: 700 52px/1 var(--rounded); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 14px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.tick { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
.legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--fg2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--ca), var(--cb)); transition: width 0.9s var(--spring); }
.ctx-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); transition: transform 0.3s var(--spring); }
.ctx-row:active { transform: scale(0.98); }
.ctx-row svg { flex: none; width: 34px; height: 34px; }
.ctx-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ctx-row b { font-weight: 600; }
.ctx-row small { font-size: 13px; color: var(--fg2); }


/* Search (Spotlight) */
/* The search floats over the page as a material: content scrolls under it. */
.search { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 20; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 74%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -16px rgba(0, 0, 0, 0.35), inset 0 0.5px 0 rgba(255, 255, 255, 0.5); }
.search svg { flex: none; width: 19px; height: 19px; color: var(--fg2); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: var(--fg); }
.search input::placeholder { color: var(--fg2); }
.search input::-webkit-search-cancel-button { display: none; }
.clear[hidden] { display: none; }
.clear { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--fg3); color: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

.label { margin: 0 4px; font: 600 13px/1.2 var(--font); letter-spacing: 0.03em; color: var(--fg2); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.suggest { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; transition: transform 0.3s var(--bounce); }
.app:active { transform: scale(0.92); }
.app span:last-child { max-width: 100%; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.icon { position: relative; width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 2px 6px -2px rgba(0, 0, 0, 0.3); }
.icon svg { width: 28px; height: 28px; }
.icon .live { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--loaded); border: 2.5px solid var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 19px; background: var(--surface); font-size: 15px; transition: transform 0.25s var(--spring); }
.chip:active { transform: scale(0.95); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); }

/* Wallet */
/* Cards, detail and height move by springs in script (place, detailTo, heightTo), never by CSS transitions. */
.wallet { position: relative; isolation: isolate; }
.wcard {
  position: absolute; left: 0; right: 0; top: 0; height: var(--card-h); border-radius: 18px; overflow: hidden; color: #fff;
  background: radial-gradient(130% 100% at 100% 0%, var(--g, transparent) 0%, transparent 58%), radial-gradient(90% 80% at 0% 100%, rgba(0, 0, 0, 0.16), transparent 62%), linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: var(--shadow), inset 0 0.5px 0 rgba(255, 255, 255, 0.35), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
  transition: box-shadow 0.4s; will-change: transform, opacity;
  display: flex; flex-direction: column; justify-content: space-between; padding: 15px 20px 18px; width: 100%;
}
.wcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.04) 34%, rgba(255, 255, 255, 0) 52%); pointer-events: none; }
.wcard::after { content: ""; position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wcard > * { position: relative; z-index: 1; }
.pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: transform 1s var(--spring); }
.wcard > .pattern, .pass > .pattern, .best > .pattern { position: absolute; z-index: 0; }
.wcard[aria-expanded="true"] > .pattern { transform: translate3d(-10px, 6px, 0) scale(1.05); }
.pattern.fade-r { -webkit-mask-image: linear-gradient(100deg, transparent 18%, #000 78%); mask-image: linear-gradient(100deg, transparent 18%, #000 78%); }
.pattern.fade-b { -webkit-mask-image: linear-gradient(180deg, transparent 10%, #000 85%); mask-image: linear-gradient(180deg, transparent 10%, #000 85%); }
.wcard.ticket { color: #1c1c1e; }
.wcard.ticket::before { background: linear-gradient(118deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 45%); }
.wcard.ticket .notch { position: absolute; top: 132px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); z-index: 2; }
.wcard.ticket .notch.l { left: -11px; } .wcard.ticket .notch.r { right: -11px; }
.wcard.ticket .perf { position: absolute; left: 18px; right: 18px; top: 142px; border-top: 1.5px dashed rgba(28, 28, 30, 0.22); z-index: 1; }
.wtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 30px; }
.wtop small, .wbottom small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; opacity: 0.72; text-transform: uppercase; }
.wtop b { display: block; font: 600 21px/1.15 var(--display); letter-spacing: -0.005em; }
.wcount { text-align: right; }
.wcount b { font: 600 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.wbottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; }
.wbottom p { margin: 2px 0 0; font-size: 14px; opacity: 0.92; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.glyph { flex: none; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); display: grid; place-items: center; box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.25); }
.ticket .glyph { background: rgba(28, 28, 30, 0.07); box-shadow: inset 0 0 0 0.5px rgba(28, 28, 30, 0.12); }
.glyph svg { width: 20px; height: 20px; }
.pulse { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--loaded); }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--loaded); animation: breathe 1.8s var(--spring) infinite; }
@keyframes breathe { from { transform: scale(1); opacity: 0.85; } to { transform: scale(2.6); opacity: 0; } }

.detail { position: absolute; left: 0; right: 0; z-index: 30; opacity: 0; transform: translateY(26px); pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
.detail.show { pointer-events: auto; }
.mini-dots { display: grid; grid-template-columns: repeat(3, 7px); gap: 4px; }
.mini-dots i { width: 7px; height: 7px; border-radius: 2.5px; background: var(--d); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.4); }
.hint { margin: 0 4px; font-size: 13px; color: var(--fg2); }

/* Skill rows: grouped like Wallet's transactions; hold to load */
.glist { background: var(--surface); border-radius: 16px; overflow: hidden; }
.srow {
  position: relative; width: 100%; min-height: 68px; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 12px;
  transition: background-color 0.25s, transform 0.45s var(--spring);
  animation: rowIn 0.55s var(--spring) both; animation-delay: calc(var(--i, 0) * 32ms + 100ms);
}
@keyframes rowIn { from { opacity: 0; transform: translateY(14px); } }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 0.5px solid var(--sep); }
.srow:active { background: var(--surface-2); }
.srow.holding { background: color-mix(in srgb, var(--c1) 14%, var(--surface)); transform: scale(0.985); transition: background-color var(--hold-draw) linear var(--hold-delay), transform 0.3s var(--spring); }
.srow.fired { background: color-mix(in srgb, var(--loaded) 13%, var(--surface)); transition: background-color 1.4s 0.6s; }
.sicon { position: relative; flex: none; width: 46px; height: 46px; }
.sicon.big { width: 60px; height: 60px; }
.tile {
  position: absolute; inset: 0; border-radius: 13px; display: grid; place-items: center; color: #fff; font: 700 15px/1 var(--rounded); letter-spacing: 0.03em;
  background: radial-gradient(120% 100% at 100% 0%, var(--g, transparent), transparent 62%), linear-gradient(155deg, var(--c1), var(--c2));
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 2px 6px -3px rgba(0, 0, 0, 0.35);
  transition: transform 0.55s var(--bounce);
}
.sicon.big .tile { border-radius: 15px; }
.tile svg { width: 26px; height: 26px; }
.tile.hollow { background: transparent; color: var(--c1); box-shadow: inset 0 0 0 1.5px var(--c1); }
.tile .mono { display: grid; place-items: center; transition: opacity 0.2s, transform 0.35s var(--spring); }
.tile .ok { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
.tile .ok svg { width: 24px; height: 24px; }
.tile .ok path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.sicon .live { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--loaded); border: 2.5px solid var(--surface); z-index: 2; }
.sicon.big .live { width: 16px; height: 16px; border-color: var(--bg); }
.ripple { position: absolute; inset: 0; border-radius: 16px; background: var(--loaded); opacity: 0; pointer-events: none; }
.hring { position: absolute; left: 50%; top: 50%; width: var(--rs); height: var(--rs); margin: calc(var(--rs) / -2) 0 0 calc(var(--rs) / -2); overflow: visible; pointer-events: none; z-index: 1; }
.hring rect { fill: none; stroke: var(--c1); stroke-width: 3; stroke-linecap: round; stroke-dasharray: var(--per) var(--per); stroke-dashoffset: var(--per); opacity: 0; transition: stroke-dashoffset 0.25s var(--spring), opacity 0.2s; }
.holding .hring rect { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold-draw) cubic-bezier(0.45, 0, 0.55, 1) var(--hold-delay), opacity 0.12s var(--hold-delay); }
.holding .tile { transform: scale(0.86); transition: transform var(--hold-draw) var(--spring) var(--hold-delay); }
.holding .trail { opacity: 0.3; transition: opacity 0.2s var(--hold-delay); }
.fired .hring rect { opacity: 1; stroke-dashoffset: 0; stroke: var(--loaded); transition: stroke 0.15s; }
.fired .hring { animation: ringOut 0.7s 0.3s var(--spring) forwards; }
.fired .tile { background: linear-gradient(155deg, #4cd964, #1f9d45); animation: tilePop 0.62s var(--bounce); }
.fired .tile .mono { opacity: 0; transform: scale(0.4); }
.fired .tile .ok { opacity: 1; }
.fired .tile .ok path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.35s 0.08s var(--spring); }
.fired .ripple { animation: ripple 0.9s var(--spring); }
@keyframes ringOut { to { opacity: 0; transform: scale(1.35); } }
@keyframes tilePop { 0% { transform: scale(0.86); } 50% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes ripple { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 0; transform: scale(2.8); } }
.stext { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stext b { font-weight: 600; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stext span { font-size: 14px; color: var(--fg2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trail { position: relative; flex: none; display: flex; align-items: center; gap: 8px; color: var(--fg3); }
.trail .chev { width: 8px; height: 13px; }
.trail .star { color: var(--warn); font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.tag.loaded { color: var(--loaded); background: color-mix(in srgb, var(--loaded) 15%, transparent); }
.tag.new { color: var(--c1); background: color-mix(in srgb, var(--c1) 14%, transparent); }
.time { font-size: 14px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.spin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 90deg, transparent 0 20%, var(--accent));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.6px), #000 calc(100% - 2.2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.6px), #000 calc(100% - 2.2px));
  animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(1turn); } }
.app.holding .tile { transform: scale(0.84); }
.dhead { display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.tip { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg2); background: var(--surface); padding: 7px 13px 7px 11px; border-radius: 999px; }
.tip .press { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--fg2); }
.tip .press::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--fg2); animation: pressHint 2.4s var(--spring) infinite; }
@keyframes pressHint { 0%, 15% { transform: scale(0.5); opacity: 0; } 35% { opacity: 1; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
.gtitle { margin: 8px 4px 0; font: 600 13px/1.2 var(--font); letter-spacing: 0.03em; color: var(--fg2); text-transform: uppercase; display: flex; justify-content: space-between; }

/* Results */
.best { position: relative; overflow: hidden; border-radius: 18px; color: #fff; background: radial-gradient(130% 100% at 100% 0%, var(--g, transparent) 0%, transparent 58%), radial-gradient(90% 80% at 0% 100%, rgba(0, 0, 0, 0.16), transparent 62%), linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; transition: transform 0.35s var(--spring); }
.best::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 50%); pointer-events: none; }
.best > * { position: relative; }
.best .fill { position: absolute; inset: 0; background: #fff; opacity: 0.14; transform: scaleX(0); transform-origin: left; pointer-events: none; }
.best.holding { transform: scale(0.98); }
.best.holding .fill { transform: scaleX(1); transition: transform var(--hold, 650ms) linear; }
.best.fired { animation: fired 0.6s var(--bounce); }
.best h3 { margin: 0; font: 700 26px/1.1 var(--display); overflow-wrap: anywhere; }
.best p { margin: 0; font-size: 15.5px; line-height: 1.4; opacity: 0.94; }
.best small { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; opacity: 0.75; text-transform: uppercase; }
.best .hold-hint { font-size: 13px; opacity: 0.8; }
.list { display: flex; flex-direction: column; gap: 8px; }
.empty { padding: 18px; border-radius: 16px; background: var(--surface); color: var(--fg2); font-size: 15px; text-align: center; }

/* Merge: the branch's PR as a preview, hold to squash-merge */
.wtarget { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.wtarget b { font: 700 30px/1.05 var(--display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wtarget span { font-size: 15px; opacity: 0.7; }
.wbottom small.mstat, .mstat { display: inline-flex; align-items: center; gap: 6px; }
.mstat i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.preview { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; animation: rowIn 0.55s var(--spring) both; animation-delay: 0.1s; }
.preview h3 { margin: 0; font: 600 18px/1.3 var(--display); overflow-wrap: anywhere; }
.preview .num { color: var(--fg2); font-weight: 500; }
.route { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.route small { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); }
.route .from { font: 13.5px var(--mono); color: var(--fg2); overflow-wrap: anywhere; }
.route .to { display: flex; align-items: center; gap: 8px; font: 700 34px/1 var(--display); letter-spacing: -0.015em; min-width: 0; }
.route .to svg { flex: none; width: 22px; height: 22px; color: var(--fg3); }
.route .to span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checks { display: flex; flex-direction: column; gap: 7px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--fg2); }
.checks li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.checks li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checks i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
.blockers { margin: 0; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 13%, var(--surface)); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.blockers b { font-weight: 600; }
.mbtn {
  position: relative; overflow: hidden; width: 100%; min-height: 64px; border-radius: 18px; padding: 12px 18px;
  display: flex; align-items: center; justify-content: center; gap: 12px; color: #fff; text-align: center;
  background: linear-gradient(155deg, #8e4ff0, #5b22c2); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 12px 26px -14px #5b22c2;
  transition: transform 0.35s var(--spring), opacity 0.3s;
}
.mbtn svg { position: relative; flex: none; width: 24px; height: 24px; }
.mbtn span { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }

.mbtn .fill { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.22); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.mbtn.holding { transform: scale(0.97); }
.mbtn.holding .fill { transform: scaleX(1); transition: transform var(--hold-merge) linear; }
.mbtn.fired { animation: tilePop 0.62s var(--bounce); }
.mbtn[disabled] { background: var(--fill); color: var(--fg3); box-shadow: none; cursor: default; }
.mbtn.busy { background: var(--fill); color: var(--fg); box-shadow: none; }
.merged { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 2px; text-align: center; }
.merged svg { width: 100%; max-width: 300px; height: auto; overflow: visible; }
.merged b { font: 700 24px/1.15 var(--display); letter-spacing: -0.01em; }
.merged span { color: var(--fg2); font-size: 15px; }
/* Zipper: the branch's teeth (top) and main's (bottom) meet; the slider closes them left to right.
   Without .play everything rests closed; .play starts each part from its open state. */
.zip .lbl { font: 600 10px var(--font); letter-spacing: 0.02em; }
.zip .lbl.br { fill: #64d2ff; } .zip .lbl.mn { fill: #a35cf7; }
.zip .tt { fill: #a35cf7; } .zip .tb { fill: #a35cf7; }
.zip .slider { opacity: 0; }
.zip .slider rect { fill: var(--fg); } .zip .slider path { stroke: var(--surface); stroke-width: 2; stroke-linecap: round; fill: none; }
.zip .done { transform-box: fill-box; transform-origin: center; }
.zip .done circle { fill: #a35cf7; }
.zip .done path { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.zip .lbl.br { opacity: 0.5; }
.merged.play .lbl { animation: lblIn 0.3s var(--ease-out) both; }
.merged.play .lbl.br { animation: lblIn 0.3s var(--ease-out) both, lblDim 0.3s 1s var(--ease-out) both; }
.merged.play .tt { animation: openTop 0.2s var(--d) var(--ease-out) both, tint 0.25s calc(0.98s + var(--i) * 18ms) ease both; }
.merged.play .tb { animation: openBottom 0.2s var(--d) var(--ease-out) both; }
.merged.play .slider { animation: pull 0.8s 0.15s var(--ease-in-out) both, sliderOut 0.18s 0.95s var(--ease-out) forwards; }
.merged.play .done { animation: doneIn 0.4s 1s var(--bounce) both; }
.merged.play .done path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawIn 0.22s 1.12s var(--ease-out) forwards; }
.merged.play b, .merged.play span { animation: textIn 0.35s 1s var(--ease-out) both; }
@keyframes lblIn { from { opacity: 0; } }
@keyframes lblDim { from { opacity: 1; } }
/* Open: the rows stand apart; closing they snap into one line. */
@keyframes openTop { from { transform: translateY(-15px); } }
@keyframes openBottom { from { transform: translateY(15px); } }
/* Once closed, the branch takes main's colour, tooth by tooth. */
@keyframes tint { from { fill: #64d2ff; } to { fill: #a35cf7; } }
@keyframes pull { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(194px); } }
@keyframes sliderOut { from { opacity: 1; transform: translateX(194px); } to { opacity: 0; transform: translateX(200px) scale(0.6); } }
@keyframes doneIn { 0% { opacity: 0; transform: scale(0.5); } 60% { opacity: 1; transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes drawIn { to { stroke-dashoffset: 0; } }
@keyframes textIn { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } }
/* The merge card front lights up once when the merge lands */
.wcard.flash { animation: cardFlash 1.5s var(--spring); }
.wcard .sheen { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.34) 48%, rgba(196, 156, 255, 0.28) 54%, transparent 70%); transform: translateX(-120%); animation: sheen 1.1s 0.1s cubic-bezier(0.3, 0, 0.2, 1) forwards; }
.glyph.pop { animation: tilePop 0.62s 0.2s var(--bounce) both; }
@keyframes cardFlash { 0% { box-shadow: 0 0 0 0 rgba(163, 92, 247, 0); } 30% { box-shadow: 0 0 0 5px rgba(163, 92, 247, 0.5), 0 18px 40px -12px rgba(163, 92, 247, 0.7); } 100% { box-shadow: 0 0 0 0 rgba(163, 92, 247, 0); } }
@keyframes sheen { to { transform: translateX(120%); } }
/* Archived: the merge card flips to its empty side */
.wcard.swap { animation: cardSwap 0.62s var(--spring); }
@keyframes cardSwap { 0% { scale: 1; filter: none; } 40% { scale: 0.94; filter: brightness(0.75) saturate(0.6); } 100% { scale: 1; filter: none; } }
.wcard.swap > :not(.pattern) { animation: swapText 0.62s var(--spring); }
@keyframes swapText { 0% { opacity: 1; transform: none; } 40% { opacity: 0; transform: translateY(-8px); } 41% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }

/* Setup: what this repo needs, green and red dots */
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.18); }
.wbig { font: 700 28px/1.05 var(--display); letter-spacing: -0.01em; }
.ready { display: flex; flex-direction: column; gap: 12px; }
.ready b { font: 700 30px/1.05 var(--display); letter-spacing: -0.01em; }
.ready b span { color: var(--fg2); font-weight: 600; font-size: 20px; }
.segs { display: flex; gap: 4px; height: 8px; }
.segs i { flex: 1; border-radius: 4px; background: var(--fill); transform-origin: left; animation: segIn 0.5s var(--spring) both; animation-delay: calc(var(--i) * 45ms + 150ms); }
.segs i.on { background: linear-gradient(90deg, #30d158, #34c759); }
.segs i.miss { background: color-mix(in srgb, var(--warn) 55%, var(--fill)); }
@keyframes segIn { from { transform: scaleX(0); opacity: 0; } }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stile {
  position: relative; min-width: 0; min-height: 84px; border-radius: 18px; padding: 12px 14px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px; background: var(--surface);
  animation: rowIn 0.5s var(--spring) both; animation-delay: calc(var(--i, 0) * 40ms + 120ms);
}

.stile .mk svg { width: 15px; height: 15px; }
.stile.ok .mk { background: linear-gradient(155deg, #3ddc68, #1f9d45); }
.stile.warn { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sep); }
.stile.warn b { color: var(--fg2); }
.stile.warn .mk { background: var(--fill); color: var(--fg3); font: 700 15px/1 var(--rounded); }
.stile.fail { background: color-mix(in srgb, #ff453a 11%, var(--surface)); }
.stile.fail .mk { background: #ff453a; font: 800 15px/1 var(--rounded); }
.stile.fail small { color: #e5372c; font-weight: 600; }
.wide { grid-column: 1 / -1; }

/* Team: one avatar per chat, its ring shows the state */
.ava { position: relative; flex: none; width: var(--s, 40px); height: var(--s, 40px); border-radius: 50%; display: grid; place-items: center; color: #fff;
  font: 700 calc(var(--s, 40px) * 0.36)/1 var(--rounded); background: linear-gradient(155deg, var(--c1), var(--c2)); box-shadow: 0 0 0 2.5px var(--ring-bg, var(--surface)), 0 0 0 4.5px var(--st); }
.ava.working::after { content: ""; position: absolute; inset: -6.5px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--st); animation: rot 1.2s linear infinite; }
.ava .badge { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; border-radius: 50%; background: var(--st); color: #fff; display: grid; place-items: center; font: 800 11px/1 var(--rounded); box-shadow: 0 0 0 2px var(--ring-bg, var(--surface)); }
.ava .badge svg { width: 11px; height: 11px; }
.avas { display: flex; align-items: center; }
.avas .ava { --s: 32px; --ring-bg: #1b2236; }
.avas .ava + .ava { margin-left: -6px; }
.mrow { position: relative; width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; animation: rowIn 0.5s var(--spring) both; animation-delay: calc(var(--i, 0) * 40ms + 100ms); transition: background-color 0.25s; }
.mrow:active { background: var(--surface-2); }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; border-top: 0.5px solid var(--sep); }
.mrow .stext span { -webkit-line-clamp: 1; }
.mstate { flex: none; font-size: 13px; font-weight: 600; color: var(--st); }
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--st) 55%, transparent), 0 10px 26px -16px var(--st); animation: alertIn 0.6s var(--bounce) both; }
.alert .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.alert small { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--st); }
.alert p { margin: 0; font-size: 15.5px; overflow-wrap: anywhere; }
.alert .acts { display: flex; gap: 16px; margin-top: 4px; }
@keyframes alertIn { from { opacity: 0; transform: translateY(-10px) scale(0.97); } }
.goal { font: 600 18px/1.3 var(--display); margin: 0; overflow-wrap: anywhere; }

.pill { min-height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); color: var(--accent); font-weight: 600; font-size: 15px; text-transform: none; letter-spacing: 0; transition: transform 0.2s var(--spring); }
.pill:active { transform: scale(0.94); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.35s; z-index: 30; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px));
  background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(105%); transition: transform 0.55s var(--spring);
  max-width: 560px; margin: 0 auto; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.22);
}
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.pass { position: relative; overflow: hidden; color: #fff; background: radial-gradient(130% 100% at 100% 0%, var(--g, transparent) 0%, transparent 58%), radial-gradient(90% 80% at 0% 100%, rgba(0, 0, 0, 0.16), transparent 62%), linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%); flex: none; margin: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); border-radius: 20px; min-height: 148px; box-shadow: var(--shadow), inset 0 0.5px 0 rgba(255, 255, 255, 0.32), inset 0 0 0 0.5px rgba(255, 255, 255, 0.1); padding: 18px 20px 20px; touch-action: none; display: flex; flex-direction: column; gap: 12px; }
.pass::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 50%); pointer-events: none; }
.pass > * { position: relative; }
.pass.light { color: #1c1c1e; }
.sheet-grab { flex: none; display: grid; place-items: center; padding: 8px 0 10px; touch-action: none; cursor: grab; }
.sheet-grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--fg3); opacity: 0.8; }
.pass-head { display: flex; align-items: center; gap: 12px; }
.pass-head .txt { flex: 1; min-width: 0; }
.pass-head small { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; opacity: 0.75; text-transform: uppercase; }
.pass-head h2 { margin: 2px 0 0; font: 700 26px/1.1 var(--display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.round { flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); color: inherit; display: grid; place-items: center; font-size: 16px; transition: transform 0.2s var(--spring); }
.pass.light .round { background: rgba(28, 28, 30, 0.08); }
.round:active { transform: scale(0.9); }
.round[aria-pressed="true"] { color: #ffd60a; }
.pass.light .round[aria-pressed="true"] { color: var(--warn); }
.pass-status { display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); }
.pass.light .pass-status { background: rgba(28, 28, 30, 0.08); }
.pass-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, rgba(255, 255, 255, 0.8)); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; }
.lead { font-size: 17px; }
.muted { color: var(--fg2); font-size: 15px; }
textarea { width: 100%; font: inherit; color: var(--fg); background: var(--fill); border: 0; border-radius: 12px; padding: 11px 13px; resize: none; min-height: 74px; }
textarea::placeholder { color: var(--fg2); }
textarea:focus-visible { outline: none; }
.start-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.icon-action { min-width: 52px; border-radius: 14px; background: var(--fill); color: var(--accent); display: grid; place-items: center; transition: transform 0.18s var(--spring); }
.icon-action:active { transform: scale(0.94); }
.icon-action svg { width: 22px; height: 22px; }
.links-row { display: flex; justify-content: center; gap: 22px; }
.text-btn { color: var(--accent); font-size: 15px; font-weight: 500; padding: 6px 2px; min-height: 36px; }

/* Composer: opens at the top, so the keyboard never covers it */
.cscrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.35); opacity: 0; transition: opacity 0.3s; }
.cscrim.open { opacity: 1; }
.composer {
  position: fixed; z-index: 41; top: calc(10px + env(safe-area-inset-top, 0px));
  left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28); overflow: hidden;
  transform: translateY(-24px) scale(0.97); opacity: 0; transition: transform 0.5s var(--bounce), opacity 0.22s;
}
.composer.open { transform: none; opacity: 1; }
.c-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.c-head b { font-weight: 600; font-size: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.c-cancel { justify-self: start; color: var(--accent); font-size: 16px; padding: 8px 6px; min-height: 40px; }
.c-send { justify-self: end; background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; padding: 8px 16px; min-height: 36px; border-radius: 18px; transition: opacity 0.2s, transform 0.2s var(--spring); }
.c-send:active { transform: scale(0.95); }
.c-send[disabled] { opacity: 0.35; }
.c-body { display: flex; gap: 12px; padding: 6px 14px 14px; align-items: flex-start; }
.c-body .tile { position: relative; flex: none; width: 40px; height: 40px; border-radius: 11px; font-size: 14px; }
.c-body textarea { flex: 1; min-width: 0; background: transparent; padding: 9px 0 0; min-height: 96px; font-size: 17px; line-height: 1.4; }
.c-foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px 12px; border-top: 0.5px solid var(--sep); font-size: 13px; color: var(--fg2); }
.primary { width: 100%; background: var(--fg); color: var(--bg); font-weight: 600; padding: 15px; border-radius: 14px; text-align: center; transition: transform 0.18s var(--spring), opacity 0.2s; }
.primary:active { transform: scale(0.97); }
.primary[disabled] { opacity: 0.4; cursor: default; transform: none; }
.secondary { width: 100%; background: var(--fill); color: var(--accent); font-weight: 600; padding: 12px; border-radius: 14px; text-align: center; transition: transform 0.18s var(--spring); }
.secondary:active { transform: scale(0.97); }
.small { font-size: 13px; color: var(--fg2); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.kv + .kv { border-top: 0.5px solid var(--sep); padding-top: 10px; }
.kv span:first-child { color: var(--fg2); }
.kv span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
code { font: 14px var(--mono); }
ul.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { color: var(--accent); text-decoration: none; }
.cells { background: var(--surface); border-radius: 14px; overflow: hidden; }
details + details > summary { border-top: 0.5px solid var(--sep); }
summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary .chev { flex: none; width: 8px; height: 13px; color: var(--fg3); transition: transform 0.25s var(--spring); }
details[open] summary .chev { transform: rotate(90deg); }
summary span { min-width: 0; overflow-wrap: anywhere; }
summary small { color: var(--fg3); font-size: 13px; }
.doc { padding: 4px 16px 16px; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--display); line-height: 1.25; margin: 18px 0 6px; text-wrap: balance; }
.doc h1 { font-size: 21px; } .doc h2 { font-size: 19px; } .doc h3, .doc h4 { font-size: 17px; }
.doc p { margin: 8px 0; }
.doc ul, .doc ol { padding-left: 22px; margin: 8px 0; }
.doc code { font-size: 13.5px; background: var(--fill); padding: 1px 5px; border-radius: 5px; }
.doc pre { background: var(--fill); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.doc pre code { background: none; padding: 0; font-size: 12.5px; }
.doc blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--sep); color: var(--fg2); }
.doc a { color: var(--accent); }

/* Dynamic Island */
.island {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; z-index: 50;
  transform: translateX(-50%) scale(0.55); opacity: 0; pointer-events: none;
  background: #000; color: #fff; border-radius: 999px; padding: 10px 18px 10px 12px;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  transition: transform 0.45s var(--bounce), opacity 0.25s;
}
.island.show { transform: translateX(-50%) scale(1); opacity: 1; }
.island .ii { position: relative; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; font: 700 12px/1 var(--rounded); background: var(--loaded); }
.island .ii svg { width: 18px; height: 18px; }
.island .ispin { margin-left: 4px; }
.island .ispin[hidden] { display: none; }
.island b { font-weight: 600; font-size: 15px; display: block; }

@media (prefers-reduced-motion: reduce) {
