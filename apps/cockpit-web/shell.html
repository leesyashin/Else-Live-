<title>Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS inset-grouped lists on a grouped ground; a skill opens as a sheet that slides up from the bottom. */
:root {
  --bg: #f2f2f7;
  --cell: #ffffff;
  --cell-press: #e5e5ea;
  --fg: #1c1c1e;
  --fg2: #6c6c70;
  --fg3: #aeaeb2;
  --sep: rgba(60, 60, 67, 0.16);
  --fill: rgba(118, 118, 128, 0.12);
  --accent: #007aff;
  --on-accent: #ffffff;
  --loaded: #34c759;
  --warn: #ff9500;
  --scrim: rgba(0, 0, 0, 0.32);
  --island: #000000;
  --on-island: #ffffff;
  --c-design: #af52de;
  --c-code: #007aff;
  --c-daten: #30b0c7;
  --c-business: #ff9500;
  --c-personal: #5856d6;
  --c-more: #8e8e93;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 12px;
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --bounce: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --cell: #1c1c1e; --cell-press: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
    --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --on-accent: #ffffff;
    --loaded: #30d158; --warn: #ff9f0a; --scrim: rgba(0, 0, 0, 0.55); --island: #000000; --on-island: #ffffff;
    --c-design: #bf5af2; --c-code: #0a84ff; --c-daten: #40c8e0; --c-business: #ff9f0a; --c-personal: #5e5ce6; --c-more: #8e8e93;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e; --cell-press: #2c2c2e; --fg: #f5f5f7; --fg2: #98989f; --fg3: #636366;
  --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --accent: #0a84ff; --on-accent: #ffffff;
  --loaded: #30d158; --warn: #ff9f0a; --scrim: rgba(0, 0, 0, 0.55); --island: #000000; --on-island: #ffffff;
  --c-design: #bf5af2; --c-code: #0a84ff; --c-daten: #40c8e0; --c-business: #ff9f0a; --c-personal: #5e5ce6; --c-more: #8e8e93;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--fg); font: 17px/1.35 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 48px;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
main { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }

/* Large title */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; }
.top h1 { font: 700 34px/1.1 var(--display); letter-spacing: 0.01em; margin: 0; }
.top p { margin: 4px 0 0; color: var(--fg2); font-size: 15px; }
.link-state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); background: var(--fill); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.link-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg3); }
.link-state.on i { background: var(--loaded); }

/* Overview */
.overview { background: var(--cell); border-radius: 16px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--fg2); display: inline-flex; align-items: center; gap: 6px; }
.stat.loaded b { color: var(--loaded); }
.stat.rec b { color: var(--c-design); }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--fill); }
.bar i { display: block; height: 100%; transform-origin: left; animation: grow 0.7s var(--spring) both; }
@keyframes grow { from { transform: scaleX(0); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--fill); font-size: 15px; transition: transform 0.2s var(--spring), background-color 0.25s, color 0.25s; }
.chip:active { transform: scale(0.95); }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip small { color: var(--fg2); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--c, var(--fg)); color: #fff; }
.chip[aria-pressed="true"] i { background: #fff; }
.chip[aria-pressed="true"] small { color: rgba(255, 255, 255, 0.8); }
.chip.all { --c: var(--fg); }
.chip.all[aria-pressed="true"] { color: var(--bg); }
.chip.all[aria-pressed="true"] small { color: var(--bg); opacity: 0.75; }

/* Search */
.search { position: relative; margin-top: -12px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--fg2); pointer-events: none; }
.search input { width: 100%; font: inherit; color: var(--fg); background: var(--fill); border: 0; border-radius: 10px; padding: 9px 12px 9px 34px; }
.search input::placeholder { color: var(--fg2); }

/* Grouped lists */
.group { display: flex; flex-direction: column; gap: 6px; }
.group > h2 { font: 400 13px/1.3 var(--font); text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg2); margin: 0 16px; display: flex; justify-content: space-between; }
.group > p.foot { margin: 0 16px; font-size: 13px; color: var(--fg2); }
.cells { background: var(--cell); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px 10px 14px; position: relative; transition: background-color 0.2s; min-height: 58px; }
.row:active { background: var(--cell-press); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; border-top: 0.5px solid var(--sep); }
.tile { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--c); color: #fff; display: grid; place-items: center; position: relative; }
.tile svg { width: 19px; height: 19px; }
.tile.hollow { background: transparent; color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
.tile .live { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--loaded); box-shadow: 0 0 0 2px var(--cell); }
.tile .live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--loaded); animation: breathe 1.8s var(--spring) infinite; }
@keyframes breathe { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.4); opacity: 0; } }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.text b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.text span { font-size: 14px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trail { flex: none; display: flex; align-items: center; gap: 8px; color: var(--fg3); font-size: 15px; }
.trail svg { width: 8px; height: 13px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.pill.loaded { background: color-mix(in srgb, var(--loaded) 18%, transparent); color: var(--loaded); }
.pill.pending { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.pill.rec { background: color-mix(in srgb, var(--c-design) 16%, transparent); color: var(--c-design); }
.star { color: var(--warn); font-size: 14px; }
.empty { padding: 16px; color: var(--fg2); font-size: 15px; text-align: center; }
.time { font-variant-numeric: tabular-nums; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.35s; z-index: 30; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: calc(100% - 44px - env(safe-area-inset-top, 0px));
  background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform 0.5s var(--spring);
  max-width: 720px; margin: 0 auto; box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.18);
}
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.grab { padding: 8px 0 4px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--fg3); opacity: 0.6; }
.sheet-head { display: flex; align-items: center; gap: 14px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); touch-action: none; }
.sheet-head .tile { width: 56px; height: 56px; border-radius: 14px; }
.sheet-head .tile svg { width: 30px; height: 30px; }
.sheet-head h2 { font: 700 22px/1.2 var(--display); margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.sheet-head p { margin: 3px 0 0; color: var(--fg2); font-size: 14px; }
.sheet-head .text { gap: 0; }
.icon-btn { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--fg2); font-size: 17px; transition: transform 0.2s var(--spring); }
.icon-btn:active { transform: scale(0.9); }
.icon-btn.fav[aria-pressed="true"] { color: var(--warn); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--cell); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; }
.lead { font-size: 17px; }
.muted { color: var(--fg2); font-size: 15px; }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.status-line i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--fg3)); flex: none; }
textarea { width: 100%; font: inherit; color: var(--fg); background: var(--fill); border: 0; border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 76px; }
textarea::placeholder { color: var(--fg2); }
.primary { width: 100%; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 14px; border-radius: 12px; transition: transform 0.18s var(--spring), opacity 0.2s; }
.primary:active { transform: scale(0.97); }
.primary[disabled] { opacity: 0.45; cursor: default; transform: none; }
.secondary { width: 100%; background: var(--fill); color: var(--accent); font-weight: 600; padding: 12px; border-radius: 12px; transition: transform 0.18s var(--spring); }
.secondary:active { transform: scale(0.97); }
.hint { font-size: 13px; color: var(--fg2); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.kv + .kv { border-top: 0.5px solid var(--sep); padding-top: 10px; }
.kv span:first-child { color: var(--fg2); }
.kv span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv code, .card code { font: 14px var(--mono); }
ul.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { color: var(--accent); text-decoration: none; }
details + details > summary { border-top: 0.5px solid var(--sep); }
summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary .trail svg { transition: transform 0.25s var(--spring); }
details[open] summary .trail svg { transform: rotate(90deg); }
summary span { min-width: 0; overflow-wrap: anywhere; }
.doc { padding: 4px 16px 16px; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--display); line-height: 1.25; margin: 18px 0 6px; text-wrap: balance; }
.doc h1 { font-size: 21px; } .doc h2 { font-size: 19px; } .doc h3, .doc h4 { font-size: 17px; }
.doc p { margin: 8px 0; }
.doc ul, .doc ol { padding-left: 22px; margin: 8px 0; }
.doc code { font: 13.5px var(--mono); background: var(--fill); padding: 1px 5px; border-radius: 5px; }
.doc pre { background: var(--fill); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.doc pre code { background: none; padding: 0; font-size: 12.5px; }
.doc blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--sep); color: var(--fg2); }
.doc a { color: var(--accent); }
.doc .table { overflow-x: auto; }

/* Dynamic Island toast */
.island {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; z-index: 50;
  transform: translateX(-50%) scale(0.55); opacity: 0; pointer-events: none;
  background: var(--island); color: var(--on-island); border-radius: 999px; padding: 10px 18px 10px 12px;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  transition: transform 0.45s var(--bounce), opacity 0.25s;
}
.island.show { transform: translateX(-50%) scale(1); opacity: 1; }
.island i { width: 26px; height: 26px; border-radius: 50%; background: var(--loaded); display: grid; place-items: center; flex: none; color: #fff; font-style: normal; font-size: 14px; }
.island.warn i { background: var(--warn); }
.island b { font-weight: 600; font-size: 15px; display: block; }
.island span { font-size: 13px; opacity: 0.75; display: block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<main>
  <header class="top">
    <div>
      <h1>Cockpit</h1>
      <p id="subtitle">Skills dieser Session</p>
    </div>
    <span class="link-state" id="link"><i></i><span>Verbinde …</span></span>
  </header>

  <section class="overview" aria-label="Übersicht">
    <div class="stats">
      <div class="stat loaded"><b id="n-loaded">0</b><span>geladen</span></div>
      <div class="stat"><b id="n-total">0</b><span>verfügbar</span></div>
      <div class="stat rec"><b id="n-rec">0</b><span>empfohlen</span></div>
    </div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="chips" id="chips" role="toolbar" aria-label="Kategorie"></div>
  </section>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Skill suchen" autocomplete="off" aria-label="Skill suchen">
  </label>

  <div id="lists" style="display:flex;flex-direction:column;gap:28px"></div>

  <section class="group">
    <p class="foot">„Starten“ schickt den Auftrag als Kommentar an Claude in deiner Session. Claude startet den Skill und antwortet im Kommentar. Der grüne Punkt zeigt, was in dieser Session wirklich geladen wurde.</p>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab" id="grab"><i></i></div>
  <div class="sheet-head" id="sheet-head"></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="island" id="island" role="status" aria-live="polite"><i>✓</i><div><b></b><span></span></div></div>

<script type="application/json" id="index">__INDEX__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('index').textContent)
  const CATS = [
    { id: 'Design', color: 'var(--c-design)', icon: '<path d="M4 20l4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/>' },
    { id: 'Code', color: 'var(--c-code)', icon: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>' },
    { id: 'Daten', color: 'var(--c-daten)', icon: '<path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/>' },
    { id: 'Business', color: 'var(--c-business)', icon: '<rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3.5 13h17"/>' },
    { id: 'Persönlich', color: 'var(--c-personal)', icon: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>' },
    { id: 'Weitere', color: 'var(--c-more)', icon: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>' },
  ]
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]))
  const CHEVRON = '<svg viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>'
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v) } catch { return fallback } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)) } catch {} },
  }

  const state = {
    filter: store.get('cockpit.filter', 'Alle'),
    query: '',
    favorites: new Set(store.get('cockpit.favorites', [])),
    loaded: [],          // [{ skill, at }] from the session, newest last
    pending: new Map(),  // skill -> sent at (ms)
    canSend: 'unknown',
    open: null,
  }
  const details = { promise: null }
  const use = name => (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use(name).catch(() => null)
    : Promise.resolve(null)

  const tile = (cat, hollow, live) =>
    `<span class="tile${hollow ? ' hollow' : ''}" style="--c:${CAT[cat].color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CAT[cat].icon}</svg>${live ? '<span class="live"></span>' : ''}</span>`

  function ago(at) {
    const minutes = Math.floor((Date.now() - at) / 60000)
    if (minutes < 1) return 'gerade eben'
    if (minutes < 60) return `vor ${minutes} Min`
    const hours = Math.floor(minutes / 60)
    return hours < 24 ? `vor ${hours} Std` : new Date(at).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
  }

  const loadedSet = () => new Set(state.loaded.map(use => use.skill))
  const installedIds = new Set(DATA.skills.map(s => s.short))
  const recommended = DATA.recommended.filter(r => !installedIds.has(r.id))

  function matches(skill) {
    const q = state.query.trim().toLowerCase()
    if (!q) return true
    return [skill.name, skill.summary, skill.description].some(t => String(t).toLowerCase().includes(q))
  }

  function skillRow(skill, live) {
    const pending = state.pending.has(skill.name) && !live
    const badge = live ? '<span class="pill loaded">Geladen</span>' : pending ? '<span class="pill pending">Startet …</span>' : ''
    const star = state.favorites.has(skill.name) ? '<span class="star" aria-label="Favorit">★</span>' : ''
    return `<button class="row" data-skill="${esc(skill.name)}">${tile(skill.category, false, live)}
      <span class="text"><b>${esc(skill.short)}</b><span>${esc(skill.summary)}</span></span>
      <span class="trail">${star}${badge}${CHEVRON}</span></button>`
  }

  function recRow(rec) {
    return `<button class="row" data-rec="${esc(rec.id)}">${tile('Design', true, false)}
      <span class="text"><b>${esc(rec.title)}</b><span>${esc(rec.author)} · ${esc(rec.summary)}</span></span>
      <span class="trail"><span class="pill rec">Empfohlen</span>${CHEVRON}</span></button>`
  }

  function renderOverview() {
    const live = loadedSet()
    $('n-loaded').textContent = live.size
    $('n-total').textContent = DATA.skills.length
    $('n-rec').textContent = recommended.length
    const total = DATA.skills.length
    $('bar').innerHTML = CATS.map((c, i) => {
      const n = DATA.skills.filter(s => s.category === c.id).length
      return n ? `<i style="flex:${n};background:${c.color};animation-delay:${i * 60}ms" title="${c.id}: ${n}"></i>` : ''
    }).join('')
    const chip = (id, label, color, count) =>
      `<button class="chip${id === 'Alle' ? ' all' : ''}" data-filter="${esc(id)}" aria-pressed="${state.filter === id}" style="--c:${color}"><i></i>${esc(label)} <small>${count}</small></button>`
    $('chips').innerHTML = chip('Alle', 'Alle', 'var(--fg)', total) +
      CATS.map(c => chip(c.id, c.id, c.color, DATA.skills.filter(s => s.category === c.id).length + (c.id === 'Design' ? recommended.length : 0))).join('')
    $('subtitle').textContent = live.size
      ? `${live.size} ${live.size === 1 ? 'Skill' : 'Skills'} in dieser Session geladen`
      : `${total} Skills bereit · noch keiner geladen`
  }

  function renderLists() {
    const live = loadedSet()
    const filtered = DATA.skills.filter(s => (state.filter === 'Alle' || s.category === state.filter) && matches(s))
    const parts = []

    if (state.loaded.length && state.filter === 'Alle' && !state.query) {
      const seen = new Set()
      const timeline = [...state.loaded].reverse().filter(u => !seen.has(u.skill) && seen.add(u.skill)).slice(0, 8)
      const rows = timeline.map(use => {
        const skill = DATA.skills.find(s => s.name === use.skill)
        const cat = skill ? skill.category : 'Weitere'
        return `<button class="row" ${skill ? `data-skill="${esc(skill.name)}"` : 'disabled'}>${tile(cat, false, true)}
          <span class="text"><b>${esc(skill ? skill.short : use.skill)}</b><span class="time">${esc(ago(use.at))}</span></span>
          <span class="trail">${CHEVRON}</span></button>`
      }).join('')
      parts.push(`<section class="group"><h2><span>Zuletzt geladen</span></h2><div class="cells">${rows}</div></section>`)
    }

    const favs = filtered.filter(s => state.favorites.has(s.name))
    if (favs.length) parts.push(`<section class="group"><h2><span>Favoriten</span></h2><div class="cells">${favs.map(s => skillRow(s, live.has(s.name))).join('')}</div></section>`)

    for (const c of CATS) {
      const members = filtered.filter(s => s.category === c.id && !state.favorites.has(s.name))
      const recs = c.id === 'Design' && (state.filter === 'Alle' || state.filter === 'Design')
        ? recommended.filter(r => !state.query || [r.title, r.author, r.summary].some(t => t.toLowerCase().includes(state.query.trim().toLowerCase())))
        : []
      if (!members.length && !recs.length) continue
      parts.push(`<section class="group"><h2><span>${esc(c.id)}</span><span>${members.length}</span></h2><div class="cells">${members.map(s => skillRow(s, live.has(s.name))).join('')}${recs.map(recRow).join('')}</div></section>`)
    }

    if (!parts.length) parts.push(`<div class="cells"><p class="empty">Kein Skill passt zu „${esc(state.query)}“.</p></div>`)
    $('lists').innerHTML = parts.join('')
  }

  function render() { renderOverview(); renderLists(); refreshSheet() }

  // --- Markdown, kept small and safe: everything is escaped first ----------------
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  }
  function markdown(src) {
    const out = []
    const lines = String(src).replace(/\r/g, '').split('\n')
    let list = null, para = [], fence = null, table = []
    const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = [] } }
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null } }
    const flushTable = () => { if (table.length) { out.push(`<div class="table"><pre><code>${esc(table.join('\n'))}</code></pre></div>`); table = [] } }
    const flush = () => { flushPara(); flushList(); flushTable() }
    for (const line of lines) {
      if (fence) {
        if (/^\s*```/.test(line)) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null } else fence.push(line)
        continue
      }
      if (/^\s*```/.test(line)) { flush(); fence = []; continue }
      if (/^\s*\|/.test(line)) { flushPara(); flushList(); table.push(line); continue }
      flushTable()
      const h = line.match(/^(#{1,6})\s+(.*)$/)
      if (h) { flush(); const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue }
      const li = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)
      if (li) {
        flushPara()
        const tag = /\d/.test(li[1]) ? 'ol' : 'ul'
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] } }
        list.items.push(li[2]); continue
      }
      const q = line.match(/^>\s?(.*)$/)
      if (q) { flush(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue }
      if (!line.trim()) { flush(); continue }
      if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += ' ' + line.trim(); continue }
      flushList(); para.push(line.trim())
    }
    if (fence) out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`)
    flush()
    return out.join('')
  }

  // --- Sheet ----------------------------------------------------------------------
  function loadDetails() {
    details.promise ??= fetch('skills.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
    return details.promise
  }

  function sendAvailable() { return state.canSend === 'available' }
  function sendReason() {
    return {
      writers_only: 'Nur Bearbeiter dieser Seite können Claude Aufträge schicken.',
      no_session: 'Gerade hört keine Claude-Session zu. Öffne die Session, dann klappt es.',
      off: 'Aufträge an Claude sind in dieser Ansicht nicht möglich.',
      unknown: 'Verbindung zu Claude wird geprüft …',
      none: 'Diese Ansicht kann keine Aufträge an Claude schicken.',
    }[state.canSend] || 'Aufträge an Claude sind gerade nicht möglich.'
  }

  // A refresh while the sheet is open (status, connection, favorite) touches
  // only the live parts, so an opened SKILL.md and a typed task stay as they are.
  function refreshSheet() {
    const open = state.open
    if (!open) return
    const go = $('go'), hint = $('go-hint')
    if (go) go.disabled = !sendAvailable()
    if (hint) { hint.hidden = sendAvailable(); hint.textContent = sendReason() }
    if (!open.skill) return
    const skill = DATA.skills.find(s => s.name === open.skill)
    const st = skillStatus(skill)
    const line = $('sheet-status')
    if (line) { line.style.setProperty('--c', st.c); line.querySelector('span').textContent = st.t }
    const fav = $('sheet-head').querySelector('[data-fav]')
    if (fav) { const on = state.favorites.has(skill.name); fav.setAttribute('aria-pressed', on); fav.textContent = on ? '★' : '☆' }
    const t = $('sheet-head').querySelector('.tile')
    if (t && loadedSet().has(skill.name) && !t.querySelector('.live')) t.insertAdjacentHTML('beforeend', '<span class="live"></span>')
  }

  function skillStatus(skill) {
    const live = loadedSet().has(skill.name)
    const uses = state.loaded.filter(u => u.skill === skill.name)
    const pending = state.pending.has(skill.name) && !live
    return live
      ? { c: 'var(--loaded)', t: `In dieser Session geladen · ${uses.length}× · zuletzt ${ago(uses[uses.length - 1].at)}` }
      : pending ? { c: 'var(--accent)', t: 'Auftrag ist bei Claude, der Skill startet gleich' }
      : { c: 'var(--fg3)', t: 'Verfügbar · Claude sieht ihn und kann ihn selbst wählen' }
  }

  async function renderSheet() {
    const open = state.open
    if (!open) return
    const head = $('sheet-head'), body = $('sheet-body')
    if (open.rec) {
      const rec = DATA.recommended.find(r => r.id === open.rec)
      head.innerHTML = `${tile('Design', true, false)}<div class="text"><h2 id="sheet-title">${esc(rec.title)}</h2><p>${esc(rec.author)} · nicht installiert</p></div>
        <button class="icon-btn" data-close aria-label="Schließen">✕</button>`
      body.innerHTML = `
        <div class="card"><p class="lead">${esc(rec.summary)}</p></div>
        <div class="card"><b>Was er tut</b><ul class="rules">${rec.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
        <div class="card"><b>Referenzen</b><p class="muted">${esc(rec.referenceNote)}</p>
          <div class="links">${rec.references.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div></div>
        ${rec.note ? `<div class="card"><p class="muted">⚠︎ ${esc(rec.note)}</p></div>` : ''}
        <div class="card"><div class="kv"><span>Installation</span><span><code>${esc(rec.install)}</code></span></div></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="primary" id="go" data-install="${esc(rec.id)}" ${sendAvailable() ? '' : 'disabled'}>Von Claude installieren lassen</button>
          <p class="hint" id="go-hint" ${sendAvailable() ? 'hidden' : ''}>${esc(sendReason())}</p>
        </div>`
      return
    }

    const skill = DATA.skills.find(s => s.name === open.skill)
    const live = loadedSet().has(skill.name)
    const fav = state.favorites.has(skill.name)
    const status = skillStatus(skill)
    head.innerHTML = `${tile(skill.category, false, live)}<div class="text"><h2 id="sheet-title">${esc(skill.short)}</h2><p>${esc(skill.category)} · ${esc(skill.source)}</p></div>
      <button class="icon-btn fav" data-fav="${esc(skill.name)}" aria-pressed="${fav}" aria-label="Favorit">${fav ? '★' : '☆'}</button>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button>`

    body.innerHTML = `
      <div class="card">
        <div class="status-line" id="sheet-status" style="--c:${status.c}"><i></i><span>${esc(status.t)}</span></div>
        <p class="lead">${esc(skill.summary)}</p>
        ${skill.description ? `<p class="muted">${esc(skill.description)}</p>` : ''}
      </div>
      <div class="card">
        <label for="task" class="hint">Aufgabe für den Skill (optional)</label>
        <textarea id="task" maxlength="3000" placeholder="Zum Beispiel: Prüf die Startseite von Else-Live-"></textarea>
        <button class="primary" id="go" data-start="${esc(skill.name)}" ${sendAvailable() ? '' : 'disabled'}>Starten</button>
        <p class="hint" id="go-hint" ${sendAvailable() ? 'hidden' : ''}>${esc(sendReason())}</p>
        <button class="secondary" data-copy="${esc(skill.name)}">Befehl kopieren</button>
      </div>
      <div class="card">
        <div class="kv"><span>Befehl</span><span><code>/${esc(skill.name)}</code></span></div>
        <div class="kv"><span>Herkunft</span><span>${esc(skill.source)}</span></div>
        <div class="kv"><span>Dateien</span><span>${skill.hasFiles ? `Anleitung${skill.fileCount ? ` + ${skill.fileCount} Referenzen` : ''}` : 'eingebaut, keine Dateien'}</span></div>
      </div>
      <div id="docs">${skill.hasFiles ? '<div class="card"><p class="muted">Lade Anleitung …</p></div>' : ''}</div>`

    if (skill.hasFiles) {
      const all = await loadDetails()
      if (state.open !== open) return
      const d = all[skill.name]
      const docs = $('docs')
      if (!d) { docs.innerHTML = '<div class="card"><p class="muted">Die Anleitung konnte nicht geladen werden.</p></div>'; return }
      docs.innerHTML = `<section class="group"><h2><span>Anleitung &amp; Referenzen</span></h2><div class="cells">
        <details><summary><span>SKILL.md · was Claude liest</span><span class="trail">${CHEVRON}</span></summary><div class="doc">${markdown(d.body)}</div></details>
        ${d.files.map(f => `<details><summary><span>${esc(f.label)}</span><span class="trail">${f.text === undefined ? `<small>${f.kind === 'other' ? 'Datei' : 'zu groß'}</small>` : ''}${CHEVRON}</span></summary>
          <div class="doc">${f.text === undefined ? `<p class="muted">${esc(f.label)} · ${Math.round(f.size / 1024)} KB, hier nicht darstellbar.</p>` : f.kind === 'text' && /\.md$/i.test(f.label) ? markdown(f.text) : `<pre><code>${esc(f.text)}</code></pre>`}</div></details>`).join('')}
      </div></section>`
    }
  }

  let lastFocus = null
  function openSheet(target) {
    lastFocus = document.activeElement
    state.open = target
    const sheet = $('sheet'), scrim = $('scrim')
    sheet.hidden = false; scrim.hidden = false
    document.body.classList.add('locked')
    renderSheet()
    $('sheet-body').scrollTop = 0
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open') }))
    setTimeout(() => sheet.querySelector('[data-close]')?.focus({ preventScroll: true }), 350)
  }
  function closeSheet() {
    const sheet = $('sheet'), scrim = $('scrim')
    sheet.style.transform = ''
    sheet.classList.remove('open', 'dragging'); scrim.classList.remove('open')
    document.body.classList.remove('locked')
    state.open = null
    setTimeout(() => { if (!state.open) { sheet.hidden = true; scrim.hidden = true } }, 500)
    lastFocus?.focus?.({ preventScroll: true })
  }

  // Drag the sheet down by its grabber or header to dismiss it.
  ;(() => {
    let startY = 0, lastY = 0, lastT = 0, velocity = 0, dragging = false
    const sheet = $('sheet')
    const down = e => {
      if (e.target.closest('button')) return
      dragging = true; startY = lastY = e.clientY; lastT = performance.now(); velocity = 0
      sheet.classList.add('dragging'); e.currentTarget.setPointerCapture?.(e.pointerId)
    }
    const move = e => {
      if (!dragging) return
      const now = performance.now()
      velocity = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now
      const dy = Math.max(0, e.clientY - startY)
      sheet.style.transform = `translateY(${dy < 0 ? dy / 3 : dy}px)`
    }
    const up = () => {
      if (!dragging) return
      dragging = false; sheet.classList.remove('dragging')
      const dy = lastY - startY
      if (dy > 120 || velocity > 0.6) closeSheet(); else sheet.style.transform = ''
    }
    for (const el of [$('grab'), $('sheet-head')]) {
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move)
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
    }
  })()

  // --- Dynamic Island -------------------------------------------------------------
  let islandTimer = 0
  function island(title, detail, warn = false) {
    const el = $('island')
    el.classList.toggle('warn', warn)
    el.querySelector('i').textContent = warn ? '!' : '✓'
    el.querySelector('b').textContent = title
    el.querySelector('span').textContent = detail || ''
    el.classList.add('show')
    clearTimeout(islandTimer)
    islandTimer = setTimeout(() => el.classList.remove('show'), 3200)
  }

  // --- Talking to Claude --------------------------------------------------------
  let comments = null
  async function refreshLink() {
    if (!comments) { state.canSend = 'none' }
    else { try { state.canSend = await comments.canSendToClaude() } catch { state.canSend = 'off' } }
    const link = $('link')
    link.classList.toggle('on', state.canSend === 'available')
    link.querySelector('span').textContent = state.canSend === 'available' ? 'Mit Claude verbunden' : state.canSend === 'unknown' ? 'Verbinde …' : 'Ohne Claude'
    refreshSheet()
  }

  async function sendToClaude(text, anchorEl) {
    if (!comments || !sendAvailable()) { island('Nicht gesendet', sendReason(), true); return false }
    try {
      const anchor = await comments.anchorFor(anchorEl)
      await comments.sendToClaude({ anchor, text })
      return true
    } catch (error) {
      const code = error && error.code
      const why = {
        consent_required: 'Erlaube der Seite einmal, in deinem Namen zu kommentieren.',
        forbidden: 'Kommentieren von der Seite aus ist hier aus.',
        claude_unavailable: 'Gerade hört keine Claude-Session zu.',
        rate_limited: 'Kurz warten, dann noch einmal.',
      }[code] || 'Etwas ist schiefgegangen. Versuch es gleich noch einmal.'
      island('Nicht gesendet', why, true)
      if (code === 'forbidden' || code === 'claude_unavailable') refreshLink()
      return false
    }
  }

  async function copyCommand(name, task) {
    const text = `/${name}${task ? ' ' + task : ''}`
    try { await navigator.clipboard.writeText(text); island('Befehl kopiert', 'Im Chat einfügen und senden') }
    catch { island('Kopieren ging nicht', text, true) }
  }

  // --- Events ---------------------------------------------------------------------
  document.addEventListener('click', async e => {
    const t = e.target.closest('button, .scrim')
    if (!t) return
    if (t.id === 'scrim' || t.hasAttribute('data-close')) return closeSheet()
    if (t.dataset.filter) { state.filter = t.dataset.filter; store.set('cockpit.filter', state.filter); render(); return }
    if (t.dataset.skill) return openSheet({ skill: t.dataset.skill })
    if (t.dataset.rec) return openSheet({ rec: t.dataset.rec })
    if (t.dataset.fav) {
      const name = t.dataset.fav
      state.favorites.has(name) ? state.favorites.delete(name) : state.favorites.add(name)
      store.set('cockpit.favorites', [...state.favorites])
      render(); return
    }
    if (t.dataset.copy) return copyCommand(t.dataset.copy, ($('task')?.value || '').trim())
    if (t.dataset.start) {
      const name = t.dataset.start
      const task = ($('task')?.value || '').trim()
      t.disabled = true
      const sent = await sendToClaude(`Cockpit · Skill starten\n/${name}${task ? ' ' + task : ''}`, t)
      t.disabled = !sendAvailable()
      if (sent) {
        state.pending.set(name, Date.now())
        island('An Claude geschickt', `${name.split(':').pop()} startet gleich`)
        render()
      }
      return
    }
    if (t.dataset.install) {
      const rec = DATA.recommended.find(r => r.id === t.dataset.install)
      t.disabled = true
      const sent = await sendToClaude(`Cockpit · Skill installieren\n${rec.title} von ${rec.author}: ${rec.install}`, t)
      t.disabled = !sendAvailable()
      if (sent) island('An Claude geschickt', `${rec.title} wird installiert`)
    }
  })
  $('q').addEventListener('input', e => { state.query = e.target.value; renderLists() })
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) closeSheet() })
  setInterval(() => { if (state.loaded.length) render() }, 60000)

  render()

  // --- Live status from the session (written by Claude) ---------------------------
  ;(async () => {
    const db = await use('db')
    if (!db) return
    db.doc('cockpit/status').onSnapshot(snap => {
      const data = snap.exists ? snap.data() : null
      const loaded = Array.isArray(data?.loaded) ? data.loaded.filter(u => u && typeof u.skill === 'string' && typeof u.at === 'number') : []
      const before = loadedSet()
      state.loaded = loaded.slice(-200)
      for (const [name, at] of state.pending) {
        if (state.loaded.some(u => u.skill === name && u.at >= at - 60000)) state.pending.delete(name)
      }
      const fresh = state.loaded.filter(u => !before.has(u.skill))
      if (before.size && fresh.length) island('Skill geladen', fresh.map(u => u.skill.split(':').pop()).join(', '))
      render()
    }, () => {})
  })()
  ;(async () => {
    comments = await use('comments')
    await refreshLink()
    setInterval(refreshLink, 30000)
  })()
})()
</script>
